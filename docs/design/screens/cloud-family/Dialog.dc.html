<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div role="dialog" aria-label="{{ title }}" style="display:flex;flex-direction:column;gap:16px;color:var(--popover-foreground);font-family:var(--font-sans)"><div style="display:flex;align-items:center;gap:12px"><sc-if value="{{ danger }}" hint-placeholder-val="{{ false }}"><span style="width:44px;height:44px;border-radius:22px;background:color-mix(in oklch,var(--destructive) 12%,transparent);color:var(--destructive);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.{{ icon }}" size="21" hint-size="21px,21px"></x-import></span></sc-if><sc-if value="{{ calm }}" hint-placeholder-val="{{ true }}"><span style="width:44px;height:44px;border-radius:22px;background:var(--secondary);color:var(--secondary-foreground);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.{{ icon }}" size="21" hint-size="21px,21px"></x-import></span></sc-if><span style="flex:1;font-size:20px;font-weight:600;letter-spacing:-0.01em;line-height:1.2;text-wrap:pretty">{{ title }}</span></div><div style="display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.5;text-wrap:pretty"><span>{{ body }}</span><sc-if value="{{ note }}" hint-placeholder-val="{{ true }}"><span style="font-size:13px;line-height:1.45;color:var(--muted-foreground)">{{ note }}</span></sc-if></div><sc-if value="{{ tip }}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:10px;padding:12px 14px;border-radius:14px;background:var(--muted);font-size:13px;line-height:1.45;text-wrap:pretty"><span style="flex-shrink:0;display:flex;margin-top:1px"><x-import component-from-global-scope="Library.KeyRoundIcon" size="16" hint-size="16px,16px"></x-import></span><span>{{ tip }}</span></div></sc-if><sc-if value="{{ hasChoices }}" hint-placeholder-val="{{ false }}"><div role="radiogroup" style="display:flex;flex-direction:column;border:1px solid var(--border);border-radius:16px;overflow:hidden"><sc-for list="{{ choices }}" as="c" hint-placeholder-count="2"><div role="radio" aria-checked="{{ c.on }}" style="display:flex;align-items:center;gap:14px;min-height:64px;padding:10px 14px;border-bottom:1px solid var(--border)"><sc-if value="{{ c.on }}" hint-placeholder-val="{{ true }}"><span style="width:22px;height:22px;border-radius:11px;border:2px solid var(--primary);box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="width:10px;height:10px;border-radius:5px;background:var(--primary)"></span></span></sc-if><sc-if value="{{ c.off }}" hint-placeholder-val="{{ false }}"><span style="width:22px;height:22px;border-radius:11px;border:1.5px solid var(--muted-foreground);box-sizing:border-box;flex-shrink:0"></span></sc-if><span style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:500">{{ c.t }}</span><span style="font-size:13px;line-height:1.4;color:var(--muted-foreground);text-wrap:pretty">{{ c.s }}</span></span></div></sc-for></div></sc-if><div style="display:flex;flex-direction:column;gap:10px"><sc-for list="{{ buttons }}" as="b" hint-placeholder-count="2"><sc-if value="{{ b.primary }}" hint-placeholder-val="{{ false }}"><button style="height:52px;border-radius:14px;border:0;background:var(--primary);color:var(--primary-foreground);font:600 15px var(--font-sans)">{{ b.l }}</button></sc-if><sc-if value="{{ b.danger }}" hint-placeholder-val="{{ false }}"><button style="height:52px;border-radius:14px;border:0;background:var(--destructive);color:var(--destructive-foreground);font:600 15px var(--font-sans)">{{ b.l }}</button></sc-if><sc-if value="{{ b.outline }}" hint-placeholder-val="{{ true }}"><button style="height:52px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--foreground);font:500 15px var(--font-sans)">{{ b.l }}</button></sc-if></sc-for></div><sc-if value="{{ foot }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;text-align:center;color:var(--muted-foreground);text-wrap:pretty;margin-top:-6px">{{ foot }}</span></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:520},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;cloudOff&quot;,&quot;otherOwner&quot;,&quot;otherOwnerAdmin&quot;,&quot;removeDevice&quot;,&quot;kick&quot;,&quot;kickLast&quot;,&quot;leave&quot;],&quot;default&quot;:&quot;cloudOff&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'cloudOff';
    const btn = (l, t = 'outline') => ({ l, primary: t === 'primary', danger: t === 'danger', outline: t === 'outline' });
    const ch = (t, s, on) => ({ t, s, on, off: !on });
    const K = {
      cloudOff: { icon: 'CloudIcon', title: '¿Apagar el acceso por la nube en Casa?', body: 'Los dispositivos que ya están en Casa siguen igual.', note: 'Los nuevos tendrás que vincularlos tú a mano, aunque su persona tenga cuenta.', buttons: [btn('Apagar', 'primary'), btn('Cancelar')] },
      otherOwner: { icon: 'TabletIcon', title: 'En Casa, esta tablet es de Hugo', body: 'Has entrado con tu cuenta, pero quien administra dijo que esta tablet es de Hugo.', choices: [ch('Dejarlo como está', 'Sigue siendo de Hugo. Aquí ves Casa como Hugo · lector.', true), ch('Pedir a quien administra que lo cambie', 'Mientras tanto, se queda como está.', false)], buttons: [btn('Seguir', 'primary')], foot: 'No volveremos a preguntarlo en esta tablet.' },
      otherOwnerAdmin: { icon: 'TabletIcon', title: 'En Casa, esta tablet es de Hugo', body: 'Has entrado con tu cuenta, pero en Casa esta tablet figura como de Hugo.', choices: [ch('Dejarlo como está', 'Sigue siendo de Hugo. Aquí ves Casa como Hugo · lector.', false), ch('Hacerla mía', 'Pasa a ser de Laura · administradora. Hugo conserva su móvil.', true)], buttons: [btn('Hacerla mía', 'primary'), btn('Cancelar')], foot: 'Puedes cambiarlo después en Personas y permisos.' },
      removeDevice: { danger: true, icon: 'SmartphoneIcon', title: '¿Quitar el Móvil de Laura?', body: 'Dejará de tener el rol de Laura en Casa. La nube no se lo devolverá sola, aunque siga con la sesión abierta.', note: 'Laura sigue en Casa con su Portátil.', tip: 'Si lo ha perdido, conviene además que Laura lo quite de «Mis dispositivos» en su cuenta, o que cambie la contraseña.', buttons: [btn('Quitar el dispositivo', 'danger'), btn('Cancelar')] },
      kick: { danger: true, icon: 'UserRoundMinusIcon', title: '¿Quitar a Laura de Casa?', body: 'Dejará de poder entrar al momento, ni con sus dispositivos ni con su cuenta.', note: 'Su nombre sigue en Casa: sus libros siguen siendo suyos y se conservan sus préstamos y lo que marcó. Lo que ya haya copiado fuera de la app no se le puede quitar.', buttons: [btn('Quitar a Laura', 'danger'), btn('Cancelar')], foot: 'Podrás devolverle el acceso más tarde.' },
      kickLast: { icon: 'ShieldCheckIcon', title: 'Laura es la única que administra Casa', body: 'Si se va, nadie podrá cambiar los permisos ni dar acceso a dispositivos nuevos.', note: 'Primero nombra a otra persona administradora.', buttons: [btn('Nombrar a otra persona', 'primary'), btn('Cerrar')] },
      leave: { icon: 'LogOutIcon', title: '¿Salir de Casa en este móvil?', body: 'Casa se va solo de este móvil. Tus otros dispositivos la conservan, y la nube no volverá a bajarla aquí.', note: 'Si quieres, guarda antes una copia.', buttons: [btn('Guardar una copia y salir', 'primary'), btn('Salir sin copia'), btn('Cancelar')] }
    }[k];
    return { icon: K.icon, title: K.title, body: K.body, note: K.note ?? '', tip: K.tip ?? '', danger: !!K.danger, calm: !K.danger, hasChoices: !!K.choices, choices: K.choices ?? [], buttons: K.buttons, foot: K.foot ?? '' };
  }
}
</script>
</body>
</html>
