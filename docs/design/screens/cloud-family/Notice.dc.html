<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div style="width:100%;height:100%;display:flex;flex-direction:column;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><sc-if value="{{ m }}" hint-placeholder-val="{{ true }}"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import></sc-if><div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:32px 28px;max-width:420px;width:100%;box-sizing:border-box;margin:0 auto"><div style="width:56px;height:56px;border-radius:28px;background:var(--secondary);color:var(--secondary-foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.{{ icon }}" size="26" hint-size="26px,26px"></x-import></div><div style="display:flex;flex-direction:column;gap:10px"><h1 style="margin:0;font-size:24px;font-weight:600;letter-spacing:-0.02em;line-height:1.2;text-wrap:pretty">{{ title }}</h1><p style="margin:0;font-size:15px;line-height:1.5;color:var(--muted-foreground);text-wrap:pretty">{{ body }}</p></div><div style="display:flex;flex-direction:column;gap:10px"><button style="height:48px;border-radius:12px;border:0;background:var(--primary);color:var(--primary-foreground);font:600 15px var(--font-sans)">{{ primary }}</button><sc-if value="{{ note }}" hint-placeholder-val="{{ true }}"><span style="font-size:13px;text-align:center;color:var(--muted-foreground);text-wrap:pretty">{{ note }}</span></sc-if></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;shell&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;m&quot;,&quot;d&quot;],&quot;default&quot;:&quot;m&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;removedByAdmin&quot;,&quot;revokedDeleted&quot;],&quot;default&quot;:&quot;removedByAdmin&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = (this.props.shell ?? 'm') === 'm', k = this.props.kind ?? 'removedByAdmin';
    const K = {
      removedByAdmin: ['SmartphoneIcon', 'Quien administra «Casa» ha quitado este dispositivo', 'Para volver, pídele que lo vincule otra vez.', 'Ir a mis bibliotecas', 'Tus otras bibliotecas siguen aquí.'],
      revokedDeleted: ['UserRoundXIcon', 'Ya no estás en «Casa»', 'Quien la administra te ha retirado el acceso, y la biblioteca se ha borrado de este dispositivo.', 'Ir a mis bibliotecas', 'Si crees que es un error, habla con quien administra «Casa».']
    }[k];
    return { m, d: !m, icon: K[0], title: K[1], body: K[2], primary: K[3], note: K[4] };
  }
}
</script>
</body>
</html>
