<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div style="width:100%;height:100%;display:flex;flex-direction:column;background:var(--background);color:var(--foreground);font-family:var(--font-sans);overflow:hidden"><sc-if value="{{ m }}" hint-placeholder-val="{{ true }}"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><header style="height:64px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 4px"><button aria-label="Atrás" style="width:48px;height:48px;border:0;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.ArrowLeftIcon" size="22" hint-size="22px,22px"></x-import></button><span style="flex:1;font-size:18px;font-weight:600">Personas y permisos</span></header></sc-if><div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:12px;padding:0 16px;max-width:760px;width:100%;box-sizing:border-box;overflow:hidden"><sc-if value="{{ d }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:4px;margin-top:20px"><span style="font-size:13px;color:var(--muted-foreground)">Casa</span><h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em">Personas y permisos</h1></div></sc-if><div style="display:flex;align-items:center;flex-wrap:wrap;gap:6px 14px;padding:0 2px;font-size:13px;color:var(--muted-foreground)"><span>Casa · 5 personas</span><span style="display:flex;align-items:center;gap:5px"><x-import component-from-global-scope="Library.BadgeCheckIcon" size="14" hint-size="14px,14px"></x-import>tiene cuenta: no hace falta invitarla</span></div><div style="display:flex;flex-direction:column;border:1px solid var(--border);border-radius:16px;overflow:hidden"><sc-for list="{{ people }}" as="p" hint-placeholder-count="4"><div style="display:flex;align-items:center;gap:12px;min-height:76px;padding:10px 8px 10px 14px;border-bottom:1px solid var(--border)"><span aria-hidden="true" style="width:40px;height:40px;border-radius:20px;background:var(--secondary);color:var(--secondary-foreground);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;font-weight:600">{{ p.ini }}</span><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:4px"><span style="display:flex;align-items:center;gap:6px;font-size:15px;font-weight:600">{{ p.name }}<sc-if value="{{ p.me }}" hint-placeholder-val="{{ false }}"><span style="font-weight:400;color:var(--muted-foreground)">· tú</span></sc-if><sc-if value="{{ p.acc }}" hint-placeholder-val="{{ false }}"><span role="img" aria-label="Tiene cuenta" title="Tiene cuenta" style="display:flex;color:var(--muted-foreground)"><x-import component-from-global-scope="Library.BadgeCheckIcon" size="15" hint-size="15px,15px"></x-import></span></sc-if></span><span style="font-size:13px">{{ p.role }}</span><span style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--muted-foreground)"><sc-for list="{{ p.devs }}" as="v" hint-placeholder-count="1"><span style="display:flex;align-items:center;gap:4px"><x-import component-from-global-scope="Library.{{ v.i }}" size="13" hint-size="13px,13px"></x-import>{{ v.n }}</span></sc-for></span></div><span style="width:36px;display:flex;justify-content:center;color:var(--muted-foreground)"><x-import component-from-global-scope="Library.ChevronRightIcon" size="18" hint-size="18px,18px"></x-import></span></div></sc-for></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:8px"><span style="font-size:13px;font-weight:600;padding:0 2px">Sin acceso</span><div style="display:flex;align-items:center;gap:12px;min-height:68px;padding:10px 12px 10px 14px;border:1px dashed var(--border);border-radius:16px"><span aria-hidden="true" style="width:40px;height:40px;border-radius:20px;border:1px dashed var(--muted-foreground);color:var(--muted-foreground);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:16px;font-weight:600">C</span><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:500">Carmen</span><span style="font-size:13px;color:var(--muted-foreground)">Sin acceso desde el 3 oct · sus libros siguen siendo suyos</span></div><sc-if value="{{ admin }}" hint-placeholder-val="{{ true }}"><button style="height:40px;padding:0 12px;border-radius:12px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 14px var(--font-sans);flex-shrink:0">Devolver el acceso</button></sc-if></div></div></div><sc-if value="{{ m }}" hint-placeholder-val="{{ true }}"><div style="padding:14px 16px 34px;flex-shrink:0"><button style="width:100%;height:52px;border-radius:14px;border:0;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px var(--font-sans)"><x-import component-from-global-scope="Library.QrCodeIcon" size="19" hint-size="19px,19px"></x-import>Dar acceso a otro dispositivo</button></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;shell&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;m&quot;,&quot;d&quot;],&quot;default&quot;:&quot;m&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;reader&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = (this.props.shell ?? 'm') === 'm';
    const P = (name, role, acc, devs, me = false) => ({ name, ini: name[0], role, acc, me, devs: devs.map(([i, n]) => ({ i, n })) });
    const people = [
      P('Ana', 'Administrador', true, [['LaptopIcon', 'Portátil'], ['SmartphoneIcon', 'Pixel 8']], true),
      P('Laura', 'Administrador', true, [['SmartphoneIcon', 'Móvil de Laura']]),
      P('Hugo', 'Lector', false, [['SmartphoneIcon', 'Móvil de Hugo'], ['TabletIcon', 'Tablet de casa']]),
      P('Jhonny', 'Lector', true, [['SmartphoneIcon', 'Móvil de Jhonny']])
    ];
    return { m, d: !m, admin: (this.props.view ?? 'admin') === 'admin', people };
  }
}
</script>
</body>
</html>
