<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div style="background:var(--background);color:var(--foreground);font-family:var(--font-sans);padding:32px;display:flex;flex-direction:column;gap:32px"><sc-for list="{{ groups }}" as="g" hint-placeholder-count="3"><section style="display:flex;flex-direction:column;gap:10px"><h3 style="margin:0;font-size:16px;font-weight:600">{{ g.t }}</h3><div style="display:grid;grid-template-columns:200px minmax(0,1fr) minmax(0,1fr);border:1px solid var(--border);border-radius:12px;overflow:hidden;font-size:13.5px;line-height:1.5"><span style="padding:8px 12px;background:var(--muted);font-weight:600">Dónde</span><span style="padding:8px 12px;background:var(--muted);font-weight:600">Español</span><span style="padding:8px 12px;background:var(--muted);font-weight:600">English</span><sc-for list="{{ g.rows }}" as="r" hint-placeholder-count="3"><span style="padding:10px 12px;border-top:1px solid var(--border);font-family:var(--font-mono);font-size:12px;color:var(--muted-foreground)">{{ r.k }}</span><span style="padding:10px 12px;border-top:1px solid var(--border);text-wrap:pretty">{{ r.es }}</span><span style="padding:10px 12px;border-top:1px solid var(--border);text-wrap:pretty">{{ r.en }}</span></sc-for></div></section></sc-for><section style="display:flex;flex-direction:column;gap:10px;max-width:900px"><h3 style="margin:0;font-size:16px;font-weight:600">Lo que hemos supuesto</h3><ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:14px;line-height:1.5"><sc-for list="{{ assumptions }}" as="a" hint-placeholder-count="6"><li style="text-wrap:pretty">{{ a }}</li></sc-for></ol></section></div>
</x-dc>

      { t: 'Subir a la nube (CloudPick)', rows: [

      { t: 'Entrar sin invitación y el móvil nuevo', rows: [
        R('joined.one', 'Ya estás en «Casa» en la nube · Como Jhonny · lector.', 'You’re now in “Casa” in the cloud · As Jhonny · reader.'),

      ] }
    ];
    const assumptions = [
      'Bibliotecas sin personas ni roles: en CloudPick salen con casilla y la línea «Sin personas ni roles»; cualquiera de los que la comparten puede subirla.',

      'El aviso de «Ya estás en la nube» es una barra que se cierra sola (o con la X) la primera vez que se abre la app tras iniciar sesión; no se repite.',
