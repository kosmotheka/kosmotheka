<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div style="width:100%;height:100%;display:flex;flex-direction:column;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><sc-if value="{{ m }}" hint-placeholder-val="{{ true }}"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><div style="height:24px"></div></sc-if><div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:20px;padding:24px 24px 28px"><div style="display:flex;flex-direction:column;gap:8px"><span style="display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;color:var(--success)"><x-import component-from-global-scope="Library.CircleCheckIcon" size="17" hint-size="17px,17px"></x-import>Has entrado como Laura Gómez</span><h1 style="margin:0;font-size:26px;font-weight:600;letter-spacing:-0.02em;line-height:1.15">{{ title }}</h1><p style="margin:0;font-size:15px;line-height:1.5;color:var(--muted-foreground);text-wrap:pretty">{{ lead }}</p></div><div style="display:flex;flex-direction:column;border-radius:16px;border:1px solid var(--border)"><sc-for list="{{ libs }}" as="l" hint-placeholder-count="2"><div style="display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border)"><div style="display:flex;align-items:center;gap:12px"><span style="width:40px;height:40px;border-radius:12px;background:var(--secondary);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.LibraryBigIcon" size="19" hint-size="19px,19px"></x-import></span><span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">{{ l.name }}</span><span style="font-size:13px;color:var(--muted-foreground)">{{ l.sub }}</span></span><sc-if value="{{ l.ok }}" hint-placeholder-val="{{ false }}"><span aria-label="Ya está aquí" style="color:var(--success);display:flex"><x-import component-from-global-scope="Library.CircleCheckIcon" size="20" hint-size="20px,20px"></x-import></span></sc-if></div><sc-if value="{{ l.bar }}" hint-placeholder-val="{{ false }}"><div role="progressbar" aria-valuenow="{{ l.pct }}" aria-valuemin="0" aria-valuemax="100" style="height:6px;border-radius:3px;background:var(--muted);overflow:hidden"><sc-if value="{{ l.started }}" hint-placeholder-val="{{ false }}"><div style="height:100%;width:60%;border-radius:3px;background:var(--primary)"></div></sc-if></div></sc-if></div></sc-for><sc-if value="{{ finishing }}" hint-placeholder-val="{{ false }}"><div role="status" style="display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:14px;color:var(--muted-foreground)"><x-import component-from-global-scope="Library.LoaderCircleIcon" size="18" hint-size="18px,18px"></x-import>{{ finText }}</div></sc-if><sc-if value="{{ done }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:14px"><x-import component-from-global-scope="Library.UserRoundCheckIcon" size="18" hint-size="18px,18px"></x-import><span>En «Casa» eres <strong style="font-weight:600">Laura · administradora</strong></span></div></sc-if></div><div style="display:flex;gap:10px;font-size:13px;line-height:1.45;color:var(--muted-foreground);text-wrap:pretty;padding:0 4px"><span style="flex-shrink:0;display:flex;margin-top:1px"><x-import component-from-global-scope="Library.InfoIcon" size="16" hint-size="16px,16px"></x-import></span>Las bibliotecas que no subiste siguen en tus otros dispositivos.</div><span style="flex:1"></span><sc-if value="{{ done }}" hint-placeholder-val="{{ false }}"><button style="height:48px;border-radius:12px;border:0;background:var(--primary);color:var(--primary-foreground);font:600 15px var(--font-sans)">Abrir Casa</button></sc-if><sc-if value="{{ downloading }}" hint-placeholder-val="{{ true }}"><span style="font-size:13px;text-align:center;color:var(--muted-foreground)">Si sales de la app, seguirá bajando.</span></sc-if></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;shell&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;m&quot;,&quot;d&quot;],&quot;default&quot;:&quot;m&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;downloading&quot;,&quot;finishing&quot;,&quot;done&quot;],&quot;default&quot;:&quot;downloading&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = (this.props.shell ?? 'm') === 'm', k = this.props.kind ?? 'downloading';
    const dl = k === 'downloading', fin = k === 'finishing', done = k === 'done';
    const libs = dl
      ? [{ name: 'Casa', sub: '150 de 248 obras', bar: true, pct: 60, started: true, ok: false }, { name: 'Recetas de la abuela', sub: 'Esperando · 31 obras', bar: true, pct: 0, started: false, ok: false }]
      : [{ name: 'Casa', sub: done ? '248 obras · eres Laura' : '248 obras · ya está aquí', bar: false, ok: true }, { name: 'Recetas de la abuela', sub: '31 obras', bar: false, ok: true }];
    return { m, d: !m, libs, downloading: dl, finishing: fin, done,
      title: done ? 'Han bajado 2 bibliotecas' : 'Bajando tus bibliotecas de la nube',
      finText: m ? 'Terminando de preparar este móvil…' : 'Terminando de preparar este ordenador…', lead: done ? (m ? 'Este móvil' : 'Este ordenador') + ' ya es tuyo en ellas. Todo se mantendrá al día solo.' : 'Con bibliotecas grandes puede tardar un rato. No hace falta que nadie en casa haga nada.' };
  }
}
</script>
</body>
</html>
