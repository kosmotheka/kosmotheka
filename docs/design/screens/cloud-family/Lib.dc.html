<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;shell&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;m&quot;,&quot;d&quot;],&quot;default&quot;:&quot;m&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;joined&quot;,&quot;joinedMany&quot;,&quot;noPerson&quot;,&quot;finishing&quot;,&quot;revokedUnverified&quot;,&quot;uploadAdminOnly&quot;,&quot;dupDevice&quot;,&quot;accountTaken&quot;,&quot;cloudNoLink&quot;],&quot;default&quot;:&quot;joined&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = (this.props.shell ?? 'm') === 'm', k = this.props.kind ?? 'joined';
    const tone = { info: ['var(--muted)', 'var(--foreground)'], warn: ['var(--warning-soft)', 'var(--warning)'], err: ['color-mix(in oklch,var(--destructive) 10%,var(--background))', 'var(--destructive)'] };
    const B = {
      noPerson: ['info', 'SmartphoneIcon', 'Este móvil aún no es de nadie en «Casa»', 'Pide a quien administra que diga de quién es este dispositivo, y entrarás también por la nube.', ''],
      finishing: ['info', '', 'Terminando de preparar este móvil…', 'Ya puedes mirar «Casa». En un momento podrás añadir y cambiar cosas.', ''],
      revokedUnverified: ['warn', 'CloudOffIcon', '«Casa» ha dejado de sincronizarse con la nube', 'La nube dice que ya no tienes acceso, pero no hemos podido comprobarlo. La biblioteca sigue en este móvil, y por la red de casa. Habla con quien la administra.', ''],
      uploadAdminOnly: ['info', 'CloudUploadIcon', 'Esta biblioteca solo puede subirla quien la administra', 'Pídeselo a Ana Ruiz. Mientras, sigue compartiéndose por la red de casa.', ''],
      dupDevice: ['warn', 'CloudAlertIcon', 'Este móvil no puede sincronizar «Casa» con la nube', 'Hay otro dispositivo registrado igual que este. Es muy raro y no se pierde nada: todo sigue aquí y por la red de casa. Lo arregla quien administra: quitando ese otro dispositivo y vinculando este de nuevo.', 'Avisar a quien administra'],
      accountTaken: ['err', 'UserRoundXIcon', 'Otra cuenta ya está enlazada con Jhonny en «Casa»', 'Cada persona de la biblioteca se enlaza con una sola cuenta. Este móvil sigue siendo de Jhonny por la red de casa. Si esa otra cuenta no es tuya, habla con quien administra.', ''],
      cloudNoLink: ['info', 'Link2OffIcon', 'La nube no puede dar acceso a este móvil en «Casa»', 'Quien administra prefiere vincular cada dispositivo a mano. Pídele que vincule este.', 'Pedir que lo vincule']
    }[k];
    if (B && !m) for (let i = 2; i < 4; i++) B[i] = B[i].replace(/este móvil/g, 'este ordenador').replace(/Este móvil/g, 'Este ordenador');
    const toastData = {
      joined: ['Ya estás en «Casa» en la nube', ['Como Jhonny · lector.']],
      joinedMany: ['Ya estás en 2 bibliotecas en la nube', ['«Casa», como Jhonny · lector', '«Juegos de mesa», como Jhonny · editor']]
    }[k];
    const books = [['El nombre del viento', 'Patrick Rothfuss', 40], ['Catan', 'Klaus Teuber', 140], ['Los pilares de la Tierra', 'Ken Follett', 20], ['Rayuela', 'Julio Cortázar', 250], ['Carcassonne', 'Klaus-Jürgen Wrede', 90], ['Mortadelo y Filemón', 'Francisco Ibáñez', 200], ['Cien años de soledad', 'Gabriel García Márquez', 60], ['Dixit', 'Jean-Louis Roubira', 310]].map(([t, a, h]) => ({ t, a, h }));
    const tn = B ? tone[B[0]] : tone.info;
    return { m, d: !m, col: m ? '100%' : '320px', books,
      hasBanner: !!B, tInfo: !!B && B[0] === 'info', tWarn: !!B && B[0] === 'warn', tErr: !!B && B[0] === 'err', bannerBg: tn[0], iconColor: tn[1], icon: B ? B[1] : '', spin: !!B && !B[1], noSpin: !!B && !!B[1], title: B ? B[2] : '', body: B ? B[3] : '', action: B ? B[4] : '',
      fab: m && k !== 'finishing' && k !== 'joined' && k !== 'joinedMany' ? true : (m && !toastData && k !== 'finishing'), fabBottom: '28px',
      toast: !!toastData, toastTitle: toastData ? toastData[0] : '', toastLines: toastData ? toastData[1] : [], toastLeft: m ? '16px' : 'auto', toastBottom: m ? '28px' : '24px' };
  }
}
</script>
