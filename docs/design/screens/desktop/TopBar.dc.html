<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="height:56px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px 0 20px;border-bottom:1px solid var(--border);background:var(--background)"><div role="search" style="width:360px;height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;border:1px solid var(--input);color:var(--muted-foreground);font-size:14px"><x-import component-from-global-scope="Library.SearchIcon" size="16" hint-size="16px,16px"></x-import><span style="flex:1">Buscar en Familia</span><kbd style="font:500 11px var(--font-mono);padding:2px 6px;border-radius:4px;border:1px solid var(--border);background:var(--muted)">Ctrl K</kbd></div><span style="flex:1"></span><button aria-label="Estado de sincronización: al día. Ver ayuda" style="height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--muted-foreground);font:400 13px var(--font-sans)"><span style="width:7px;height:7px;border-radius:4px;background:var(--success)"></span>Al día</button><sc-if value="{{ admin }}" hint-placeholder-val="{{ true }}"><button aria-label="Peticiones pendientes: 3" style="position:relative;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center;margin-right:4px"><x-import component-from-global-scope="Library.BellIcon" size="18" hint-size="18px,18px"></x-import><span style="position:absolute;top:2px;right:0;min-width:17px;height:17px;padding:0 4px;box-sizing:border-box;border-radius:9px;background:var(--destructive);color:#fff;font-size:10.5px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--background)">3</span></button></sc-if><span style="width:1px;height:20px;background:var(--border);margin:0 4px"></span><button style="height:36px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 14px var(--font-sans)"><x-import component-from-global-scope="Library.ScanBarcodeIcon" size="16" hint-size="16px,16px"></x-import>Escanear</button><sc-if value="{{ admin }}" hint-placeholder-val="{{ true }}"><button style="height:36px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 14px var(--font-sans)"><x-import component-from-global-scope="Library.ZapIcon" size="16" hint-size="16px,16px"></x-import>Alta rápida</button></sc-if><button style="height:36px;display:flex;align-items:center;gap:7px;padding:0 14px;border-radius:8px;border:0;background:var(--primary);color:var(--primary-foreground);font:500 14px var(--font-sans)"><x-import component-from-global-scope="Library.PlusIcon" size="16" hint-size="16px,16px"></x-import>{{ addLabel }}</button></header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;lector&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const admin = (this.props.role ?? 'admin') === 'admin';
    return { admin, addLabel: admin ? 'Añadir' : 'Pedir que se añada' };
  }
}
</script>
</body>
</html>
