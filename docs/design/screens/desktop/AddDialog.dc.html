<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:1280px;height:800px;position:relative;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><dc-import name="Catalog" role="admin" hint-size="1280px,800px"></dc-import><div style="position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding-top:64px"><div role="dialog" aria-label="Añadir a Familia" style="width:760px;max-height:672px;background:var(--background);color:var(--foreground);border-radius:16px;box-shadow:0 0 0 1px var(--border),0 24px 64px -16px oklch(0 0 0 / 40%);display:flex;flex-direction:column;overflow:hidden"><div style="display:flex;align-items:center;padding:18px 16px 0 24px"><h2 style="margin:0;flex:1;font-size:18px;font-weight:600;letter-spacing:-0.01em">Añadir a Familia</h2><button aria-label="Cerrar" style="width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.XIcon" size="18" hint-size="18px,18px"></x-import></button></div><div style="padding:14px 24px 0;display:flex;gap:8px"><div style="flex:1;height:44px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:10px;border:1px solid var(--ring);box-shadow:0 0 0 3px color-mix(in oklch,var(--ring) 30%,transparent);font-size:15px"><x-import component-from-global-scope="Library.SearchIcon" size="18" hint-size="18px,18px"></x-import><span style="flex:1">fundación asimov</span><x-import component-from-global-scope="Library.XIcon" size="16" hint-size="16px,16px"></x-import></div><button style="height:44px;display:flex;align-items:center;gap:8px;padding:0 14px;border-radius:10px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 14px var(--font-sans)"><x-import component-from-global-scope="Library.CameraIcon" size="17" hint-size="17px,17px"></x-import>Escanear</button></div><div style="padding:14px 24px 0;display:flex;flex-direction:column;gap:8px"><span style="font-size:12px;font-weight:500;color:var(--muted-foreground)">¿Qué es?</span><div role="radiogroup" aria-label="Tipo" style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px"><sc-for list="{{ types }}" as="t" hint-placeholder-count="6"><sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}"><div role="radio" aria-checked="true" style="height:64px;border-radius:10px;border:1px solid var(--foreground);background:var(--accent);box-shadow:inset 0 0 0 1px var(--foreground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:500;text-align:center"><x-import component-from-global-scope="Library.{{ t.icon }}" size="19" hint-size="19px,19px"></x-import>{{ t.label }}</div></sc-if><sc-if value="{{ t.off }}" hint-placeholder-val="{{ true }}"><div role="radio" aria-checked="false" style="height:64px;border-radius:10px;border:1px solid var(--border);background:transparent;box-shadow:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;font-size:12.5px;font-weight:500;text-align:center"><x-import component-from-global-scope="Library.{{ t.icon }}" size="19" hint-size="19px,19px"></x-import>{{ t.label }}</div></sc-if></sc-for></div></div><div style="padding:18px 24px 6px;display:flex;align-items:baseline;gap:8px"><span style="font-size:13px;font-weight:600">Resultados</span><span style="font-size:12px;color:var(--muted-foreground)">Open Library · Google Books</span></div><div style="flex:1;min-height:0;overflow:hidden;padding:0 12px"><sc-for list="{{ results }}" as="r" hint-placeholder-count="4"><div style="position:relative;isolation:isolate;display:flex;align-items:center;gap:14px;padding:10px 12px"><sc-if value="{{ r.hl }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;z-index:-1;border-radius:10px;background:var(--accent)"></span></sc-if><dc-import name="Cover" kind="book" size="{{ 60 }}" style="width:40px;height:60px;flex-shrink:0" hint-size="40px,60px"></dc-import><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:500">{{ r.title }}</span><span style="font-size:13px;color:var(--muted-foreground)">{{ r.meta }}</span><span style="font-size:12px;color:var(--muted-foreground);font-family:var(--font-mono)">{{ r.isbn }}</span></div><sc-if value="{{ r.owned }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;background:var(--success-soft);color:var(--success);font-size:12px;font-weight:600"><x-import component-from-global-scope="Library.CheckIcon" size="13" stroke-width="3" hint-size="13px,13px"></x-import>Ya está en Familia</span><button style="height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 13px var(--font-sans)">Añadir ejemplar</button></sc-if><sc-if value="{{ r.notOwned }}" hint-placeholder-val="{{ true }}"><button style="height:32px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 13px var(--font-sans)">Elegir</button></sc-if></div></sc-for></div><div style="display:flex;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--border);background:var(--muted)"><span style="flex:1;font-size:13px;color:var(--muted-foreground)">¿No aparece? Rellena la ficha tú, con o sin red.</span><button style="height:36px;display:flex;align-items:center;gap:7px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 14px var(--font-sans)"><x-import component-from-global-scope="Library.PencilIcon" size="15" hint-size="15px,15px"></x-import>Añadir a mano</button></div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const sel = 'Libro';
    const types = [['BookIcon', 'Libro'], ['BookImageIcon', 'Cómic'], ['Dice5Icon', 'Juego de mesa'], ['ClapperboardIcon', 'Película o serie'], ['Gamepad2Icon', 'Videojuego'], ['ShapesIcon', 'Otro']]
      .map(([icon, label]) => { const on = label === sel; return { icon, label, on, off: !on }; });
    const results = [
      { title: 'Fundación', meta: 'Isaac Asimov · 1951 · Debolsillo', isbn: '978-84-9759-340-3', owned: true },
      { title: 'Fundación e Imperio', meta: 'Isaac Asimov · 1952 · Debolsillo', isbn: '978-84-9759-341-0' },
      { title: 'Segunda Fundación', meta: 'Isaac Asimov · 1953 · Debolsillo', isbn: '978-84-9759-342-7' },
      { title: 'Los límites de la Fundación', meta: 'Isaac Asimov · 1982 · Plaza & Janés', isbn: '978-84-01-49852-3' }
    ].map((r, i) => ({ ...r, owned: !!r.owned, notOwned: !r.owned, hl: i === 1 }));
    return { types, results };
  }
}
</script>
</body>
</html>
