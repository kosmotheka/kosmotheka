<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:1280px;height:800px;position:relative;overflow:hidden;display:flex;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><dc-import name="Sidebar" active="series" hint-size="256px,100%"></dc-import><div style="flex:1;min-width:0;display:flex;flex-direction:column"><dc-import name="TopBar" hint-size="100%,56px"></dc-import><main style="flex:1;min-height:0;padding:16px 32px 0;display:flex;flex-direction:column"><div style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted-foreground)"><span>Series</span><x-import component-from-global-scope="Library.ChevronRightIcon" size="14" hint-size="14px,14px"></x-import><span style="color:var(--foreground)">Saga Dune</span></div><div style="display:flex;align-items:flex-end;gap:16px;margin-top:14px"><div style="flex:1;display:flex;flex-direction:column;gap:6px"><h1 style="margin:0;font-size:26px;font-weight:600;letter-spacing:-0.02em">Saga Dune</h1><span style="font-size:14px;color:var(--muted-foreground)">Frank Herbert · 6 obras · tienes 4, te faltan 2</span></div><button style="height:36px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 14px var(--font-sans)"><x-import component-from-global-scope="Library.PlusIcon" size="16" hint-size="16px,16px"></x-import>Añadir a la serie</button></div><div aria-label="Tienes 4 de 6" style="display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin-top:18px"><sc-for list="{{ books }}" as="b" hint-placeholder-count="6"><sc-if value="{{ b.have }}" hint-placeholder-val="{{ true }}"><span style="height:6px;border-radius:3px;background:var(--foreground)"></span></sc-if><sc-if value="{{ b.gap }}" hint-placeholder-val="{{ false }}"><span style="height:6px;border-radius:3px;background:var(--border)"></span></sc-if></sc-for></div><div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:20px;margin-top:28px"><sc-for list="{{ books }}" as="b" hint-placeholder-count="6"><div style="display:flex;flex-direction:column;gap:10px"><sc-if value="{{ b.have }}" hint-placeholder-val="{{ true }}"><div style="aspect-ratio:2/3"><dc-import name="Cover" kind="book" size="{{ 220 }}" style="width:100%;height:100%" hint-size="100%,220px"></dc-import></div></sc-if><sc-if value="{{ b.gap }}" hint-placeholder-val="{{ false }}"><div style="aspect-ratio:2/3;border-radius:6px;border:1.5px dashed var(--muted-foreground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted-foreground);padding:12px;box-sizing:border-box;text-align:center"><span style="font-size:28px;font-weight:600;letter-spacing:-0.02em">{{ b.n }}</span><span style="font-size:12px;font-weight:500">Te falta</span><button style="height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 13px var(--font-sans)"><x-import component-from-global-scope="Library.PlusIcon" size="14" hint-size="14px,14px"></x-import>Añadir</button></div></sc-if><div style="display:flex;flex-direction:column;gap:3px"><div style="display:flex;align-items:flex-start;gap:6px"><span style="flex:1;font-size:14px;font-weight:500;line-height:1.3;text-wrap:pretty">{{ b.n }}. {{ b.title }}</span><sc-if value="{{ b.wish }}" hint-placeholder-val="{{ false }}"><span aria-label="Deseo" style="color:var(--wish);display:flex"><x-import component-from-global-scope="Library.HeartIcon" size="15" fill="currentColor" hint-size="15px,15px"></x-import></span></sc-if></div><span style="font-size:12px;color:var(--muted-foreground)">{{ b.meta }}</span></div></div></sc-for></div><div style="margin-top:28px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid var(--border);max-width:560px"><x-import component-from-global-scope="Library.Link2Icon" size="17" hint-size="17px,17px"></x-import><span style="flex:1;font-size:13px;text-wrap:pretty">Los huecos también aparecen en <strong style="font-weight:600">Me falta</strong>. «Hijos de Dune» está marcado como deseo.</span><span style="font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:2px">Ver Me falta</span></div></main></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const books = [
      ['1', 'Dune', '1965 · 2 ejemplares'], ['2', 'El mesías de Dune', '1969 · Tapa blanda'], ['3', 'Hijos de Dune', '1976', 'gap', true], ['4', 'Dios emperador de Dune', '1981', 'gap'], ['5', 'Herejes de Dune', '1984 · Tapa blanda'], ['6', 'Casa Capitular Dune', '1985 · Kindle de Laura']
    ].map(([n, title, meta, g, wish]) => ({ n, title, meta, gap: g === 'gap', have: g !== 'gap', wish: !!wish }));
    return { books };
  }
}
</script>
</body>
</html>
