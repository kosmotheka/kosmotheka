<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<aside aria-label="Navegación" style="width:256px;height:100%;flex-shrink:0;background:var(--sidebar);color:var(--sidebar-foreground);border-right:1px solid var(--sidebar-border);display:flex;flex-direction:column;padding:12px"><button aria-label="Cambiar de biblioteca" style="display:flex;align-items:center;gap:10px;padding:8px;border-radius:10px;border:0;background:transparent;color:inherit;font-family:inherit;text-align:left;cursor:pointer" style-hover="background:var(--sidebar-accent)"><span style="width:32px;height:32px;border-radius:8px;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.LibraryBigIcon" size="17" hint-size="17px,17px"></x-import></span><span style="flex:1;display:flex;flex-direction:column;min-width:0"><span style="font-size:14px;font-weight:600">Familia</span><span style="font-size:12px;color:var(--muted-foreground)">248 obras · 4 personas</span></span><x-import component-from-global-scope="Library.ChevronsUpDownIcon" size="16" hint-size="16px,16px"></x-import></button><nav style="display:flex;flex-direction:column;gap:2px;margin-top:16px"><sc-for list="{{ main }}" as="it" hint-placeholder-count="3"><sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:600;background:var(--sidebar-accent);cursor:pointer"><x-import component-from-global-scope="Library.{{ it.icon }}" size="17" hint-size="17px,17px"></x-import><span style="flex:1">{{ it.label }}</span><span style="font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums">{{ it.count }}</span></div></sc-if><sc-if value="{{ it.off }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:400;background:transparent;cursor:pointer"><x-import component-from-global-scope="Library.{{ it.icon }}" size="17" hint-size="17px,17px"></x-import><span style="flex:1">{{ it.label }}</span><span style="font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums">{{ it.count }}</span></div></sc-if></sc-for></nav><div style="padding:18px 10px 6px;font-size:12px;font-weight:500;color:var(--muted-foreground)">Biblioteca</div><nav style="display:flex;flex-direction:column;gap:2px"><sc-for list="{{ lib }}" as="it" hint-placeholder-count="4"><sc-if value="{{ it.on }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:600;background:var(--sidebar-accent);cursor:pointer"><x-import component-from-global-scope="Library.{{ it.icon }}" size="17" hint-size="17px,17px"></x-import><span style="flex:1">{{ it.label }}</span></div></sc-if><sc-if value="{{ it.off }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:400;background:transparent;cursor:pointer"><x-import component-from-global-scope="Library.{{ it.icon }}" size="17" hint-size="17px,17px"></x-import><span style="flex:1">{{ it.label }}</span></div></sc-if></sc-for></nav><span style="flex:1"></span><div style="display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;border:1px solid var(--sidebar-border);margin-bottom:8px"><x-import component-from-global-scope="Library.CloudIcon" size="17" hint-size="17px,17px"></x-import><span style="flex:1;display:flex;flex-direction:column"><span style="font-size:13px;font-weight:500">Guardar en la nube</span><span style="font-size:12px;color:var(--muted-foreground)">Sin cuenta · todo en tus equipos</span></span></div><nav style="display:flex;flex-direction:column;gap:2px"><div style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;font-size:14px"><x-import component-from-global-scope="Library.SettingsIcon" size="17" hint-size="17px,17px"></x-import>Ajustes</div><div style="display:flex;align-items:center;gap:10px;height:36px;padding:0 10px;border-radius:8px;font-size:14px"><x-import component-from-global-scope="Library.CircleHelpIcon" size="17" hint-size="17px,17px"></x-import>Ayuda</div></nav></aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;catalog&quot;,&quot;check&quot;,&quot;missing&quot;,&quot;series&quot;,&quot;share&quot;,&quot;people&quot;,&quot;backup&quot;],&quot;default&quot;:&quot;catalog&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;lector&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const a = this.props.active ?? 'catalog';
    const lector = this.props.role === 'lector';
    const mk = (id, icon, label, count = '') => ({ icon, label, count, on: a === id, off: a !== id });
    const lib = [mk('series', 'ListOrderedIcon', 'Series'), mk('share', 'Share2Icon', 'Compartir y dispositivos'), mk('people', 'UsersIcon', 'Personas y permisos'), mk('backup', 'ArchiveIcon', 'Copias de seguridad')];
    if (lector) lib.unshift(mk('requests', 'InboxIcon', 'Mis peticiones'));
    return {
      main: [mk('catalog', 'LibraryBigIcon', 'Catálogo', '248'), mk('check', 'ScanBarcodeIcon', '¿Lo tengo?'), mk('missing', 'BookmarkIcon', 'Me falta', '23')],
      lib
    };
  }
}
</script>
</body>
</html>
