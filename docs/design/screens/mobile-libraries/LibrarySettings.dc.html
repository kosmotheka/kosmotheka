<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><div style="height:100%;display:flex;flex-direction:column"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><header style="height:64px;display:flex;align-items:center;gap:4px;padding:0 4px;flex-shrink:0"><button aria-label="Atrás" style="width:48px;height:48px;border:0;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.ArrowLeftIcon" size="22" hint-size="22px,22px"></x-import></button><span style="font-size:18px;font-weight:600">Ajustes de Familia</span></header><div style="flex:1;min-height:0;padding:4px 16px 28px;display:flex;flex-direction:column;gap:24px"><label style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:500;color:var(--muted-foreground)">Nombre</span><span style="height:52px;border-radius:14px;border:1px solid var(--input);display:flex;align-items:center;padding:0 14px;font-size:16px;box-sizing:border-box">Familia</span></label><section style="display:flex;flex-direction:column;gap:4px"><div style="display:flex;flex-direction:column;gap:2px;padding-bottom:6px"><span style="font-size:13px;font-weight:500;color:var(--muted-foreground)">Se comparte con</span><span style="font-size:12px;color:var(--muted-foreground)">3 dispositivos, además de este móvil</span></div><div style="display:flex;flex-direction:column;border:1px solid var(--border);border-radius:16px;overflow:hidden"><sc-for list="{{ devices }}" as="d" hint-placeholder-count="3"><div style="display:flex;align-items:center;gap:12px;min-height:64px;padding:8px 8px 8px 14px;border-bottom:1px solid var(--border)"><div style="width:40px;height:40px;border-radius:12px;background:var(--secondary);color:var(--secondary-foreground);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.{{ d.icon }}" size="19" hint-size="19px,19px"></x-import></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:500">{{ d.name }}</span><span style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted-foreground)"><sc-if value="{{ d.ok }}" hint-placeholder-val="{{ false }}"><span style="width:6px;height:6px;border-radius:3px;background:var(--success);flex-shrink:0"></span></sc-if><sc-if value="{{ d.err }}" hint-placeholder-val="{{ false }}"><span style="width:6px;height:6px;border-radius:3px;background:var(--destructive);flex-shrink:0"></span></sc-if>{{ d.sync }}</span></div><button style="height:44px;padding:0 12px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--foreground);font:500 13px var(--font-sans);flex-shrink:0">Dejar de compartir</button></div></sc-for><div style="display:flex;align-items:center;gap:12px;min-height:56px;padding:0 14px"><x-import component-from-global-scope="Library.PlusIcon" size="19" hint-size="19px,19px"></x-import><span style="font-size:15px;font-weight:500">Compartir con otro dispositivo</span></div></div></section><sc-if value="{{ creator }}" hint-placeholder-val="{{ true }}"><span style="display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted-foreground);margin-top:-12px;padding:0 2px"><x-import component-from-global-scope="Library.HistoryIcon" size="14" hint-size="14px,14px"></x-import>Creada en el portátil el 26/09/2026</span></sc-if><section style="margin-top:auto;display:flex;flex-direction:column;border-top:1px solid var(--border);padding-top:8px"><div style="display:flex;align-items:center;gap:14px;min-height:64px;padding:0 4px"><x-import component-from-global-scope="Library.LogOutIcon" size="20" hint-size="20px,20px"></x-import><div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:500">Salir de la biblioteca</span><span style="font-size:13px;color:var(--muted-foreground)">Desaparece de este móvil; sigue en los demás</span></div></div><div style="display:flex;align-items:center;gap:14px;min-height:64px;padding:0 4px;color:var(--destructive)"><x-import component-from-global-scope="Library.Trash2Icon" size="20" hint-size="20px,20px"></x-import><div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">Borrar la biblioteca</span><span style="font-size:13px;color:var(--muted-foreground)">Se borra en todos los dispositivos</span></div></div></section></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;creator&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      creator: this.props.creator ?? true,
      devices: [
        { icon: 'LaptopIcon', name: 'Portátil', sync: 'Al día · hace 2 min', ok: true, warn: false, mute: false, err: false },
        { icon: 'SmartphoneIcon', name: 'Pixel 7', sync: 'Al día · ayer', ok: true, warn: false, mute: false, err: false },
        { icon: 'TabletIcon', name: 'Tablet Lenovo', sync: 'Sin sincronizar: otra versión', ok: false, warn: false, mute: false, err: true }
      ]
    };
  }
}
</script>
</body>
</html>
