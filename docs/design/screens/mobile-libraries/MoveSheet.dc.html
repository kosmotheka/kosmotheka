<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:100%;height:100%;position:relative;overflow:hidden;font-family:var(--font-sans)"><sc-if value="{{ menu }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0"><div role="menu" aria-label="Más opciones" style="position:absolute;top:92px;right:8px;width:250px;padding:6px 0;border-radius:14px;background:var(--popover);color:var(--popover-foreground);box-shadow:0 0 0 1px var(--border),0 16px 40px -12px oklch(0 0 0 / 35%)"><sc-for list="{{ items }}" as="i" hint-placeholder-count="4"><div role="menuitem" style="position:relative;isolation:isolate;display:flex;align-items:center;gap:14px;height:48px;padding:0 16px;font-size:15px"><sc-if value="{{ i.hl }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0 6px;z-index:-1;border-radius:8px;background:var(--accent)"></span></sc-if><x-import component-from-global-scope="Library.{{ i.icon }}" size="19" hint-size="19px,19px"></x-import>{{ i.label }}</div></sc-for></div></div></sc-if><sc-if value="{{ sheet }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end"><div role="dialog" aria-label="Mover Dune a otra biblioteca" style="background:var(--popover);color:var(--popover-foreground);border-radius:28px 28px 0 0;padding:10px 0 28px;display:flex;flex-direction:column;gap:12px"><div style="width:32px;height:4px;border-radius:2px;background:var(--muted-foreground);opacity:.4;margin:0 auto 2px"></div><div style="padding:0 24px;display:flex;flex-direction:column;gap:4px"><span style="font-size:20px;font-weight:600;letter-spacing:-0.01em">Mover «Dune» a…</span><span style="font-size:14px;color:var(--muted-foreground)">Ahora está en Familia</span></div><div role="radiogroup"><sc-for list="{{ libs }}" as="l" hint-placeholder-count="3"><div role="radio" aria-checked="{{ l.on }}" style="display:flex;align-items:center;gap:16px;min-height:56px;padding:0 24px"><sc-if value="{{ l.on }}" hint-placeholder-val="{{ false }}"><span style="width:22px;height:22px;border-radius:11px;border:2px solid var(--primary);box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="width:10px;height:10px;border-radius:5px;background:var(--primary)"></span></span></sc-if><sc-if value="{{ l.off }}" hint-placeholder-val="{{ true }}"><span style="width:22px;height:22px;border-radius:11px;border:1.5px solid var(--muted-foreground);box-sizing:border-box;flex-shrink:0"></span></sc-if><div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:500">{{ l.name }}</span><span style="font-size:13px;color:var(--muted-foreground)">{{ l.meta }}</span></div></div></sc-for></div><div style="margin:0 24px;display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--muted);font-size:14px;line-height:1.45"><x-import component-from-global-scope="Library.InfoIcon" size="17" style="flex-shrink:0;margin-top:2px;color:var(--muted-foreground)" hint-size="17px,17px"></x-import><span style="text-wrap:pretty">La edición y sus 2 ejemplares pasan a Rol. El historial se queda en Familia.</span></div><div style="padding:6px 24px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px"><button style="height:52px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--foreground);font:500 15px var(--font-sans)">Cancelar</button><button style="height:52px;border-radius:14px;border:0;background:var(--primary);color:var(--primary-foreground);font:600 15px var(--font-sans)">Mover a Rol</button></div></div></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;step&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;menú&quot;,&quot;hoja&quot;],&quot;default&quot;:&quot;hoja&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const menu = this.props.step === 'menú';
    const mk = (name, meta, on) => ({ name, meta, on, off: !on });
    return {
      menu, sheet: !menu,
      items: [
        { icon: 'PencilIcon', label: 'Editar' },
        { icon: 'FolderInputIcon', label: 'Mover a otra biblioteca', hl: true },
        { icon: 'ListOrderedIcon', label: 'Añadir a una serie' },
        { icon: 'Trash2Icon', label: 'Borrar' }
      ].map(i => ({ ...i, hl: !!i.hl })),
      libs: [mk('Rol', '412 obras', true), mk('Videojuegos de Hugo', '37 obras', false), mk('Juegos de mesa', '64 obras', false)]
    };
  }
}
</script>
</body>
</html>
