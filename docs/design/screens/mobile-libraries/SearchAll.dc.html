<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><div style="height:100%;display:flex;flex-direction:column"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><header style="height:64px;display:flex;align-items:center;gap:4px;padding:0 12px 0 4px;flex-shrink:0"><button aria-label="Atrás" style="width:48px;height:48px;border:0;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.ArrowLeftIcon" size="22" hint-size="22px,22px"></x-import></button><div role="search" style="flex:1;height:48px;border-radius:24px;background:var(--muted);display:flex;align-items:center;gap:10px;padding:0 6px 0 16px;font-size:16px"><span style="flex:1">dune<span style="display:inline-block;width:2px;height:20px;background:var(--foreground);vertical-align:-4px;margin-left:1px"></span></span><button aria-label="Borrar búsqueda" style="width:40px;height:40px;border:0;background:transparent;color:var(--muted-foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.XIcon" size="18" hint-size="18px,18px"></x-import></button></div></header><div style="padding:4px 16px 8px;flex-shrink:0"><div role="radiogroup" aria-label="Dónde buscar" style="display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:var(--muted)"><sc-if value="{{ inThis }}" hint-placeholder-val="{{ false }}"><span role="radio" aria-checked="true" style="height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--background);box-shadow:0 1px 3px oklch(0 0 0 / 12%);font-weight:600">En Familia</span><span role="radio" aria-checked="false" style="height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted-foreground)">En todas</span></sc-if><sc-if value="{{ inAll }}" hint-placeholder-val="{{ true }}"><span role="radio" aria-checked="false" style="height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted-foreground)">En Familia</span><span role="radio" aria-checked="true" style="height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:14px;background:var(--background);box-shadow:0 1px 3px oklch(0 0 0 / 12%);font-weight:600">En todas</span></sc-if></div></div><div style="padding:6px 16px 4px;font-size:12px;color:var(--muted-foreground);flex-shrink:0">{{ summary }}</div><div style="flex:1;min-height:0;overflow:hidden"><sc-for list="{{ groups }}" as="g" hint-placeholder-count="3"><section><div style="display:flex;align-items:center;gap:8px;padding:14px 16px 4px"><x-import component-from-global-scope="Library.LibraryBigIcon" size="15" style="color:var(--muted-foreground)" hint-size="15px,15px"></x-import><span style="flex:1;font-size:13px;font-weight:600">{{ g.name }}</span><span style="font-size:12px;color:var(--muted-foreground)">{{ g.count }}</span></div><sc-for list="{{ g.items }}" as="it" hint-placeholder-count="2"><div style="display:flex;gap:14px;align-items:center;padding:8px 16px;min-height:60px"><div style="width:40px;display:flex;justify-content:center"><dc-import name="Cover" kind="{{ it.kind }}" size="{{ 54 }}" style="width:40px;height:54px" hint-size="40px,54px"></dc-import></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.title }}</span><span style="font-size:13px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.meta }}</span></div></div></sc-for></section></sc-for></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;scope&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;esta&quot;,&quot;todas&quot;],&quot;default&quot;:&quot;todas&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const all = (this.props.scope ?? 'todas') === 'todas';
    const on = 'background:var(--background);box-shadow:0 1px 3px oklch(0 0 0 / 12%);font-weight:600;color:var(--foreground)';
    const off = 'background:transparent;font-weight:400;color:var(--muted-foreground)';
    const fam = { name: 'Familia', count: '2', items: [
      { kind: 'book', title: 'Dune', meta: 'Libro · Frank Herbert · 1965 · Tapa blanda +1' },
      { kind: 'book', title: 'El mesías de Dune', meta: 'Libro · Frank Herbert · 1969 · Tapa blanda' }
    ] };
    const groups = all ? [fam,
      { name: 'Rol', count: '1', items: [{ kind: 'book', title: 'Dune: Aventuras en el Imperio', meta: 'Libro · Modiphius · 2021 · Tapa dura' }] },
      { name: 'Juegos de mesa', count: '1', items: [{ kind: 'game', title: 'Dune: Imperium', meta: 'Juego de mesa · 1–4 jugadores · 2020' }] },
      { name: 'Videojuegos de Hugo', count: '1', items: [{ kind: 'videogame', title: 'Dune: Spice Wars', meta: 'Videojuego · PC · 2023 · Steam' }] }
    ] : [fam];
    return {
      inAll: all, inThis: !all, allStyle: all ? on : off, thisStyle: all ? off : on, groups,
      summary: all ? '5 resultados en 4 bibliotecas' : '2 resultados en Familia · hay 3 más en otras bibliotecas'
    };
  }
}
</script>
</body>
</html>
