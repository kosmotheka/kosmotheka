<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:100%;height:100%;position:relative;overflow:hidden;font-family:var(--font-sans)"><div style="position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end"><div role="alertdialog" aria-label="¿Borrar Familia?" style="background:var(--popover);color:var(--popover-foreground);border-radius:28px 28px 0 0;padding:10px 24px 28px;display:flex;flex-direction:column;gap:18px"><div style="width:32px;height:4px;border-radius:2px;background:var(--muted-foreground);opacity:.4;margin:0 auto -4px"></div><div style="display:flex;align-items:center;gap:12px"><div style="width:44px;height:44px;border-radius:22px;background:color-mix(in oklch,var(--destructive) 14%,transparent);color:var(--destructive);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.Trash2Icon" size="22" hint-size="22px,22px"></x-import></div><span style="font-size:20px;font-weight:600;letter-spacing:-0.01em">¿Borrar Familia?</span></div><div style="display:flex;flex-direction:column;gap:10px;font-size:15px;line-height:1.5;text-wrap:pretty"><span><strong style="font-weight:600">No se puede deshacer.</strong> Se borran sus 248 obras, con sus ejemplares, series e historial, en este móvil y también en:</span><div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ devices }}" as="d" hint-placeholder-count="3"><span style="height:32px;padding:0 10px;border-radius:8px;background:var(--secondary);color:var(--secondary-foreground);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500"><x-import component-from-global-scope="Library.{{ d.icon }}" size="15" hint-size="15px,15px"></x-import>{{ d.name }}</span></sc-for></div></div><sc-if value="{{ notSaved }}" hint-placeholder-val="{{ true }}"><div style="display:flex;flex-direction:column;gap:12px;padding:16px;border-radius:16px;background:var(--muted)"><span style="font-size:14px;line-height:1.45;text-wrap:pretty">Antes, guarda una copia: con ella podrás recuperar Familia si cambias de idea.</span><button style="height:52px;border-radius:14px;border:0;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px var(--font-sans)"><x-import component-from-global-scope="Library.ArchiveIcon" size="19" hint-size="19px,19px"></x-import>Guardar una copia de Familia</button></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button style="height:52px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--foreground);font:500 15px var(--font-sans)">Cancelar</button><button style="height:52px;border-radius:14px;border:1px solid var(--destructive);background:transparent;color:var(--destructive);font:600 15px var(--font-sans)">Borrar sin copia</button></div></sc-if><sc-if value="{{ saved }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:16px;background:var(--success-soft);color:var(--success)"><x-import component-from-global-scope="Library.CircleCheckIcon" size="22" hint-size="22px,22px"></x-import><div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">Copia guardada</span><span style="font-size:13px;color:var(--foreground)">Google Drive · familia-26-09-2026.zip</span></div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button style="height:52px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--foreground);font:500 15px var(--font-sans)">Cancelar</button><button style="height:52px;border-radius:14px;border:0;background:var(--destructive);color:var(--destructive-foreground);font:600 15px var(--font-sans)">Borrar Familia</button></div></sc-if></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;saved&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const saved = !!this.props.saved;
    return { saved, notSaved: !saved, devices: [
      { icon: 'LaptopIcon', name: 'Portátil' }, { icon: 'SmartphoneIcon', name: 'Pixel 7' }, { icon: 'TabletIcon', name: 'Tablet Lenovo' }
    ] };
  }
}
</script>
</body>
</html>
