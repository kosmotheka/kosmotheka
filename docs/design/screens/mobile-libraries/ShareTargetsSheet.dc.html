<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:100%;height:100%;position:relative;overflow:hidden;font-family:var(--font-sans)"><div style="position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end"><div role="dialog" aria-label="Qué va a Portátil" style="background:var(--popover);color:var(--popover-foreground);border-radius:28px 28px 0 0;padding:10px 0 28px;display:flex;flex-direction:column;gap:12px"><div style="width:32px;height:4px;border-radius:2px;background:var(--muted-foreground);opacity:.4;margin:0 auto 2px"></div><div style="padding:0 24px;display:flex;flex-direction:column;gap:4px"><span style="font-size:20px;font-weight:600;letter-spacing:-0.01em">Qué va a Portátil</span><span style="font-size:14px;line-height:1.45;color:var(--muted-foreground);text-wrap:pretty">Marca las bibliotecas que quieres tener también en el portátil.</span></div><div role="group"><sc-for list="{{ libs }}" as="l" hint-placeholder-count="4"><div role="checkbox" aria-checked="{{ l.on }}" style="display:flex;align-items:center;gap:16px;min-height:56px;padding:0 24px"><sc-if value="{{ l.on }}" hint-placeholder-val="{{ false }}"><span style="width:22px;height:22px;border-radius:6px;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.CheckIcon" size="15" stroke-width="3" hint-size="15px,15px"></x-import></span></sc-if><sc-if value="{{ l.off }}" hint-placeholder-val="{{ true }}"><span style="width:22px;height:22px;border-radius:6px;border:1.5px solid var(--muted-foreground);box-sizing:border-box;flex-shrink:0"></span></sc-if><div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:500">{{ l.name }}</span><span style="font-size:13px;color:var(--muted-foreground)">{{ l.meta }}</span></div></div></sc-for></div><div style="margin:0 24px;display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--warning-soft);font-size:13px;line-height:1.45;color:var(--foreground)"><x-import component-from-global-scope="Library.TriangleAlertIcon" size="17" style="flex-shrink:0;margin-top:1px;color:var(--warning)" hint-size="17px,17px"></x-import><span style="text-wrap:pretty">Has desmarcado <strong style="font-weight:600">Rol</strong>: desaparecerá del portátil la próxima vez que se sincronicen. En este móvil no cambia nada.</span></div><div style="padding:6px 24px 0;display:grid;grid-template-columns:1fr 1fr;gap:10px"><button style="height:52px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--foreground);font:500 15px var(--font-sans)">Cancelar</button><button style="height:52px;border-radius:14px;border:0;background:var(--primary);color:var(--primary-foreground);font:600 15px var(--font-sans)">Guardar</button></div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const mk = (name, meta, on) => ({ name, meta, on, off: !on });
    return { libs: [
      mk('Familia', 'Ya la tiene · 248 obras', true),
      mk('Rol', 'Ya la tiene · 412 obras', false),
      mk('Videojuegos de Hugo', '37 obras', false),
      mk('Juegos de mesa', 'Se enviará al guardar · 64 obras', true)
    ] };
  }
}
</script>
</body>
</html>
