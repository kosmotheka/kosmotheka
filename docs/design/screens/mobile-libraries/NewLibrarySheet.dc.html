<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:100%;height:100%;position:relative;overflow:hidden;font-family:var(--font-sans)"><div style="position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end"><div role="dialog" aria-label="Nueva biblioteca" style="background:var(--popover);color:var(--popover-foreground);border-radius:28px 28px 0 0;padding:10px 24px 28px;display:flex;flex-direction:column;gap:18px"><div style="width:32px;height:4px;border-radius:2px;background:var(--muted-foreground);opacity:.4;margin:0 auto -4px"></div><div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:20px;font-weight:600;letter-spacing:-0.01em">Nueva biblioteca</span><span style="font-size:14px;line-height:1.45;color:var(--muted-foreground);text-wrap:pretty">Una caja aparte, con su propio catálogo. Luego podrás compartirla con otros dispositivos.</span></div><sc-if value="{{ ok }}" hint-placeholder-val="{{ true }}"><label style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:500">Nombre</span><span style="height:52px;border-radius:14px;border:2px solid var(--ring);display:flex;align-items:center;padding:0 14px;font-size:16px;box-sizing:border-box">Música<span style="width:2px;height:22px;background:var(--foreground);margin-left:1px"></span></span><span style="font-size:12px;color:var(--muted-foreground)">Por ejemplo, «Rol» o «Cómics de Marcos». Se puede cambiar cuando quieras.</span></label></sc-if><sc-if value="{{ dup }}" hint-placeholder-val="{{ false }}"><label style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:500">Nombre</span><span aria-invalid="true" style="height:52px;border-radius:14px;border:2px solid var(--destructive);display:flex;align-items:center;padding:0 14px;font-size:16px;box-sizing:border-box">Rol<span style="width:2px;height:22px;background:var(--foreground);margin-left:1px"></span></span><span role="alert" style="display:flex;gap:8px;font-size:13px;line-height:1.45;color:var(--destructive)"><x-import component-from-global-scope="Library.CircleAlertIcon" size="16" style="flex-shrink:0;margin-top:1px" hint-size="16px,16px"></x-import><span style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:600">Ya tienes una biblioteca llamada «Rol».</span><span style="color:var(--muted-foreground)">Usa otro nombre, por ejemplo «Rol de los jueves». Si querías abrir esa, está en el selector.</span></span></span></label></sc-if><sc-if value="{{ ok }}" hint-placeholder-val="{{ true }}"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button style="height:52px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--foreground);font:500 15px var(--font-sans)">Cancelar</button><button style="height:52px;border-radius:14px;border:0;background:var(--primary);color:var(--primary-foreground);font:600 15px var(--font-sans)">Crear</button></div></sc-if><sc-if value="{{ dup }}" hint-placeholder-val="{{ false }}"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><button style="height:52px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--foreground);font:500 15px var(--font-sans)">Abrir Rol</button><button disabled aria-disabled="true" style="height:52px;border-radius:14px;border:0;background:var(--primary);color:var(--primary-foreground);opacity:.45;font:600 15px var(--font-sans)">Crear</button></div></sc-if></div><div aria-hidden="true" style="height:260px;background:var(--muted);border-top:1px solid var(--border);display:flex;flex-direction:column;gap:10px;padding:12px 6px 30px;box-sizing:border-box"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="4"><div style="flex:1;display:flex;gap:6px;justify-content:center"><sc-for list="{{ r.keys }}" as="k" hint-placeholder-count="10"><sc-if value="{{ k.n }}" hint-placeholder-val="{{ true }}"><span style="flex:1;max-width:34px;border-radius:6px;background:var(--background);box-shadow:0 1px 0 var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--foreground)">{{ k.c }}</span></sc-if><sc-if value="{{ k.m }}" hint-placeholder-val="{{ false }}"><span style="flex:1.5;max-width:56px;border-radius:6px;background:var(--background);box-shadow:0 1px 0 var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--foreground)">{{ k.c }}</span></sc-if><sc-if value="{{ k.s }}" hint-placeholder-val="{{ false }}"><span style="flex:5;max-width:200px;border-radius:6px;background:var(--background);box-shadow:0 1px 0 var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--foreground)">{{ k.c }}</span></sc-if><sc-if value="{{ k.a }}" hint-placeholder-val="{{ false }}"><span style="flex:1.8;max-width:72px;border-radius:6px;background:var(--background);box-shadow:0 1px 0 var(--border);display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--foreground)">{{ k.c }}</span></sc-if></sc-for></div></sc-for></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;error&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ninguno&quot;,&quot;nombre repetido&quot;],&quot;default&quot;:&quot;ninguno&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const K = (c, t = 'n') => ({ c, n: t === 'n', m: t === 'm', s: t === 's', a: t === 'a' });
    const k = (s) => s.split('').map(c => K(c));
    const dup = this.props.error === 'nombre repetido';
    return { dup, ok: !dup, rows: [
      { keys: k('qwertyuiop') },
      { keys: k('asdfghjklñ') },
      { keys: [K('⇧', 'm'), ...k('zxcvbnm'), K('⌫', 'm')] },
      { keys: [K('123', 'm'), K(','), K('Español', 's'), K('.'), K('Crear', 'a')] }
    ] };
  }
}
</script>
</body>
</html>
