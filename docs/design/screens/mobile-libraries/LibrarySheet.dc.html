<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:100%;height:100%;position:relative;overflow:hidden;font-family:var(--font-sans)"><div style="position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end"><div role="dialog" aria-label="Tus bibliotecas" style="background:var(--popover);color:var(--popover-foreground);border-radius:28px 28px 0 0;padding:10px 0 28px"><div style="width:32px;height:4px;border-radius:2px;background:var(--muted-foreground);opacity:.4;margin:0 auto 14px"></div><div style="padding:0 24px 8px;display:flex;align-items:baseline;justify-content:space-between"><span style="font-size:17px;font-weight:600">Tus bibliotecas</span><span style="font-size:13px;color:var(--muted-foreground)">4 en este móvil</span></div><sc-for list="{{ libs }}" as="l" hint-placeholder-count="4"><div style="display:flex;align-items:center;gap:14px;padding:8px 8px 8px 24px;min-height:64px"><div style="width:40px;height:40px;border-radius:12px;background:var(--secondary);color:var(--secondary-foreground);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.LibraryBigIcon" size="20" hint-size="20px,20px"></x-import></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="display:flex;align-items:center;gap:6px;font-size:15px;font-weight:500">{{ l.name }}<sc-if value="{{ l.active }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Library.CheckIcon" size="16" stroke-width="2.5" hint-size="16px,16px"></x-import></sc-if></span><span style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted-foreground)">{{ l.count }} obras<sc-if value="{{ l.ok }}" hint-placeholder-val="{{ false }}"><span style="width:6px;height:6px;border-radius:3px;background:var(--success);flex-shrink:0"></span></sc-if><sc-if value="{{ l.warn }}" hint-placeholder-val="{{ false }}"><span style="width:6px;height:6px;border-radius:3px;background:var(--warning);flex-shrink:0"></span></sc-if><sc-if value="{{ l.mute }}" hint-placeholder-val="{{ false }}"><span style="width:6px;height:6px;border-radius:3px;background:var(--muted-foreground);flex-shrink:0"></span></sc-if>{{ l.sync }}</span></div><button aria-label="Ajustes de {{ l.name }}" style="width:44px;height:44px;border:0;border-radius:22px;background:transparent;color:var(--muted-foreground);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.SettingsIcon" size="20" hint-size="20px,20px"></x-import></button></div></sc-for><div style="height:1px;background:var(--border);margin:8px 24px"></div><div style="display:flex;align-items:center;gap:14px;padding:10px 24px;min-height:56px"><div style="width:40px;height:40px;border-radius:12px;border:1px dashed var(--muted-foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.PlusIcon" size="20" hint-size="20px,20px"></x-import></div><div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:500">Nueva biblioteca</span><span style="font-size:13px;color:var(--muted-foreground)">O únete a una con su QR</span></div></div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const ok = 'var(--success)', warn = 'var(--warning)', mute = 'var(--muted-foreground)';
    return { libs: [
      { name: 'Familia', count: '248', sync: 'Al día', ok: true, warn: false, mute: false, err: false, active: true },
      { name: 'Rol', count: '412', sync: 'Sincronizando…', ok: false, warn: false, mute: true, err: false, active: false },
      { name: 'Videojuegos de Hugo', count: '37', sync: 'Sin sincronizar desde hace 3 días', ok: false, warn: true, mute: false, err: false, active: false },
      { name: 'Juegos de mesa', count: '64', sync: 'Solo en este móvil', ok: false, warn: false, mute: true, err: false, active: false }
    ] };
  }
}
</script>
</body>
</html>
