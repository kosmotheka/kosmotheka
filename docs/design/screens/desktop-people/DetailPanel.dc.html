<aside aria-label="Ficha: Dune" style="width:400px;height:100%;flex-shrink:0;border-left:1px solid var(--border);background:var(--background);display:flex;flex-direction:column"><div style="height:52px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 8px 0 20px"><span style="flex:1;font-size:13px;color:var(--muted-foreground)">Libro</span><sc-if value="{{ admin }}" hint-placeholder-val="{{ true }}"><button style="height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 13px var(--font-sans)"><x-import component-from-global-scope="Library.PencilIcon" size="14" hint-size="14px,14px"></x-import>Editar</button></sc-if><button aria-label="Más opciones" style="width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.EllipsisIcon" size="18" hint-size="18px,18px"></x-import></button><button aria-label="Cerrar ficha" style="width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.XIcon" size="18" hint-size="18px,18px"></x-import></button></div><div style="flex:1;min-height:0;overflow:hidden;padding:4px 20px 20px;display:flex;flex-direction:column;gap:20px"><div style="display:flex;gap:16px"><dc-import name="Cover" kind="book" size="{{ 150 }}" style="width:100px;height:150px;flex-shrink:0" hint-size="100px,150px"></dc-import><div style="display:flex;flex-direction:column;gap:5px;padding-top:2px"><span style="font-size:22px;font-weight:600;letter-spacing:-0.02em;line-height:1.15">Dune</span><span style="font-size:14px">Frank Herbert</span><span style="font-size:13px;color:var(--muted-foreground)">1965 · Debolsillo · 784 págs.</span><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:8px"><span style="display:flex;align-items:center;gap:5px;height:24px;padding:0 9px;border-radius:12px;background:var(--success-soft);color:var(--success);font-size:12px;font-weight:600"><x-import component-from-global-scope="Library.CheckIcon" size="13" stroke-width="3" hint-size="13px,13px"></x-import>Lo tienes · 2</span><span style="display:flex;align-items:center;height:24px;padding:0 9px;border-radius:12px;background:var(--muted);font-size:12px;font-weight:500">Leído</span></div></div></div><div role="tablist" style="display:flex;gap:20px;border-bottom:1px solid var(--border);font-size:13px;font-weight:500"><span role="tab" aria-selected="true" style="padding:0 0 10px;box-shadow:inset 0 -2px 0 var(--foreground)">Ficha</span><span role="tab" style="padding:0 0 10px;color:var(--muted-foreground)">Ejemplares · 2</span><span role="tab" style="padding:0 0 10px;color:var(--muted-foreground)">Series</span><span role="tab" style="padding:0 0 10px;color:var(--muted-foreground)">Historial</span></div><div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:12px;font-weight:500;color:var(--muted-foreground)">Ejemplares</span><div style="border:1px solid var(--border);border-radius:12px;display:flex;flex-direction:column"><sc-for list="{{ copies }}" as="c" hint-placeholder-count="2"><sc-if value="{{ c.sep }}" hint-placeholder-val="{{ false }}"><div style="height:1px;background:var(--border)"></div></sc-if><div style="display:flex;align-items:center;gap:12px;padding:10px 12px"><x-import component-from-global-scope="Library.{{ c.icon }}" size="17" hint-size="17px,17px"></x-import><div style="flex:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:14px;font-weight:500">{{ c.what }}</span><span style="font-size:12px;color:var(--muted-foreground)">{{ c.where }}</span></div></div></sc-for></div></div><div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:12px;font-weight:500;color:var(--muted-foreground)">Serie</span><div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border:1px solid var(--border);border-radius:12px"><x-import component-from-global-scope="Library.ListOrderedIcon" size="17" hint-size="17px,17px"></x-import><div style="flex:1;display:flex;flex-direction:column;gap:6px"><span style="font-size:14px;font-weight:500">Saga Dune · n.º 1</span><div aria-label="Tienes 4 de 6" style="display:grid;grid-template-columns:repeat(6,1fr);gap:3px"><span style="height:4px;border-radius:2px;background:var(--foreground)"></span><span style="height:4px;border-radius:2px;background:var(--foreground)"></span><span style="height:4px;border-radius:2px;background:var(--border)"></span><span style="height:4px;border-radius:2px;background:var(--border)"></span><span style="height:4px;border-radius:2px;background:var(--foreground)"></span><span style="height:4px;border-radius:2px;background:var(--foreground)"></span></div><span style="font-size:12px;color:var(--muted-foreground)">Tienes 4 de 6 · te faltan 2</span></div><x-import component-from-global-scope="Library.ChevronRightIcon" size="16" hint-size="16px,16px"></x-import></div></div><div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:12px;font-weight:500;color:var(--muted-foreground)">Datos</span><div style="display:grid;grid-template-columns:96px 1fr;row-gap:8px;font-size:13px"><span style="color:var(--muted-foreground)">ISBN</span><span style="font-family:var(--font-mono);font-size:12.5px">978-84-9759-682-4</span><span style="color:var(--muted-foreground)">Idioma</span><span>Español</span><span style="color:var(--muted-foreground)">Notas</span><span style="text-wrap:pretty">Traducción de Domingo Santos. La de la tapa con el gusano.</span></div></div></div></aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;lector&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      admin: (this.props.role ?? 'admin') !== 'lector',
      copies: [
        { icon: 'BookIcon', what: 'Tapa blanda · 2003', where: 'Salón, balda 3', sep: false },
        { icon: 'TabletIcon', what: 'Kindle', where: 'Digital', sep: true }
      ]
    };
  }
}
</script>
