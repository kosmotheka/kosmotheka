<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:100%;height:100%;position:relative;font-family:var(--font-sans)"><div style="position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding-top:88px;box-sizing:border-box"><div role="dialog" aria-label="Pedir que se añada" style="width:600px;background:var(--background);color:var(--foreground);border-radius:16px;box-shadow:0 0 0 1px var(--border),0 24px 64px -16px oklch(0 0 0 / 40%);display:flex;flex-direction:column;overflow:hidden"><div style="display:flex;align-items:center;gap:12px;padding:18px 16px 0 24px"><h2 style="margin:0;flex:1;font-size:18px;font-weight:600;letter-spacing:-0.01em">Pedir que se añada</h2><button aria-label="Cerrar" style="width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.XIcon" size="18" hint-size="18px,18px"></x-import></button></div><div style="padding:16px 24px 22px;display:flex;flex-direction:column;gap:14px"><div role="search" style="height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;border:1px solid var(--input);font-size:14px"><x-import component-from-global-scope="Library.SearchIcon" size="16" style="color:var(--muted-foreground)" hint-size="16px,16px"></x-import>Tehanu</div><div style="display:flex;gap:14px;align-items:center;padding:12px;border-radius:10px;border:1px solid var(--ring);box-shadow:0 0 0 3px color-mix(in oklch,var(--ring) 20%,transparent)"><dc-import name="Cover" kind="book" size="{{ 72 }}" style="width:48px;height:72px;flex-shrink:0" hint-size="48px,72px"></dc-import><div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">Tehanu</span><span style="font-size:13px">Ursula K. Le Guin</span><span style="font-size:12px;color:var(--muted-foreground)">Libro · 1990 · Minotauro · ISBN 978-84-450-0765-5</span></div><span style="width:18px;height:18px;border-radius:9px;border:2px solid var(--primary);box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="width:6px;height:6px;border-radius:9px;background:var(--primary)"></span></span></div><label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:500">Nota para quien lo decide <span style="font-weight:400;color:var(--muted-foreground)">(opcional)</span></span><span style="min-height:60px;border-radius:8px;border:1px solid var(--input);padding:8px 10px;font-size:14px;box-sizing:border-box">Me lo regaló la abuela, ya lo tengo en la estantería.</span></label></div><div style="display:flex;align-items:center;gap:10px;padding:14px 24px;border-top:1px solid var(--border);background:var(--muted)"><span style="flex:1;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted-foreground)"><span style="display:flex"><x-import component-from-global-scope="Library.InfoIcon" size="15" hint-size="15px,15px"></x-import></span>Eres lector en Familia: lo añade Ana cuando lo acepte.</span><button style="height:36px;display:flex;align-items:center;gap:7px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 14px var(--font-sans);flex-shrink:0;">Cancelar</button><button style="height:36px;display:flex;align-items:center;gap:7px;padding:0 14px;border-radius:8px;border:0;background:var(--primary);color:var(--primary-foreground);font:500 14px var(--font-sans);flex-shrink:0;"><x-import component-from-global-scope="Library.SendIcon" size="16" hint-size="16px,16px"></x-import>Enviar petición</button></div></div></div></div>
</x-dc>
