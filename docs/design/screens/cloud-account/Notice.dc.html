<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div style="width:100%;height:100%;display:flex;flex-direction:column;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><sc-if value="{{ m }}" hint-placeholder-val="{{ true }}"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import></sc-if><div style="flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:24px;padding:32px 28px;max-width:420px;width:100%;box-sizing:border-box;margin:0 auto"><sc-if value="{{ brand }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:10px"><span style="width:40px;height:40px;border-radius:11px;background:var(--foreground);color:var(--background);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.LibraryBigIcon" size="21" hint-size="21px,21px"></x-import></span><span style="font-size:19px;font-weight:600;letter-spacing:-0.01em">Kosmotheka</span></div></sc-if><sc-if value="{{ iconNeutral }}" hint-placeholder-val="{{ true }}"><div style="width:56px;height:56px;border-radius:28px;background:var(--secondary);color:var(--secondary-foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.{{ icon }}" size="26" hint-size="26px,26px"></x-import></div></sc-if><sc-if value="{{ isInvite }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1px solid var(--border)"><span style="width:52px;height:52px;border-radius:14px;background:var(--foreground);color:var(--background);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.LibraryBigIcon" size="24" hint-size="24px,24px"></x-import></span><span style="flex:1;display:flex;flex-direction:column;gap:3px"><span style="font-size:18px;font-weight:600">Familia</span><span style="font-size:14px;color:var(--muted-foreground)">248 obras · libros, juegos y películas</span></span></div></sc-if><div style="display:flex;flex-direction:column;gap:10px"><h1 style="margin:0;font-size:28px;font-weight:600;letter-spacing:-0.02em;line-height:1.15;text-wrap:balance">{{ title }}</h1><p style="margin:0;font-size:16px;line-height:1.5;color:var(--muted-foreground);text-wrap:pretty">{{ body }}</p></div><sc-if value="{{ isInvite }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:10px;font-size:14px"><div style="display:flex;align-items:center;gap:10px"><span aria-hidden="true" style="width:28px;height:28px;border-radius:14px;background:var(--secondary);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600">A</span><span style="flex:1">Te invita <strong style="font-weight:600">Ana Ruiz</strong></span></div><div style="display:flex;align-items:center;gap:10px"><span style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;color:var(--muted-foreground)"><x-import component-from-global-scope="Library.PencilIcon" size="16" hint-size="16px,16px"></x-import></span><span style="flex:1">Entrarás como <strong style="font-weight:600">Editor</strong>: puedes añadir y cambiar obras</span></div><div style="display:flex;align-items:center;gap:10px;color:var(--muted-foreground)"><span style="width:28px;height:28px;display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.ClockIcon" size="16" hint-size="16px,16px"></x-import></span><span style="flex:1">Vale una vez, hasta mañana a las 18:20</span></div></div></sc-if><sc-if value="{{ isSession }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--muted);font-size:14px"><x-import component-from-global-scope="Library.CloudUploadIcon" size="17" hint-size="17px,17px"></x-import><span style="flex:1">12 cambios esperando para subir</span></div></sc-if><sc-if value="{{ isLock }}" hint-placeholder-val="{{ false }}"><button aria-label="Desbloquear con huella" style="align-self:center;width:88px;height:88px;border-radius:44px;border:1px solid var(--border);background:var(--secondary);color:var(--primary);display:flex;align-items:center;justify-content:center;margin:24px 0 8px"><x-import component-from-global-scope="Library.FingerprintIcon" size="40" hint-size="40px,40px"></x-import></button></sc-if><div style="display:flex;flex-direction:column;gap:12px;padding-top:8px"><button style="height:48px;border-radius:12px;border:0;background:var(--primary);color:var(--primary-foreground);font:600 15px var(--font-sans)">{{ primary }}</button><sc-if value="{{ secondary }}" hint-placeholder-val="{{ true }}"><button style="height:48px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--foreground);font:500 15px var(--font-sans)">{{ secondary }}</button></sc-if><sc-if value="{{ note }}" hint-placeholder-val="{{ true }}"><span style="font-size:13px;line-height:1.45;color:var(--muted-foreground);text-align:center;text-wrap:pretty">{{ note }}</span></sc-if></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;shell&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;m&quot;,&quot;d&quot;],&quot;default&quot;:&quot;m&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;welcome&quot;,&quot;removed&quot;,&quot;sessionClosed&quot;,&quot;invite&quot;,&quot;inviteBad&quot;,&quot;lock&quot;],&quot;default&quot;:&quot;welcome&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'welcome', m = (this.props.shell ?? 'm') === 'm';
    const K = {
      welcome: ['', 'Tus bibliotecas, en tus dispositivos', 'Funciona sin cuenta: guardas aquí lo que tienes y lo compartes con los de casa por la wifi. Con una cuenta, además se sincroniza a distancia.', 'Empezar sin cuenta', 'Iniciar sesión o crear cuenta', 'Puedes cambiarlo cuando quieras en Ajustes.'],
      removed: ['SmartphoneIcon', 'Este dispositivo se quitó de una cuenta', 'Se quitó desde otro dispositivo de la cuenta de otra persona, y sus bibliotecas se han borrado de aquí. La app está vacía y lista para usar, con o sin cuenta.', 'Empezar sin cuenta', 'Iniciar sesión o crear cuenta', 'Si era tu cuenta, entra: lo que tenías en la nube volverá.'],
      sessionClosed: ['LogOutIcon', 'Se ha cerrado la sesión', 'La contraseña de tu cuenta se cambió en otro dispositivo. No se pierde nada: tus bibliotecas siguen aquí y los cambios sin subir se enviarán al volver a entrar.', 'Iniciar sesión', 'Ahora no', 'Mientras, todo sigue funcionando por la red de casa.'],
      invite: ['', 'Te invitan a una biblioteca', 'Al entrar, la biblioteca llegará entera a este dispositivo y se mantendrá al día.', 'Crear cuenta', 'Ya tengo cuenta', ''],
      inviteBad: ['Link2OffIcon', 'Esta invitación ya no vale', 'Ya se usó o han pasado más de 24 horas. Cada enlace sirve una sola vez: pide a Ana Ruiz que te mande otro.', 'Abrir Kosmotheka', '', ''],
      lock: ['', 'Kosmotheka está bloqueada', 'Usa tu huella o tu cara para entrar.', 'Desbloquear', 'Usar el PIN del móvil', '']
    }[k];
    return { m, d: !m, brand: k === 'welcome' || k === 'lock', iconNeutral: !!K[0], icon: K[0], isInvite: k === 'invite', isSession: k === 'sessionClosed', isLock: k === 'lock', title: K[1], body: K[2], primary: K[3], secondary: K[4], note: K[5] };
  }
}
</script>
</body>
</html>
