<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div style="width:100%;height:100%;display:flex;flex-direction:column;background:var(--background);color:var(--foreground);font-family:var(--font-sans);overflow:hidden"><sc-if value="{{ m }}" hint-placeholder-val="{{ true }}"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><header style="height:64px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 4px"><button aria-label="Atrás" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.ArrowLeftIcon" size="22" hint-size="22px,22px"></x-import></button><h1 style="margin:0;font-size:20px;font-weight:600">Mis dispositivos</h1></header></sc-if><div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:14px;padding:4px 16px 24px;max-width:680px;width:100%;box-sizing:border-box"><sc-if value="{{ d }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:4px;margin-top:16px"><span style="font-size:13px;color:var(--muted-foreground)">Ajustes › Cuenta</span><h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em">Mis dispositivos</h1></div></sc-if><p style="margin:0;padding:0 2px;font-size:14px;line-height:1.45;color:var(--muted-foreground);text-wrap:pretty">Los que han entrado con tu cuenta. Si quitas uno, cuando se conecte borrará sus bibliotecas.</p><div style="display:flex;flex-direction:column;border-radius:16px;border:1px solid var(--border)"><sc-for list="{{ devs }}" as="v" hint-placeholder-count="3"><sc-if value="{{ v.live }}" hint-placeholder-val="{{ true }}"><div style="min-height:68px;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--border)"><span style="width:40px;height:40px;border-radius:12px;background:var(--secondary);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.{{ v.icon }}" size="19" hint-size="19px,19px"></x-import></span><span style="flex:1;display:flex;flex-direction:column;gap:3px;min-width:0"><span style="display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600">{{ v.name }}<sc-if value="{{ v.self }}" hint-placeholder-val="{{ false }}"><span style="height:20px;padding:0 7px;border-radius:6px;background:var(--secondary);font-size:11px;font-weight:600;display:flex;align-items:center">Este</span></sc-if></span><span style="font-size:13px;color:var(--muted-foreground)">{{ v.seen }}</span></span><sc-if value="{{ v.other }}" hint-placeholder-val="{{ true }}"><button style="height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--foreground);font:500 14px var(--font-sans)">Quitar</button></sc-if></div></sc-if><sc-if value="{{ v.gone }}" hint-placeholder-val="{{ false }}"><div style="min-height:68px;display:flex;align-items:center;gap:12px;padding:10px 12px 10px 16px;border-bottom:1px solid var(--border);background:var(--muted)"><span style="width:40px;height:40px;border-radius:12px;border:1px dashed var(--border);color:var(--muted-foreground);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.{{ v.icon }}" size="19" hint-size="19px,19px"></x-import></span><span style="flex:1;display:flex;flex-direction:column;gap:3px;min-width:0"><span style="font-size:15px;font-weight:600;color:var(--muted-foreground);text-decoration:line-through">{{ v.name }}</span><span style="font-size:13px;line-height:1.35;color:var(--foreground);text-wrap:pretty">Quitado · se borrará al conectarse</span></span><button style="height:40px;padding:0 14px;border-radius:12px;border:0;background:transparent;color:var(--primary);font:600 14px var(--font-sans);display:flex;align-items:center;gap:6px"><x-import component-from-global-scope="Library.Undo2Icon" size="16" hint-size="16px,16px"></x-import>Deshacer</button></div></sc-if></sc-for></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;shell&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;m&quot;,&quot;d&quot;],&quot;default&quot;:&quot;m&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;undo&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = (this.props.shell ?? 'm') === 'm', undo = !!this.props.undo;
    const raw = [['Móvil de Ana', 'SmartphoneIcon', 'Ahora'], ['Portátil', 'LaptopIcon', 'Hace 2 horas'], ['Tablet de la cocina', 'TabletIcon', 'Hace 3 días · Android']];
    const me = m ? 0 : 1;
    const devs = raw.map(([name, icon, seen], i) => { const self = i === me, gone = undo && i === 2; return { name, icon, seen: self ? 'Ahora · este dispositivo' : (i === 0 ? 'Hace 10 minutos' : seen), self, other: !self, live: !gone, gone }; });
    return { m, d: !m, devs };
  }
}
</script>
</body>
</html>
