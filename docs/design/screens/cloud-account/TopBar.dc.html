<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<header style="height:56px;flex-shrink:0;display:flex;align-items:center;gap:8px;padding:0 16px 0 20px;border-bottom:1px solid var(--border);background:var(--background);box-sizing:border-box"><sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}"><div role="search" style="width:360px;height:36px;display:flex;align-items:center;gap:8px;padding:0 10px;border-radius:8px;border:1px solid var(--input);color:var(--muted-foreground);font-size:14px;box-sizing:border-box"><x-import component-from-global-scope="Library.SearchIcon" size="16" hint-size="16px,16px"></x-import><span style="flex:1">Buscar en {{ library }}</span><kbd style="font:500 11px var(--font-mono);padding:2px 6px;border-radius:4px;border:1px solid var(--border);background:var(--muted)">Ctrl K</kbd></div></sc-if><sc-if value="{{ searching }}" hint-placeholder-val="{{ false }}"><div role="search" style="width:520px;height:36px;display:flex;align-items:center;gap:8px;padding:0 3px 0 10px;border-radius:8px;border:1px solid var(--ring);box-shadow:0 0 0 3px color-mix(in oklch,var(--ring) 30%,transparent);color:var(--foreground);font-size:14px;box-sizing:border-box"><x-import component-from-global-scope="Library.SearchIcon" size="16" hint-size="16px,16px"></x-import><span style="flex:1">{{ query }}</span><div role="radiogroup" aria-label="Dónde buscar" style="display:flex;padding:2px;border-radius:6px;background:var(--muted)"><sc-if value="{{ inThis }}" hint-placeholder-val="{{ false }}"><span role="radio" aria-checked="true" style="height:26px;padding:0 10px;border-radius:5px;background:var(--background);box-shadow:0 1px 2px oklch(0 0 0 / 12%);display:flex;align-items:center;font-size:12.5px;font-weight:600">En {{ library }}</span><span role="radio" aria-checked="false" style="height:26px;padding:0 10px;display:flex;align-items:center;font-size:12.5px;color:var(--muted-foreground)">En todas</span></sc-if><sc-if value="{{ inAll }}" hint-placeholder-val="{{ true }}"><span role="radio" aria-checked="false" style="height:26px;padding:0 10px;display:flex;align-items:center;font-size:12.5px;color:var(--muted-foreground)">En {{ library }}</span><span role="radio" aria-checked="true" style="height:26px;padding:0 10px;border-radius:5px;background:var(--background);box-shadow:0 1px 2px oklch(0 0 0 / 12%);display:flex;align-items:center;font-size:12.5px;font-weight:600">En todas</span></sc-if></div></div></sc-if><span style="flex:1"></span><sc-if value="{{ cNone }}" hint-placeholder-val="{{ true }}"><button aria-label="Estado de sincronización: al día. Ver ayuda" style="height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--muted-foreground);font:400 13px var(--font-sans)"><span style="width:7px;height:7px;border-radius:4px;background:var(--success)"></span>Al día</button></sc-if><sc-if value="{{ cOn }}" hint-placeholder-val="{{ false }}"><button aria-label="Nube conectada, al día. Ver detalles" style="height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--muted-foreground);font:400 13px var(--font-sans)"><x-import component-from-global-scope="Library.CloudIcon" size="15" hint-size="15px,15px"></x-import><span style="width:7px;height:7px;border-radius:4px;background:var(--success)"></span>Al día</button></sc-if><sc-if value="{{ cOff }}" hint-placeholder-val="{{ false }}"><button aria-label="Sin conexión con la nube. Ver detalles" style="height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:var(--muted-foreground);font:400 13px var(--font-sans)"><x-import component-from-global-scope="Library.CloudOffIcon" size="15" hint-size="15px,15px"></x-import><span style="width:7px;height:7px;border-radius:4px;background:var(--warning)"></span>Sin conexión con la nube</button></sc-if><sc-if value="{{ admin }}" hint-placeholder-val="{{ true }}"><button aria-label="Peticiones pendientes: 3" style="position:relative;width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.BellIcon" size="18" hint-size="18px,18px"></x-import><span style="position:absolute;top:2px;right:0;min-width:16px;height:16px;padding:0 4px;box-sizing:border-box;border-radius:8px;background:var(--destructive);color:#fff;font-size:10px;font-weight:600;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 2px var(--background)">3</span></button></sc-if><span style="width:1px;height:20px;background:var(--border);margin:0 4px"></span><button style="height:36px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 14px var(--font-sans)"><x-import component-from-global-scope="Library.ScanBarcodeIcon" size="16" hint-size="16px,16px"></x-import>Escanear</button><sc-if value="{{ canAdd }}" hint-placeholder-val="{{ true }}"><button style="height:36px;display:flex;align-items:center;gap:7px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 14px var(--font-sans)"><x-import component-from-global-scope="Library.ZapIcon" size="16" hint-size="16px,16px"></x-import>Alta rápida</button><button style="height:36px;display:flex;align-items:center;gap:7px;padding:0 14px;border-radius:8px;border:0;background:var(--primary);color:var(--primary-foreground);font:500 14px var(--font-sans)"><x-import component-from-global-scope="Library.PlusIcon" size="16" hint-size="16px,16px"></x-import>Añadir</button></sc-if><sc-if value="{{ reader }}" hint-placeholder-val="{{ false }}"><button style="height:36px;display:flex;align-items:center;gap:7px;padding:0 14px;border-radius:8px;border:0;background:var(--primary);color:var(--primary-foreground);font:500 14px var(--font-sans)"><x-import component-from-global-scope="Library.SendIcon" size="16" hint-size="16px,16px"></x-import>Pedir que se añada</button></sc-if></header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;library&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Familia&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;query&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;editor&quot;,&quot;lector&quot;,&quot;none&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;cloud&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;none&quot;,&quot;on&quot;,&quot;off&quot;],&quot;default&quot;:&quot;none&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;scope&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;esta&quot;,&quot;todas&quot;],&quot;default&quot;:&quot;todas&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const q = this.props.query ?? '';
    const all = (this.props.scope ?? 'todas') === 'todas';
    const role = this.props.role ?? 'admin';
    const c = this.props.cloud ?? 'none';
    return { cNone: c === 'none', cOn: c === 'on', cOff: c === 'off', admin: role === 'admin', reader: role === 'lector', canAdd: role !== 'lector', library: this.props.library ?? 'Familia', query: q, searching: !!q, idle: !q, inAll: all, inThis: !all };
  }
}
</script>
</body>
</html>
