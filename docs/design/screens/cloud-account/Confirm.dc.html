<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div role="dialog" aria-label="{{ title }}" style="display:flex;flex-direction:column;gap:18px;color:var(--popover-foreground);font-family:var(--font-sans)"><div style="display:flex;align-items:center;gap:12px"><sc-if value="{{ danger }}" hint-placeholder-val="{{ true }}"><span style="width:44px;height:44px;border-radius:22px;background:color-mix(in oklch,var(--destructive) 12%,transparent);color:var(--destructive);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.{{ icon }}" size="21" hint-size="21px,21px"></x-import></span></sc-if><sc-if value="{{ neutral }}" hint-placeholder-val="{{ false }}"><span style="width:44px;height:44px;border-radius:22px;background:var(--secondary);color:var(--secondary-foreground);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.{{ icon }}" size="21" hint-size="21px,21px"></x-import></span></sc-if><span style="flex:1;font-size:20px;font-weight:600;letter-spacing:-0.01em;line-height:1.2;text-wrap:balance">{{ title }}</span></div><p style="margin:0;font-size:15px;line-height:1.5;text-wrap:pretty">{{ body }}</p><sc-if value="{{ hasChips }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ chips }}" as="c" hint-placeholder-count="3"><span style="height:28px;padding:0 10px;border-radius:8px;background:var(--secondary);display:flex;align-items:center;font-size:13px;font-weight:500">{{ c }}</span></sc-for></div></sc-if><sc-if value="{{ hasRows }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:10px"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="2"><div style="display:flex;gap:10px;font-size:14px;line-height:1.45"><span style="flex-shrink:0;padding-top:1px;color:var(--muted-foreground)"><x-import component-from-global-scope="Library.{{ r.icon }}" size="17" hint-size="17px,17px"></x-import></span><span style="text-wrap:pretty"><strong style="font-weight:600">{{ r.b }}</strong> {{ r.t }}</span></div></sc-for></div></sc-if><sc-if value="{{ warn }}" hint-placeholder-val="{{ false }}"><div role="status" style="display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--warning-soft);font-size:14px;line-height:1.45"><span style="flex-shrink:0;padding-top:1px;color:var(--warning)"><x-import component-from-global-scope="Library.TriangleAlertIcon" size="17" hint-size="17px,17px"></x-import></span><span style="text-wrap:pretty">{{ warn }}</span></div></sc-if><sc-if value="{{ copy }}" hint-placeholder-val="{{ false }}"><button style="height:44px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--foreground);font:500 14px var(--font-sans);display:flex;align-items:center;justify-content:center;gap:8px"><x-import component-from-global-scope="Library.ArchiveIcon" size="16" hint-size="16px,16px"></x-import>Guardar una copia antes</button></sc-if><sc-for list="{{ fields }}" as="f" hint-placeholder-count="0"><label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:14px;font-weight:500">{{ f.label }}</span><span style="height:46px;display:flex;align-items:center;padding:0 14px;border-radius:12px;border:1px solid var(--input);font-size:16px;letter-spacing:2px">{{ f.val }}</span></label></sc-for><sc-if value="{{ note }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;line-height:1.45;color:var(--muted-foreground);text-wrap:pretty">{{ note }}</span></sc-if><div style="display:flex;flex-direction:row-reverse;gap:10px;padding-top:4px"><sc-if value="{{ danger }}" hint-placeholder-val="{{ true }}"><button style="flex:1;height:48px;border-radius:12px;border:0;background:var(--destructive);color:var(--destructive-foreground);font:600 15px var(--font-sans)">{{ action }}</button></sc-if><sc-if value="{{ neutral }}" hint-placeholder-val="{{ false }}"><button style="flex:1;height:48px;border-radius:12px;border:0;background:var(--foreground);color:var(--background);font:600 15px var(--font-sans)">{{ action }}</button></sc-if><button style="flex:1;height:48px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--foreground);font:500 15px var(--font-sans)">Cancelar</button></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:440,&quot;height&quot;:520},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;removeDevice&quot;,&quot;deleteAccount&quot;,&quot;handOver&quot;,&quot;signOut&quot;,&quot;stopCloud&quot;,&quot;twofaOff&quot;],&quot;default&quot;:&quot;removeDevice&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'removeDevice';
    const P = (label) => ({ label, val: '••••••••••' });
    const K = {
      removeDevice: { danger: true, icon: 'TabletIcon', title: '¿Quitar Tablet de la cocina?', body: 'Saldrá de tu cuenta. Cuando se conecte, borrará de ella todas tus bibliotecas y dejará de sincronizar.', warn: 'Tiene 1 biblioteca que no está en la nube, Recetas de la abuela: se perderá.', note: 'Hasta que se conecte puedes deshacerlo desde la lista.', action: 'Quitar' },
      deleteAccount: { danger: true, icon: 'Trash2Icon', title: '¿Borrar tu cuenta?', body: 'Se borra para siempre de kosmotheka.app y se cierra la sesión en tus 3 dispositivos.', rows: [{ icon: 'UsersIcon', b: 'Familia y Juegos de mesa', t: 'están compartidas: seguirán para los demás, sin ti.' }, { icon: 'Trash2Icon', b: 'Recetas de la abuela', t: 'solo era tuya: se borrará.' }], copy: true, fields: [P('Contraseña')], action: 'Borrar la cuenta' },
      handOver: { danger: true, icon: 'HandHelpingIcon', title: '¿Dejar este dispositivo a otra persona?', body: 'La app quedará como recién instalada: se borran de aquí todas las bibliotecas y, si la hay, tu sesión.', chips: ['Familia', 'Juegos de mesa', 'Recetas de la abuela'], copy: true, note: 'Lo que está en la nube o en tus otros dispositivos no se toca.', action: 'Borrar y dejarlo' },
      signOut: { danger: false, icon: 'LogOutIcon', title: '¿Cerrar sesión?', body: 'Soy yo y volveré: no se borra nada. Tus bibliotecas siguen aquí y se comparten por la red de casa; lo que cambies se subirá al volver a entrar.', note: '¿Vas a dar el dispositivo a otra persona? Usa «Dejar este dispositivo a otra persona», en Ajustes.', action: 'Cerrar sesión' },
      stopCloud: { danger: false, icon: 'CloudOffIcon', title: '¿Quitar Familia de la nube?', body: 'Seguirá en tus dispositivos y en los de los demás, y se compartirá por la red local como antes.', warn: 'Laura solo la recibe por la nube: dejará de recibir cambios hasta que vinculéis sus dispositivos con el QR.', action: 'Quitar de la nube' },
      twofaOff: { danger: true, icon: 'ShieldOffIcon', title: '¿Desactivar el segundo factor?', body: 'Para entrar bastará con la contraseña. Los códigos de respaldo dejarán de valer.', fields: [P('Contraseña'), { label: 'Código de la app', val: '275913' }], note: 'Para generar códigos nuevos se piden los mismos datos.', action: 'Desactivar' }
    }[k];
    const chips = K.chips || [], rows = K.rows || [];
    return { ...K, danger: !!K.danger, neutral: !K.danger, chips, hasChips: chips.length > 0, rows, hasRows: rows.length > 0, warn: K.warn || '', copy: !!K.copy, fields: K.fields || [], note: K.note || '' };
  }
}
</script>
</body>
</html>
