<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><div style="height:100%;display:flex;flex-direction:column;position:relative"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><dc-import name="AppBar" library="{{ library }}" role="{{ role }}" hint-size="100%,64px"></dc-import><sc-if value="{{ list }}" hint-placeholder-val="{{ true }}"><div style="display:flex;gap:8px;padding:4px 16px 12px;overflow:hidden;flex-shrink:0"><sc-if value="{{ noMf }}" hint-placeholder-val="{{ true }}"><button aria-label="Filtros" style="height:36px;padding:0 12px;border-radius:10px;border:1px solid var(--border);background:transparent;color:var(--foreground);display:flex;align-items:center;gap:6px;font:500 14px var(--font-sans);flex-shrink:0"><x-import component-from-global-scope="Library.SlidersHorizontalIcon" size="16" hint-size="16px,16px"></x-import>Filtros</button></sc-if><sc-if value="{{ mf }}" hint-placeholder-val="{{ false }}"><button aria-label="Filtros" style="height:36px;padding:0 12px;border-radius:10px;border:0;background:color-mix(in oklch,var(--primary) 12%,transparent);box-shadow:inset 0 0 0 1px var(--primary);color:var(--foreground);display:flex;align-items:center;gap:6px;font:500 14px var(--font-sans);flex-shrink:0"><x-import component-from-global-scope="Library.SlidersHorizontalIcon" size="16" hint-size="16px,16px"></x-import>Filtros<span style="min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--primary);color:var(--primary-foreground);font-size:11.5px;font-weight:600;display:flex;align-items:center;justify-content:center;box-sizing:border-box">2</span></button></sc-if><span style="height:36px;padding:0 14px;border-radius:10px;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;font-size:14px;font-weight:500;flex-shrink:0">Todo</span><span style="height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;font-size:14px;flex-shrink:0">Libros</span><span style="height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;font-size:14px;flex-shrink:0">Juegos de mesa</span><span style="height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--border);display:flex;align-items:center;font-size:14px;flex-shrink:0">Música</span></div><div style="padding:0 16px 6px;font-size:12px;color:var(--muted-foreground);flex-shrink:0">{{ countLabel }}</div><div style="flex:1;overflow:hidden"><sc-for list="{{ items }}" as="it" hint-placeholder-count="6"><div style="display:flex;gap:14px;align-items:center;padding:10px 16px;min-height:64px"><div style="width:48px;display:flex;justify-content:center"><dc-import name="Cover" kind="{{ it.kind }}" size="{{ 64 }}" style="width:48px;height:64px" hint-size="48px,64px"></dc-import></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="display:flex;align-items:center;gap:6px;min-width:0"><span style="font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.title }}</span><sc-if value="{{ it.hasSt }}" hint-placeholder-val="{{ false }}"><span aria-label="{{ it.stLabel }}" style="display:flex;flex-shrink:0;color:var(--muted-foreground)"><x-import component-from-global-scope="Library.{{ it.stIcon }}" size="15" hint-size="15px,15px"></x-import></span></sc-if><sc-if value="{{ it.fav }}" hint-placeholder-val="{{ false }}"><span aria-label="Favorito" style="display:flex;flex-shrink:0;color:var(--muted-foreground)"><x-import component-from-global-scope="Library.HeartIcon" size="13" fill="currentColor" hint-size="13px,13px"></x-import></span></sc-if></span><span style="font-size:13px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.meta }}</span><span style="display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted-foreground)"><span style="padding:1px 7px;border-radius:6px;border:1px solid var(--border);color:var(--foreground)">{{ it.format }}</span>{{ it.where }}</span></div></div></sc-for></div><sc-if value="{{ canAdd }}" hint-placeholder-val="{{ true }}"><button style="position:absolute;right:16px;bottom:112px;height:56px;padding:0 20px 0 16px;border:0;border-radius:16px;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;gap:10px;font:600 15px var(--font-sans);box-shadow:0 8px 20px -6px oklch(0 0 0 / 35%)"><x-import component-from-global-scope="Library.PlusIcon" size="22" hint-size="22px,22px"></x-import>Añadir</button></sc-if><sc-if value="{{ reader }}" hint-placeholder-val="{{ false }}"><button style="position:absolute;right:16px;bottom:112px;height:56px;padding:0 20px 0 16px;border:0;border-radius:16px;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;gap:10px;font:600 15px var(--font-sans);box-shadow:0 8px 20px -6px oklch(0 0 0 / 35%)"><x-import component-from-global-scope="Library.SendIcon" size="20" hint-size="20px,20px"></x-import>Pedir que se añada</button></sc-if></sc-if><sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}"><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:0 32px 60px;text-align:center"><div style="width:56px;height:56px;border-radius:28px;background:var(--muted);color:var(--muted-foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.LibraryBigIcon" size="26" hint-size="26px,26px"></x-import></div><span style="font-size:18px;font-weight:600;margin-top:4px">{{ library }} está vacía</span><span style="font-size:14px;line-height:1.5;color:var(--muted-foreground);text-wrap:pretty">Busca por título o código, o escanea con la cámara. Discos, libros, juegos… todo cabe.</span><button style="margin-top:10px;height:52px;padding:0 22px;border-radius:14px;border:0;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;gap:8px;font:600 15px var(--font-sans)"><x-import component-from-global-scope="Library.PlusIcon" size="20" hint-size="20px,20px"></x-import>Añadir lo primero</button></div></sc-if><sc-if value="{{ hasToast }}" hint-placeholder-val="{{ false }}"><div role="status" style="position:absolute;left:16px;right:16px;bottom:111px;display:flex;align-items:center;gap:12px;min-height:48px;padding:10px 8px 10px 16px;box-sizing:border-box;border-radius:12px;background:var(--foreground);color:var(--background);font-size:14px;line-height:1.35;box-shadow:0 12px 28px -8px oklch(0 0 0 / 40%)"><span style="flex:1;text-wrap:pretty">{{ toast }}</span><sc-if value="{{ toastAction }}" hint-placeholder-val="{{ false }}"><button style="height:40px;padding:0 12px;border:0;border-radius:8px;background:transparent;color:var(--background);font:600 14px var(--font-sans);text-decoration:underline;text-underline-offset:3px">{{ toastAction }}</button></sc-if></div></sc-if><dc-import name="BottomNav" active="catalog" hint-size="100%,95px"></dc-import></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;mineFilter&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;library&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Familia&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;lista&quot;,&quot;vacía&quot;],&quot;default&quot;:&quot;lista&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;toast&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;toastAction&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;exclude&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;editor&quot;,&quot;lector&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;count&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;248&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const library = this.props.library ?? 'Familia';
    const state = this.props.state ?? 'lista';
    const exclude = this.props.exclude ?? '';
    const familia = [
      { kind: 'music', title: 'Abbey Road', meta: 'Música · The Beatles · 1969', format: 'Vinilo', where: 'Salón' },
      { kind: 'comic', title: 'Astérix el galo', meta: 'Cómic · Goscinny, Uderzo · 1961', format: 'Tapa dura', where: 'Salón' },
      { kind: 'film', title: 'Blade Runner 2049', meta: 'Película · Denis Villeneuve · 2017', format: 'Blu-ray', where: 'Salón' },
      { kind: 'game', title: 'Catán', meta: 'Juego de mesa · 3–4 jugadores', format: 'Caja', where: 'Estudio' },
      { kind: 'book', title: 'Dune', meta: 'Libro · Frank Herbert · 1965', format: 'Tapa blanda', where: 'Salón · +1' },
      { kind: 'book', title: 'La mano izquierda de la oscuridad', meta: 'Libro · Ursula K. Le Guin · 1969', format: 'Kindle', where: 'Digital' },
      { kind: 'videogame', title: 'Zelda: Tears of the Kingdom', meta: 'Videojuego · Switch · 2023', format: 'Cartucho', where: 'Cuarto de Hugo' },
      { kind: 'other', title: 'Playmobil Barco pirata 5135', meta: 'Otro · 2006', format: 'Caja', where: 'Trastero' }
    ];
    const rol = [
      ['El Anillo Único', 'Francesc Matas Salla · 2022', 'Tapa dura'], ['Aquelarre', 'Ricard Ibáñez · 1990', 'Tapa dura'],
      ['Cyberpunk RED', 'Mike Pondsmith · 2020', 'PDF'], ['Dune: Aventuras en el Imperio', 'Modiphius · 2021', 'Tapa dura'],
      ['La llamada de Cthulhu', 'Sandy Petersen · 2016', 'Tapa dura'], ['Manual del jugador', 'D&D 5ª edición · 2014', 'Tapa dura'],
      ['Mothership', 'Tuesday Knight Games · 2023', 'Caja'], ['Pathfinder: Manual básico', 'Paizo · 2019', 'PDF']
    ].map(([title, by, format]) => ({ kind: 'book', title, meta: 'Libro · ' + by, format, where: format === 'PDF' ? 'Digital' : 'Estudio' }));
    const mine = { 'Dune': ['done', true], 'Astérix el galo': ['done', false], 'Catán': ['done', true], 'La mano izquierda de la oscuridad': ['reading', false], 'Blade Runner 2049': ['pending', false], 'Zelda: Tears of the Kingdom': ['dropped', false] };
    const stI = { pending: ['CircleDashedIcon', 'Pendiente'], reading: ['CircleDotIcon', 'Leyendo'], done: ['CircleCheckIcon', 'Terminado'], dropped: ['CircleSlashIcon', 'Abandonado'] };
    const mf = !!this.props.mineFilter;
    let items = (library === 'Rol' ? rol : familia).filter(i => i.title !== exclude).map(i => { const m = mine[i.title]; return { ...i, hasSt: !!m, stIcon: m ? stI[m[0]][0] : '', stLabel: m ? 'Mi estado: ' + stI[m[0]][1] : '', fav: !!(m && m[1]), st: m ? m[0] : '' }; });
    if (mf) items = items.filter(i => i.st === 'done' && i.fav);
    const count = this.props.count ?? (library === 'Rol' ? '412' : '248');
    const __role = this.props.role ?? 'admin';
    return { reader: __role === 'lector', canAdd: __role !== 'lector',
      role: this.props.role ?? 'admin', library, items, list: state === 'lista', empty: state === 'vacía',
      countLabel: mf ? '2 de ' + count + ' · Terminado · Mis favoritos' : count + ' obras · por título', mf, noMf: !mf,
      toast: this.props.toast ?? '', hasToast: !!this.props.toast, toastAction: this.props.toastAction ?? ''
    };
  }
}
</script>
</body>
</html>
