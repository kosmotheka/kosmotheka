<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end;font-family:var(--font-sans);color:var(--foreground)"><div role="dialog" aria-label="Nuevo ejemplar" style="background:var(--background);border-radius:28px 28px 0 0;padding:10px 16px 24px;display:flex;flex-direction:column;gap:16px"><span style="width:32px;height:4px;border-radius:2px;background:var(--muted-foreground);opacity:0.4;align-self:center"></span><div style="display:flex;flex-direction:column;gap:2px"><span style="font-size:18px;font-weight:600">Nuevo ejemplar</span><span style="font-size:13.5px;color:var(--muted-foreground)">{{ title }}</span></div><sc-if value="{{ isVg }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:500">Plataforma</span><div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ platforms }}" as="p" hint-placeholder-count="4"><sc-if value="{{ p.on }}" hint-placeholder-val="{{ false }}"><span role="radio" aria-checked="true" style="height:40px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:10px;background:var(--primary);color:var(--primary-foreground);font-size:14px;font-weight:500"><x-import component-from-global-scope="Library.CheckIcon" size="15" stroke-width="2.5" hint-size="15px,15px"></x-import>{{ p.label }}</span></sc-if><sc-if value="{{ p.off }}" hint-placeholder-val="{{ true }}"><span role="radio" aria-checked="false" style="height:40px;display:flex;align-items:center;padding:0 14px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--border);font-size:14px">{{ p.label }}</span></sc-if></sc-for><span style="height:40px;display:flex;align-items:center;gap:6px;padding:0 12px;border-radius:10px;border:1px dashed var(--border);font-size:14px;color:var(--muted-foreground)"><x-import component-from-global-scope="Library.PlusIcon" size="15" hint-size="15px,15px"></x-import>Otra</span></div></div></sc-if><div style="display:flex;flex-direction:column;gap:8px"><span style="font-size:13px;font-weight:500">Formato</span><sc-if value="{{ single }}" hint-placeholder-val="{{ false }}"><span style="font-size:14px;color:var(--muted-foreground)">Otro · es el único formato de «Otro»</span></sc-if><sc-if value="{{ multi }}" hint-placeholder-val="{{ true }}"><div role="radiogroup" aria-label="Formato" style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ formats }}" as="f" hint-placeholder-count="4"><sc-if value="{{ f.on }}" hint-placeholder-val="{{ false }}"><span role="radio" aria-checked="true" style="height:40px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:10px;background:var(--primary);color:var(--primary-foreground);font-size:14px;font-weight:500"><x-import component-from-global-scope="Library.CheckIcon" size="15" stroke-width="2.5" hint-size="15px,15px"></x-import>{{ f.label }}</span></sc-if><sc-if value="{{ f.off }}" hint-placeholder-val="{{ true }}"><span role="radio" aria-checked="false" style="height:40px;display:flex;align-items:center;gap:6px;padding:0 14px;border-radius:10px;box-shadow:inset 0 0 0 1px var(--border);font-size:14px">{{ f.label }}<sc-if value="{{ f.cloud }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Library.CloudIcon" size="14" aria-label="digital" style="color:var(--muted-foreground)" hint-size="14px,14px"></x-import></sc-if></span></sc-if></sc-for></div></sc-if></div><sc-if value="{{ isSeries }}" hint-placeholder-val="{{ false }}"><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">Qué temporadas <span style="font-weight:400;color:var(--muted-foreground);margin-top:-4px">Opcional. Vacío si están todas</span><span style="height:44px;border-radius:10px;border:1px solid var(--input);display:flex;align-items:center;padding:0 12px;font-size:15px;font-weight:400">1–2</span></label></sc-if><div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr);gap:10px"><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">De quién<span style="height:44px;border-radius:10px;border:1px solid var(--input);display:flex;align-items:center;gap:6px;padding:0 12px;font-size:15px;font-weight:400"><span style="flex:1">{{ owner }}</span><x-import component-from-global-scope="Library.ChevronDownIcon" size="16" style="color:var(--muted-foreground)" hint-size="16px,16px"></x-import></span></label><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">Dónde<span style="height:44px;border-radius:10px;border:2px solid var(--ring);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:15px;font-weight:400"><x-import component-from-global-scope="Library.{{ whereIcon }}" size="16" style="color:var(--muted-foreground)" hint-size="16px,16px"></x-import><span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ where }}</span></span></label></div><div style="display:flex;flex-direction:column;gap:8px;margin-top:-6px"><span style="font-size:12.5px;line-height:1.4;color:var(--muted-foreground);text-wrap:pretty">{{ whereHint }}</span><div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ sugg }}" as="s" hint-placeholder-count="3"><span style="height:36px;display:flex;align-items:center;padding:0 12px;border-radius:18px;background:var(--muted);font-size:13.5px">{{ s.name }}</span></sc-for></div></div><button style="height:52px;border-radius:14px;border:0;background:var(--primary);color:var(--primary-foreground);font:600 15px var(--font-sans);margin-top:2px">Guardar ejemplar</button></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;book&quot;,&quot;comic&quot;,&quot;game&quot;,&quot;film&quot;,&quot;series&quot;,&quot;videogame&quot;,&quot;music&quot;,&quot;other&quot;],&quot;default&quot;:&quot;book&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;digital&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'book';
    const dig = !!this.props.digital;
    const F = { book: [['Tapa dura'], ['Tapa blanda'], ['Bolsillo'], ['Ebook', 1], ['PDF', 1], ['Audiolibro', 1]], comic: [['Tapa dura'], ['Tapa blanda'], ['Grapa'], ['Digital', 1]], game: [['Caja'], ['Digital', 1]], film: [['DVD'], ['Blu-ray'], ['4K'], ['Digital', 1]], series: [['DVD'], ['Blu-ray'], ['Digital', 1]], videogame: [['Físico (cartucho o disco)'], ['Digital', 1]], music: [['Vinilo'], ['CD'], ['Casete'], ['Digital', 1]], other: [['Otro']] };
    const T = { book: 'Dune', comic: 'Watchmen', game: 'Carcassonne', film: 'Blade Runner 2049', series: 'Twin Peaks', videogame: 'Zelda: Breath of the Wild', music: 'Abbey Road', other: 'Playmobil Barco pirata 5135' };
    const DS = { book: ['Kindle', 'Kobo', 'Audible'], comic: ['ComiXology', 'Kindle'], game: ['Board Game Arena', 'Tabletopia'], film: ['Apple TV', 'Google TV', 'Filmin'], series: ['Apple TV', 'Filmin', 'Google TV'], videogame: ['Nintendo eShop', 'Steam', 'PlayStation Store'], music: ['Bandcamp', 'Spotify', 'Apple Music'], other: [] };
    const DW = { book: 'Kindle', comic: 'ComiXology', game: 'Board Game Arena', film: 'Apple TV', series: 'Filmin', videogame: 'Nintendo eShop', music: 'Bandcamp', other: '' };
    const list = F[k] || F.other;
    const selIdx = dig ? list.findIndex(f => f[1]) : (k === 'book' ? 1 : 0);
    return {
      title: T[k], isVg: k === 'videogame', isSeries: k === 'series', single: list.length === 1, multi: list.length > 1,
      platforms: ['Switch', 'Wii U', 'PC', 'PS5'].map((l, i) => ({ label: l, on: i === 0, off: i !== 0 })),
      formats: list.map(([l, c], i) => ({ label: l, cloud: !!c, on: i === selIdx, off: i !== selIdx })),
      owner: k === 'videogame' ? 'Hugo' : 'Tú',
      where: dig ? DW[k] : 'Salón, balda 3', whereIcon: dig ? 'CloudIcon' : 'MapPinIcon',
      whereHint: dig ? 'Lo digital no está en una balda: di dónde lo tienes.' : 'La habitación y, si quieres, la balda.',
      sugg: (dig ? DS[k] : ['Salón', 'Estudio', 'Cuarto de Hugo', 'Trastero']).map(name => ({ name }))
    };
  }
}
</script>
</body>
</html>
