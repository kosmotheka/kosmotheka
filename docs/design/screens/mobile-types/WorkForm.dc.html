<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><div style="height:100%;display:flex;flex-direction:column"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><header style="height:64px;display:flex;align-items:center;gap:4px;padding:0 12px 0 4px;flex-shrink:0"><button aria-label="Cerrar" style="width:48px;height:48px;border:0;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.XIcon" size="22" hint-size="22px,22px"></x-import></button><span style="flex:1;font-size:18px;font-weight:600">{{ heading }}</span><button style="height:40px;padding:0 18px;border-radius:12px;border:0;background:var(--primary);color:var(--primary-foreground);font:600 14px var(--font-sans)">Guardar</button></header><div style="flex:1;overflow:hidden;padding:4px 16px 24px;display:flex;flex-direction:column;gap:14px"><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">Tipo<span style="height:44px;border-radius:10px;border:1px solid var(--input);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:15px;font-weight:400"><x-import component-from-global-scope="Library.{{ icon }}" size="17" hint-size="17px,17px"></x-import><span style="flex:1">{{ typeLabel }}</span><x-import component-from-global-scope="Library.ChevronDownIcon" size="16" style="color:var(--muted-foreground)" hint-size="16px,16px"></x-import></span></label><div style="display:flex;gap:14px"><div style="width:96px;height:132px;flex-shrink:0;display:flex;align-items:flex-start;justify-content:center"><div style="position:relative;width:100%;height:100%"><dc-import name="Cover" kind="{{ kind }}" size="{{ 132 }}" style="width:96px;height:132px" hint-size="96px,132px"></dc-import><span style="position:absolute;right:4px;bottom:4px;width:32px;height:32px;border-radius:16px;background:var(--background);box-shadow:0 0 0 1px var(--border),0 2px 6px oklch(0 0 0 / 15%);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.ImagePlusIcon" size="16" hint-size="16px,16px"></x-import></span></div></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:12px"><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">Título<span style="height:44px;border-radius:10px;border:2px solid var(--ring);display:flex;align-items:center;padding:0 12px;font-size:15px;font-weight:400">{{ title }}</span></label><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">Año<span style="height:44px;border-radius:10px;border:1px solid var(--input);display:flex;align-items:center;padding:0 12px;font-size:15px;font-weight:400;font-variant-numeric:tabular-nums">{{ year }}</span></label></div></div><div style="display:flex;align-items:center;gap:10px;margin-top:4px"><span style="font-size:15px;font-weight:600">{{ ownHeading }}</span><span style="flex:1;height:1px;background:var(--border)"></span></div><sc-for list="{{ rows }}" as="r" hint-placeholder-count="3"><sc-if value="{{ r.isPeople }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500"><span>{{ r.label }}</span><div style="min-height:44px;box-sizing:border-box;border-radius:10px;border:1px solid var(--input);display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 8px"><sc-for list="{{ r.chips }}" as="ch" hint-placeholder-count="1"><span style="height:30px;display:flex;align-items:center;gap:4px;padding:0 4px 0 10px;border-radius:8px;background:var(--secondary);color:var(--secondary-foreground);font-size:14px;font-weight:400">{{ ch.name }}<span aria-label="Quitar" style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;color:var(--muted-foreground)"><x-import component-from-global-scope="Library.XIcon" size="14" hint-size="14px,14px"></x-import></span></span></sc-for><span style="flex:1;min-width:80px;padding-left:4px;font-size:15px;font-weight:400;color:var(--muted-foreground)">{{ r.more }}</span></div></div></sc-if><sc-if value="{{ r.isCells }}" hint-placeholder-val="{{ true }}"><div style="display:flex;gap:10px"><sc-for list="{{ r.cells }}" as="c" hint-placeholder-count="1"><sc-if value="{{ c.wide }}" hint-placeholder-val="{{ false }}"><label style="flex:2 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500"><span style="white-space:nowrap">{{ c.label }}</span><span style="height:44px;border-radius:10px;border:1px solid var(--input);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:15px;font-weight:400"><span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums">{{ c.value }}</span><sc-if value="{{ c.unit }}" hint-placeholder-val="{{ false }}"><span style="color:var(--muted-foreground);font-size:14px">{{ c.unit }}</span></sc-if><sc-if value="{{ c.scan }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Library.ScanBarcodeIcon" size="18" aria-label="Escanear" hint-size="18px,18px"></x-import></sc-if><sc-if value="{{ c.select }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Library.ChevronDownIcon" size="16" style="color:var(--muted-foreground)" hint-size="16px,16px"></x-import></sc-if></span><sc-if value="{{ c.hint }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-weight:400;color:var(--muted-foreground);margin-top:-2px">{{ c.hint }}</span></sc-if></label></sc-if><sc-if value="{{ c.narrow }}" hint-placeholder-val="{{ true }}"><label style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500"><span style="white-space:nowrap">{{ c.label }}</span><span style="height:44px;border-radius:10px;border:1px solid var(--input);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:15px;font-weight:400"><span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums">{{ c.value }}</span><sc-if value="{{ c.unit }}" hint-placeholder-val="{{ false }}"><span style="color:var(--muted-foreground);font-size:14px">{{ c.unit }}</span></sc-if><sc-if value="{{ c.scan }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Library.ScanBarcodeIcon" size="18" aria-label="Escanear" hint-size="18px,18px"></x-import></sc-if><sc-if value="{{ c.select }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Library.ChevronDownIcon" size="16" style="color:var(--muted-foreground)" hint-size="16px,16px"></x-import></sc-if></span><sc-if value="{{ c.hint }}" hint-placeholder-val="{{ false }}"><span style="font-size:12px;font-weight:400;color:var(--muted-foreground);margin-top:-2px">{{ c.hint }}</span></sc-if></label></sc-if></sc-for></div></sc-if></sc-for><sc-if value="{{ isOther }}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:10px;align-items:flex-start;padding:12px;border-radius:12px;background:var(--muted);font-size:13px;line-height:1.45;color:var(--muted-foreground);text-wrap:pretty"><x-import component-from-global-scope="Library.InfoIcon" size="16" style="flex-shrink:0;margin-top:1px" hint-size="16px,16px"></x-import><span>«Otro» no tiene datos propios. Lo que quieras apuntar (fabricante, referencia, estado…) va en las notas.</span></div></sc-if><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">Notas<span style="min-height:64px;box-sizing:border-box;border-radius:10px;border:1px solid var(--input);padding:10px 12px;font-size:15px;font-weight:400;color:var(--muted-foreground)">{{ notes }}</span></label><sc-if value="{{ isNew }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;border:1px solid var(--border)"><div style="width:40px;height:40px;border-radius:10px;background:var(--secondary);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.{{ copyIcon }}" size="19" hint-size="19px,19px"></x-import></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:500">Lo tengo · {{ copyFormat }}</span><span style="font-size:12.5px;color:var(--muted-foreground)">{{ copyWhere }}</span></div><span style="font-size:14px;font-weight:500;color:var(--primary)">Cambiar</span></div></sc-if></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;book&quot;,&quot;comic&quot;,&quot;game&quot;,&quot;film&quot;,&quot;series&quot;,&quot;videogame&quot;,&quot;music&quot;,&quot;other&quot;],&quot;default&quot;:&quot;book&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;new&quot;,&quot;edit&quot;],&quot;default&quot;:&quot;new&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const k = this.props.kind ?? 'book';
    const P = (label, chips, more) => ({ isPeople: true, isCells: false, label, chips: chips.map(name => ({ name })), more: more ?? 'Añadir…' });
    const C = (...cells) => ({ isPeople: false, isCells: true, cells: cells.map(c => { const o = { flex: 1, unit: '', scan: false, select: false, hint: '', ...c }; o.wide = o.flex >= 1.5; o.narrow = !o.wide; return o; }) });
    const ean = { label: 'Código de barras (EAN/UPC)', value: '', scan: true, hint: 'Opcional' };
    const D = {
      book: ['Libro', 'BookIcon', 'Dune', '1965', [P('Autoría', ['Frank Herbert']), C({ label: 'Editorial', value: 'Debolsillo', flex: 3 }, { label: 'Idioma', value: 'Español', select: true, flex: 2 }), C({ label: 'ISBN', value: '978-84-9759-682-4', scan: true, hint: 'Opcional. Los libros antiguos no lo tienen' })], 'BookIcon', 'Tapa blanda', 'Tuyo · Salón'],
      comic: ['Cómic', 'BookImageIcon', 'Watchmen', '1987', [P('Guion', ['Alan Moore']), P('Dibujo', ['Dave Gibbons']), C({ label: 'Editorial', value: 'ECC', flex: 3 }, { label: 'Número', value: '', flex: 1.3 }), C(ean)], 'BookImageIcon', 'Tapa dura', 'Tuyo · Estudio'],
      game: ['Juego de mesa', 'Dice5Icon', 'Carcassonne', '2000', [P('Diseño', ['Klaus-Jürgen Wrede']), C({ label: 'Editorial', value: 'Devir' }), C({ label: 'Jugadores', value: '2 – 5', flex: 1.2 }, { label: 'Duración', value: '35', unit: 'min', flex: 1.2 }, { label: 'Edad mín.', value: '7', unit: 'años', flex: 1.2 }), C(ean)], 'BoxIcon', 'Caja', 'Tuyo · Estudio'],
      film: ['Película', 'ClapperboardIcon', 'Blade Runner 2049', '2017', [P('Dirección', ['Denis Villeneuve']), C({ label: 'Duración', value: '164', unit: 'min', flex: 1 }, { label: ' ', value: '', flex: 1.4, empty: true }), C(ean)], 'DiscIcon', 'Blu-ray', 'Tuyo · Salón'],
      series: ['Serie', 'TvMinimalIcon', 'Twin Peaks', '1990', [C({ label: 'Temporadas', value: '3', flex: 1 }, { label: ' ', value: '', flex: 1.4 }), C(ean)], 'DiscIcon', 'DVD · temporadas 1–2', 'Tuyo · Salón'],
      videogame: ['Videojuego', 'Gamepad2Icon', 'Zelda: Tears of the Kingdom', '2023', [P('Estudio', ['Nintendo EPD']), C({ ...ean, hint: 'Opcional. La plataforma va en cada ejemplar' })], 'Gamepad2Icon', 'Switch · físico', 'De Hugo · Cuarto de Hugo'],
      music: ['Música', 'Disc3Icon', 'Abbey Road', '1969', [P('Artista', ['The Beatles']), C({ label: 'Sello', value: 'Apple Records' }), C(ean)], 'Disc3Icon', 'Vinilo', 'Tuyo · Salón'],
      other: ['Otro', 'ShapesIcon', 'Playmobil Barco pirata 5135', '2006', [C(ean)], 'ShapesIcon', 'Otro', 'Tuyo · Trastero']
    };
    const [typeLabel, icon, title, year, rows, copyIcon, copyFormat, copyWhere] = D[k] || D.other;
    rows.forEach(r => r.isCells && r.cells.forEach(c => { if (c.label === ' ') { c.value = ''; } }));
    const isNew = (this.props.mode ?? 'new') === 'new';
    return {
      kind: k, typeLabel, icon, title, year, rows: rows.map(r => r.isCells ? { ...r, cells: r.cells.filter(c => c.label !== ' ') } : r),
      heading: isNew ? 'Añadir a mano' : 'Editar', isNew, isOther: k === 'other',
      ownHeading: k === 'other' ? 'Datos propios' : 'Datos de ' + typeLabel.toLowerCase().replace('música', 'la música'),
      notes: k === 'other' ? 'Completo, con la caja original' : 'Opcional', copyIcon, copyFormat, copyWhere
    };
  }
}
</script>
</body>
</html>
