<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end;font-family:var(--font-sans);color:var(--foreground)"><div role="dialog" aria-label="¿Qué es?" style="background:var(--background);border-radius:28px 28px 0 0;padding:10px 16px 28px;display:flex;flex-direction:column;gap:14px"><span style="width:32px;height:4px;border-radius:2px;background:var(--muted-foreground);opacity:0.4;align-self:center"></span><div style="display:flex;flex-direction:column;gap:4px"><span style="font-size:18px;font-weight:600">¿Qué es?</span><span style="font-size:13.5px;line-height:1.45;color:var(--muted-foreground);text-wrap:pretty">{{ sub }}</span></div><div role="radiogroup" aria-label="Tipo" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px"><sc-for list="{{ types }}" as="t" hint-placeholder-count="8"><sc-if value="{{ t.on }}" hint-placeholder-val="{{ false }}"><div role="radio" aria-checked="true" style="height:76px;border-radius:12px;background:var(--accent);box-shadow:inset 0 0 0 2px var(--foreground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 4px;font-size:12.5px;font-weight:600;text-align:center;line-height:1.15"><x-import component-from-global-scope="Library.{{ t.icon }}" size="22" hint-size="22px,22px"></x-import>{{ t.label }}</div></sc-if><sc-if value="{{ t.off }}" hint-placeholder-val="{{ true }}"><div role="radio" aria-checked="false" style="height:76px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:0 4px;font-size:12.5px;font-weight:500;text-align:center;line-height:1.15"><x-import component-from-global-scope="Library.{{ t.icon }}" size="22" style="color:var(--muted-foreground)" hint-size="22px,22px"></x-import>{{ t.label }}</div></sc-if></sc-for></div><sc-if value="{{ edit }}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:8px;align-items:flex-start;font-size:12.5px;line-height:1.45;color:var(--muted-foreground);text-wrap:pretty"><x-import component-from-global-scope="Library.InfoIcon" size="15" style="flex-shrink:0;margin-top:1px" hint-size="15px,15px"></x-import><span>Título, año, portada, notas y ejemplares se conservan. Antes de cambiar te decimos qué datos propios se pierden.</span></div></sc-if></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;current&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;book&quot;,&quot;comic&quot;,&quot;game&quot;,&quot;film&quot;,&quot;series&quot;,&quot;videogame&quot;,&quot;music&quot;,&quot;other&quot;],&quot;default&quot;:&quot;book&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;new&quot;,&quot;edit&quot;],&quot;default&quot;:&quot;new&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const cur = this.props.current ?? 'book';
    const T = [['book', 'Libro', 'BookIcon'], ['comic', 'Cómic', 'BookImageIcon'], ['game', 'Juego de mesa', 'Dice5Icon'], ['film', 'Película', 'ClapperboardIcon'], ['series', 'Serie', 'TvMinimalIcon'], ['videogame', 'Videojuego', 'Gamepad2Icon'], ['music', 'Música', 'Disc3Icon'], ['other', 'Otro', 'ShapesIcon']];
    const edit = (this.props.mode ?? 'new') === 'edit';
    return { edit, sub: edit ? 'Cambia el tipo si lo apuntaste mal.' : 'Según el tipo te pediremos unos datos u otros. Si no encaja en ninguno, «Otro».', types: T.map(([k, label, icon]) => ({ label, icon, on: k === cur, off: k !== cur })) };
  }
}
</script>
</body>
</html>
