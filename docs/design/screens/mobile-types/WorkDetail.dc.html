<!DOCTYPE html>

<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><div style="height:100%;display:flex;flex-direction:column"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><header style="height:64px;display:flex;align-items:center;padding:0 4px;flex-shrink:0"><button aria-label="Atrás" style="width:48px;height:48px;border:0;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.ArrowLeftIcon" size="22" hint-size="22px,22px"></x-import></button><span style="flex:1"></span><button aria-label="Editar" style="width:48px;height:48px;border:0;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.PencilIcon" size="20" hint-size="20px,20px"></x-import></button><button aria-label="Más opciones" style="width:48px;height:48px;border:0;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.EllipsisVerticalIcon" size="20" hint-size="20px,20px"></x-import></button></header><div style="flex:1;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:18px"><div style="display:flex;gap:16px"><dc-import name="Cover" kind="{{ kind }}" size="{{ 150 }}" style="width:112px;height:150px;flex-shrink:0" hint-size="112px,150px"></dc-import><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:4px"><span style="font-size:23px;font-weight:600;letter-spacing:-0.02em;line-height:1.15;text-wrap:pretty">{{ title }}</span><sc-if value="{{ by }}" hint-placeholder-val="{{ true }}"><span style="font-size:15px">{{ by }}</span></sc-if><span style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted-foreground)"><x-import component-from-global-scope="Library.{{ icon }}" size="14" hint-size="14px,14px"></x-import>{{ meta }}</span><sc-if value="{{ hasFacts }}" hint-placeholder-val="{{ false }}"><div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px"><sc-for list="{{ facts }}" as="f" hint-placeholder-count="2"><span style="height:28px;display:flex;align-items:center;gap:5px;padding:0 9px;border-radius:8px;background:var(--muted);font-size:13px;font-weight:500"><x-import component-from-global-scope="Library.{{ f.icon }}" size="14" style="color:var(--muted-foreground)" hint-size="14px,14px"></x-import>{{ f.text }}</span></sc-for></div></sc-if><div style="display:flex;margin-top:4px"><span style="display:flex;align-items:center;gap:4px;padding:3px 8px;border-radius:6px;background:var(--success-soft);color:var(--success);font-size:12px;font-weight:500"><x-import component-from-global-scope="Library.CheckIcon" size="13" stroke-width="2.5" hint-size="13px,13px"></x-import>Lo tengo · {{ nCopies }}</span></div></div></div><section aria-label="Lo mío" style="display:flex;flex-direction:column;gap:8px"><div style="display:flex;align-items:center;gap:8px;min-height:28px"><span style="font-size:15px;font-weight:600">Lo mío</span><span style="flex:1"></span><button aria-label="Cambiar la fecha" style="height:32px;display:flex;align-items:center;gap:6px;padding:0 10px;border-radius:8px;border:0;background:var(--muted);color:var(--foreground);font:500 13px var(--font-sans)"><x-import component-from-global-scope="Library.CalendarIcon" size="14" hint-size="14px,14px"></x-import>Desde el 20 sep</button></div><div role="radiogroup" aria-label="Mi estado" style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px;padding:3px;border-radius:13px;background:var(--muted)"><sc-for list="{{ states }}" as="s" hint-placeholder-count="4"><sc-if value="{{ s.on }}" hint-placeholder-val="{{ false }}"><button role="radio" aria-checked="true" style="height:44px;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 2px;border-radius:10px;border:0;background:var(--background);box-shadow:0 1px 2px oklch(0 0 0 / 14%),0 0 0 1px var(--border);color:var(--foreground);font:600 12.5px var(--font-sans)"><x-import component-from-global-scope="Library.CircleDotIcon" size="15" hint-size="15px,15px"></x-import>{{ s.label }}</button></sc-if><sc-if value="{{ s.off }}" hint-placeholder-val="{{ true }}"><button role="radio" aria-checked="false" style="height:44px;min-width:0;display:flex;align-items:center;justify-content:center;padding:0 2px;border-radius:10px;border:0;background:transparent;color:var(--muted-foreground);font:500 12.5px var(--font-sans);white-space:nowrap">{{ s.label }}</button></sc-if></sc-for></div></section><section aria-label="Datos" style="display:flex;flex-direction:column"><span style="font-size:15px;font-weight:600;padding-bottom:4px">Datos</span><sc-for list="{{ data }}" as="d" hint-placeholder-count="3"><div style="display:flex;gap:12px;align-items:baseline;min-height:36px;padding:8px 0;box-sizing:border-box;border-bottom:1px solid var(--border);font-size:14px"><span style="width:104px;flex-shrink:0;color:var(--muted-foreground)">{{ d.k }}</span><span style="flex:1;min-width:0;text-wrap:pretty">{{ d.v }}</span></div></sc-for></section><section aria-label="Ejemplares" style="display:flex;flex-direction:column"><span style="font-size:15px;font-weight:600">Ejemplares</span><sc-for list="{{ copies }}" as="c" hint-placeholder-count="2"><div style="display:flex;align-items:center;gap:14px;min-height:60px"><div style="width:40px;height:40px;border-radius:10px;background:var(--secondary);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.{{ c.icon }}" size="19" hint-size="19px,19px"></x-import></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:500">{{ c.what }}</span><span style="font-size:13px;color:var(--muted-foreground)">{{ c.where }}</span></div><x-import component-from-global-scope="Library.EllipsisVerticalIcon" size="18" style="color:var(--muted-foreground)" hint-size="18px,18px"></x-import></div></sc-for><button style="height:48px;border-radius:12px;border:1px dashed var(--border);background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center;gap:8px;font:500 14px var(--font-sans);margin-top:4px"><x-import component-from-global-scope="Library.PlusIcon" size="18" hint-size="18px,18px"></x-import>Añadir ejemplar</button></section></div></div></div>
</x-dc>

    const D = {

      comic: ['Watchmen', 'Alan Moore, Dave Gibbons', 'BookImageIcon', 'Cómic · 1987', [], [['Guion', 'Alan Moore'], ['Dibujo', 'Dave Gibbons'], ['Editorial', 'ECC'], ['Código', '9788417243482']], [['BookImageIcon', 'Tapa dura', 'Tuyo · Estudio'], ['TabletIcon', 'Digital', 'Tuyo · ComiXology']]],

</script>
