<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><header style="height:64px;flex-shrink:0;display:flex;align-items:center;padding:0 4px"><button aria-label="Cerrar" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.XIcon" size="22" hint-size="22px,22px"></x-import></button><h1 style="margin:0;flex:1;font-size:20px;font-weight:600">Editar</h1><span style="padding:0 16px;font-size:15px;font-weight:600;color:var(--primary)">Guardar</span></header><div style="flex:1;min-height:0;overflow:hidden;padding:0 16px;display:flex;flex-direction:column;gap:18px"><span style="font-size:13px;color:var(--muted-foreground)">… Dune: Imperium – Ascenso de Ix · datos de juego de mesa …</span><h2 style="margin:0;font-size:16px;font-weight:600">Clasificación</h2><div style="display:flex;flex-direction:column;gap:6px"><label style="font-size:13.5px;font-weight:500">Géneros</label><div style="min-height:52px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;border:1px solid var(--input)"><sc-for list="{{ chosen }}" as="g" hint-placeholder-count="2"><span style="height:32px;padding:0 12px;border-radius:999px;background:var(--secondary);display:flex;align-items:center;font-size:14px;font-weight:500">{{ g.l }}</span></sc-for></div></div><div style="display:flex;flex-direction:column;gap:6px;position:relative"><label style="font-size:13.5px;font-weight:500">Etiquetas</label><sc-if value="{{ _c_tBd }}" hint-placeholder-val="{{ false }}"><div style="min-height:52px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;border:1px solid var(--ring)"><span style="height:32px;padding:0 12px;border-radius:999px;border:1px dashed var(--border);display:flex;align-items:center;font-size:14px">para jugar en pareja</span><span style="font-size:16px">{{ tq }}</span></div></sc-if><sc-if value="{{ _nc_tBd }}" hint-placeholder-val="{{ true }}"><div style="min-height:52px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:6px 10px;border-radius:10px;border:1px solid var(--input)"><span style="height:32px;padding:0 12px;border-radius:999px;border:1px dashed var(--border);display:flex;align-items:center;font-size:14px">para jugar en pareja</span><span style="font-size:16px">{{ tq }}</span></div></sc-if><sc-if value="{{ tOpen }}" hint-placeholder-val="{{ false }}"><div role="listbox" style="border:1px solid var(--border);border-radius:12px;background:var(--popover);box-shadow:0 12px 32px -12px oklch(0 0 0 / 35%);padding:4px"><sc-for list="{{ tagOpts }}" as="t" hint-placeholder-count="3"><div role="option" style="height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:8px;font-size:15px"><x-import component-from-global-scope="Library.{{ t.icon }}" size="16" hint-size="16px,16px"></x-import><span style="flex:1">{{ t.l }}</span><span style="font-size:13px;color:var(--muted-foreground)">{{ t.n }}</span></div></sc-for></div></sc-if></div><div style="display:flex;flex-direction:column;gap:6px"><label style="font-size:13.5px;font-weight:500">Necesita</label><div style="height:48px;display:flex;align-items:center;gap:10px;padding:0 12px;border-radius:10px;border:1px solid var(--input);font-size:15px"><x-import component-from-global-scope="Library.LinkIcon" size="16" hint-size="16px,16px"></x-import><span style="flex:1">Dune: Imperium</span><span style="font-size:13px;color:var(--warning)">me falta</span></div></div></div><sc-if value="{{ gOpen }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:oklch(0 0 0 / 45%);display:flex;flex-direction:column;justify-content:flex-end"><div role="dialog" aria-label="Géneros" style="border-radius:24px 24px 0 0;background:var(--background);padding:8px 16px 30px;display:flex;flex-direction:column;gap:4px"><span style="align-self:center;width:32px;height:4px;border-radius:2px;background:var(--border);margin-bottom:8px"></span><div style="display:flex;align-items:baseline;padding:0 4px 6px"><h2 style="margin:0;flex:1;font-size:18px;font-weight:600">Géneros</h2><span style="font-size:13px;color:var(--muted-foreground)">Juegos de mesa · elige varios</span></div><sc-for list="{{ all }}" as="g" hint-placeholder-count="10"><div role="option" aria-selected="{{ g.on }}" style="height:46px;display:flex;align-items:center;gap:14px;padding:0 6px;font-size:15.5px"><sc-if value="{{ g._c_bd }}" hint-placeholder-val="{{ false }}"><span style="width:20px;height:20px;border-radius:5px;border:1.5px solid var(--primary);background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.CheckIcon" size="14" hint-size="14px,14px"></x-import></span></sc-if><sc-if value="{{ g._nc_bd }}" hint-placeholder-val="{{ true }}"><span style="width:20px;height:20px;border-radius:5px;border:1.5px solid var(--input);background:transparent;color:var(--primary-foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.CheckIcon" size="14" hint-size="14px,14px"></x-import></span></sc-if>{{ g.l }}</div></sc-for></div></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;open&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;genres&quot;,&quot;tags&quot;,&quot;none&quot;],&quot;default&quot;:&quot;genres&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  _rv() {
    const o = this.props.open ?? 'genres';
    const G = ['Estrategia', 'Familiar', 'Party', 'Cooperativo', 'Abstracto', 'Cartas', 'Colocación de losetas', 'Colocación de trabajadores', 'Construcción de mazos', 'Deducción', 'Wargame', 'Otros'];
    const on = ['Estrategia', 'Colocación de trabajadores', 'Construcción de mazos'];
    const tOpen = o === 'tags';
    return { theme: this.props.theme ?? 'light', gOpen: o === 'genres', tOpen, tBd: tOpen ? 'var(--ring)' : 'var(--input)', tq: tOpen ? 'reg' : '', chosen: on.map(l => ({ l })), all: G.map(l => { const s = on.includes(l); return { l, on: String(s), bd: s ? 'var(--primary)' : 'var(--input)', bg: s ? 'var(--primary)' : 'transparent' }; }), tagOpts: [['TagIcon', 'regalo de Laura', '4'], ['TagIcon', 'regalos pendientes', '2'], ['PlusIcon', 'Crear «reg»', '']].map(([icon, l, n]) => ({ icon, l, n })) };
  }
  renderVals() {
    const o = this._rv();
    for (const [lk, k, a] of [[null,"tBd","var(--ring)"],["all","bd","var(--primary)"]]) {
      if (!lk) { o['_c_' + k] = o[k] === a; o['_nc_' + k] = !o['_c_' + k]; continue; }
      (o[lk] || []).forEach(it => { it['_c_' + k] = it[k] === a; it['_nc_' + k] = !it['_c_' + k]; });
    }
    return o;
  }
}
</script>
</body>
</html>
