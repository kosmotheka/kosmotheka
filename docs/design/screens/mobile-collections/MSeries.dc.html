<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><header style="height:64px;flex-shrink:0;display:flex;align-items:center;padding:0 4px"><button aria-label="Atrás" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.{{ backIcon }}" size="22" hint-size="22px,22px"></x-import></button><h1 style="margin:0;flex:1;font-size:20px;font-weight:600">{{ name }}</h1><sc-if value="{{ reorder }}" hint-placeholder-val="{{ false }}"><span style="padding:0 16px;font-size:15px;font-weight:600;color:var(--primary)">Hecho</span></sc-if><sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}"><button aria-label="Más opciones: renombrar, reordenar" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.EllipsisVerticalIcon" size="22" hint-size="22px,22px"></x-import></button></sc-if></header><p style="margin:0;padding:0 16px 10px;font-size:14px;color:var(--muted-foreground);text-wrap:pretty">{{ sub }}</p><div style="flex:1;min-height:0;overflow:hidden;padding:0 12px;display:flex;flex-direction:column;gap:6px"><sc-for list="{{ items }}" as="i" hint-placeholder-count="6"><sc-if value="{{ i._c_line }}" hint-placeholder-val="{{ false }}"><div style="min-height:72px;display:flex;align-items:center;gap:12px;padding:6px 12px;border-radius:12px;border:1px solid var(--border);background:var(--background)"><sc-if value="{{ i.drag }}" hint-placeholder-val="{{ false }}"><span style="color:var(--muted-foreground);display:flex"><x-import component-from-global-scope="Library.GripVerticalIcon" size="18" hint-size="18px,18px"></x-import></span></sc-if><sc-if value="{{ i.ord }}" hint-placeholder-val="{{ true }}"><span style="width:28px;font:600 16px var(--font-mono);text-align:center">{{ i.n }}</span><dc-import name="Cover" kind="book" size="{{ 56 }}" style="width:38px;height:56px;flex-shrink:0" hint-size="38px,56px"></dc-import></sc-if><sc-if value="{{ i.game }}" hint-placeholder-val="{{ false }}"><dc-import name="Cover" kind="game" size="{{ 56 }}" style="width:56px;height:56px;flex-shrink:0" hint-size="56px,56px"></dc-import></sc-if><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">{{ i.title }}</span><sc-if value="{{ i._c_stTone }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;color:var(--wish)">{{ i.meta }}</span></sc-if><sc-if value="{{ i._nc_stTone }}" hint-placeholder-val="{{ true }}"><span style="font-size:13px;color:var(--muted-foreground)">{{ i.meta }}</span></sc-if></div><sc-if value="{{ i.act }}" hint-placeholder-val="{{ false }}"><span style="font-size:14px;font-weight:600;color:var(--primary)">{{ i.actL }}</span></sc-if></div></sc-if><sc-if value="{{ i._nc_line }}" hint-placeholder-val="{{ true }}"><div style="min-height:72px;display:flex;align-items:center;gap:12px;padding:6px 12px;border-radius:12px;border:1px dashed color-mix(in oklch,var(--foreground) 30%,transparent);background:var(--muted)"><sc-if value="{{ i.drag }}" hint-placeholder-val="{{ false }}"><span style="color:var(--muted-foreground);display:flex"><x-import component-from-global-scope="Library.GripVerticalIcon" size="18" hint-size="18px,18px"></x-import></span></sc-if><sc-if value="{{ i.ord }}" hint-placeholder-val="{{ true }}"><span style="width:28px;font:600 16px var(--font-mono);text-align:center">{{ i.n }}</span><dc-import name="Cover" kind="book" size="{{ 56 }}" style="width:38px;height:56px;flex-shrink:0" hint-size="38px,56px"></dc-import></sc-if><sc-if value="{{ i.game }}" hint-placeholder-val="{{ false }}"><dc-import name="Cover" kind="game" size="{{ 56 }}" style="width:56px;height:56px;flex-shrink:0" hint-size="56px,56px"></dc-import></sc-if><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">{{ i.title }}</span><sc-if value="{{ i._c_stTone }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;color:var(--wish)">{{ i.meta }}</span></sc-if><sc-if value="{{ i._nc_stTone }}" hint-placeholder-val="{{ true }}"><span style="font-size:13px;color:var(--muted-foreground)">{{ i.meta }}</span></sc-if></div><sc-if value="{{ i.act }}" hint-placeholder-val="{{ false }}"><span style="font-size:14px;font-weight:600;color:var(--primary)">{{ i.actL }}</span></sc-if></div></sc-if></sc-for></div><sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;right:16px;bottom:30px;height:56px;padding:0 20px;border-radius:16px;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;box-shadow:0 6px 16px -4px oklch(0 0 0 / 30%)"><x-import component-from-global-scope="Library.PlusIcon" size="20" hint-size="20px,20px"></x-import>Añadir obra</div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ordered&quot;,&quot;reorder&quot;,&quot;unordered&quot;],&quot;default&quot;:&quot;ordered&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  _rv() {
    const mode = this.props.mode ?? 'ordered'; const reorder = mode === 'reorder'; const un = mode === 'unordered';
    const O = [['1', 'Dune', 'Lo tengo · 2 ejemplares', 'own'], ['2', 'El mesías de Dune', 'Lo tengo', 'own'], ['3', 'Hijos de Dune', 'Me falta', 'miss'], ['4', 'Dune: El emperador-dios', 'Me falta · lo desea Hugo', 'miss'], ['5', 'Sin apuntar', 'Hueco', 'empty'], ['6', 'Casa Capitular: Dune', 'Lo tengo', 'own']];
    const U = [['', 'Catán', 'Lo tengo', 'own'], ['', 'Catán: Navegantes', 'Me falta · lo deseas tú y Laura', 'miss'], ['', 'Catán: Ciudades y caballeros', 'Lo tengo · necesita Catán', 'own'], ['', 'Catán Junior', 'Lo tengo', 'own'], ['', 'Catán: El duelo', 'Me falta', 'miss']];
    const items = (un ? U : O).map(([n, title, meta, st]) => { const own = st === 'own'; return { n, title, meta, ord: !un, game: un, drag: reorder, line: own ? 'solid' : 'dashed', bd: own ? 'var(--border)' : 'color-mix(in oklch,var(--foreground) 30%,transparent)', bg: own ? 'var(--background)' : 'var(--muted)', stTone: st === 'miss' && /desea/.test(meta) ? 'var(--wish)' : 'var(--muted-foreground)', act: !own && !reorder, actL: st === 'empty' ? 'Apuntar' : 'Lo tengo' }; });
    return { theme: this.props.theme ?? 'light', reorder, idle: !reorder, backIcon: reorder ? 'XIcon' : 'ArrowLeftIcon', name: reorder ? 'Reordenar Dune' : un ? 'Catán' : 'Dune', sub: reorder ? 'Arrastra por el asa o toca el número para cambiarlo.' : un ? 'Línea sin orden · tienes 3 de 5' : 'Saga con orden · tienes 3 de 6', items };
  }
  renderVals() {
    const o = this._rv();
    for (const [lk, k, a] of [["items","line","solid"],["items","stTone","var(--wish)"]]) {
      if (!lk) { o['_c_' + k] = o[k] === a; o['_nc_' + k] = !o['_c_' + k]; continue; }
      (o[lk] || []).forEach(it => { it['_c_' + k] = it[k] === a; it['_nc_' + k] = !it['_c_' + k]; });
    }
    return o;
  }
}
</script>
</body>
</html>
