<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><header style="height:64px;flex-shrink:0;display:flex;align-items:center;padding:0 4px"><button aria-label="Atrás" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.ArrowLeftIcon" size="22" hint-size="22px,22px"></x-import></button><h1 style="margin:0;font-size:20px;font-weight:600">Etiquetas</h1></header><p style="margin:0;padding:0 16px 8px;font-size:14px;color:var(--muted-foreground);text-wrap:pretty">De la biblioteca Familia. Se crean al escribirlas en una obra.</p><div style="display:flex;flex-direction:column"><sc-for list="{{ tags }}" as="t" hint-placeholder-count="7"><div style="min-height:56px;display:flex;align-items:center;gap:14px;padding:0 16px;border-bottom:1px solid var(--border)"><x-import component-from-global-scope="Library.TagIcon" size="18" hint-size="18px,18px"></x-import><span style="flex:1;font-size:16px">{{ t.l }}</span><span style="font-size:13.5px;color:var(--muted-foreground)">{{ t.n }}</span><x-import component-from-global-scope="Library.EllipsisVerticalIcon" size="18" hint-size="18px,18px"></x-import></div></sc-for></div><sc-if value="{{ sheet }}" hint-placeholder-val="{{ false }}"><div style="position:absolute;inset:0;background:oklch(0 0 0 / 45%);display:flex;flex-direction:column;justify-content:flex-end"><div role="dialog" aria-label="Etiqueta para viajes" style="border-radius:24px 24px 0 0;background:var(--background);padding:8px 16px 30px;display:flex;flex-direction:column;gap:12px"><span style="align-self:center;width:32px;height:4px;border-radius:2px;background:var(--border)"></span><h2 style="margin:0;font-size:18px;font-weight:600">para viajes</h2><div style="height:52px;display:flex;align-items:center;padding:0 14px;border-radius:10px;border:1px solid var(--ring);font-size:16px">para viajes</div><span style="font-size:13.5px;color:var(--muted-foreground)">Cámbiale el nombre y guarda. En 6 obras.</span><div style="display:flex;gap:8px"><button style="flex:1;height:48px;border-radius:24px;border:1px solid var(--border);background:var(--background);color:var(--destructive);font:600 15px var(--font-sans)">Borrar</button><button style="flex:1;height:48px;border-radius:24px;border:0;background:var(--primary);color:var(--primary-foreground);font:600 15px var(--font-sans)">Guardar</button></div></div></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;sheet&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const T = [['clásicos', 31], ['para Hugo', 14], ['para jugar en pareja', 9], ['para viajes', 6], ['regalo de Laura', 4], ['regalos', 3], ['firmados', 2]];
    return { theme: this.props.theme ?? 'light', sheet: !!this.props.sheet, tags: T.map(([l, n]) => ({ l, n: n + ' obras' })) };
  }
}
</script>
</body>
</html>
