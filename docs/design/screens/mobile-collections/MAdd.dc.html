<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;display:flex;flex-direction:column;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><header style="height:64px;flex-shrink:0;display:flex;align-items:center;gap:4px;padding:0 4px"><button aria-label="Cerrar" style="width:48px;height:48px;border:0;border-radius:24px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.XIcon" size="22" hint-size="22px,22px"></x-import></button><h1 style="margin:0;font-size:20px;font-weight:600">Añadir</h1></header><div style="padding:0 16px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;gap:8px"><div role="search" style="flex:1;height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;border-radius:26px;background:var(--muted);font-size:16px"><x-import component-from-global-scope="Library.{{ qIcon }}" size="18" hint-size="18px,18px"></x-import><span style="flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ query }}</span></div><button aria-label="Escanear" style="width:52px;height:52px;border-radius:26px;border:0;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.ScanBarcodeIcon" size="22" hint-size="22px,22px"></x-import></button></div><div style="display:flex;gap:6px;overflow:hidden;mask-image:linear-gradient(90deg,#000 85%,transparent)"><sc-for list="{{ types }}" as="t" hint-placeholder-count="5"><sc-if value="{{ t._c_bd }}" hint-placeholder-val="{{ false }}"><span style="height:36px;padding:0 12px;border-radius:8px;display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:14px;font-weight:500;border:1px solid var(--primary);background:var(--primary);color:var(--primary-foreground)">{{ t.label }}</span></sc-if><sc-if value="{{ t._nc_bd }}" hint-placeholder-val="{{ true }}"><span style="height:36px;padding:0 12px;border-radius:8px;display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:14px;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--foreground)">{{ t.label }}</span></sc-if></sc-for></div><sc-if value="{{ limited }}" hint-placeholder-val="{{ false }}"><div style="display:flex;gap:8px;font-size:13.5px;line-height:1.4;color:var(--muted-foreground)"><x-import component-from-global-scope="Library.InfoIcon" size="16" hint-size="16px,16px"></x-import><span style="flex:1;text-wrap:pretty">Sin nube ni clave, las películas solo se buscan en Wikidata. <a style="color:var(--primary);text-decoration:none;font-weight:500">Cómo buscar mejor</a></span></div></sc-if></div><div style="flex:1;min-height:0;overflow:hidden;padding:12px 8px 0;display:flex;flex-direction:column"><sc-if value="{{ ask }}" hint-placeholder-val="{{ false }}"><div style="padding:8px;display:flex;flex-direction:column;gap:12px"><div style="display:flex;flex-direction:column;gap:4px"><h2 style="margin:0;font-size:18px;font-weight:600">¿Qué es?</h2><p style="margin:0;font-size:14px;color:var(--muted-foreground);text-wrap:pretty">Este código no dice de qué tipo es. Elige uno y lo buscamos ahí.</p></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><sc-for list="{{ tiles }}" as="t" hint-placeholder-count="8"><div style="height:64px;border-radius:12px;border:1px solid var(--border);display:flex;align-items:center;gap:10px;padding:0 14px;font-size:15px;font-weight:500"><x-import component-from-global-scope="Library.{{ t.icon }}" size="20" hint-size="20px,20px"></x-import>{{ t.label }}</div></sc-for></div></div></sc-if><sc-for list="{{ results }}" as="r" hint-placeholder-count="4"><div style="display:flex;align-items:center;gap:14px;padding:10px 8px;border-radius:12px"><dc-import name="Cover" kind="{{ r.kind }}" size="{{ 64 }}" style="width:44px;height:64px;flex-shrink:0" hint-size="44px,64px"></dc-import><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:16px;font-weight:600">{{ r.title }}</span><span style="font-size:13.5px;color:var(--muted-foreground)">{{ r.meta }}</span><span style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted-foreground)"><x-import component-from-global-scope="Library.GlobeIcon" size="12" hint-size="12px,12px"></x-import>{{ r.src }}</span><sc-if value="{{ r.dup }}" hint-placeholder-val="{{ false }}"><span style="font-size:13px;font-weight:500;color:var(--primary)">Ya está en Familia · añadir ejemplar</span></sc-if></div></div></sc-for></div><div style="flex-shrink:0;padding:12px 16px 30px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:6px"><button style="height:48px;border-radius:24px;border:1px solid var(--border);background:var(--background);color:var(--foreground);display:flex;align-items:center;justify-content:center;gap:8px;font:600 15px var(--font-sans)"><x-import component-from-global-scope="Library.PencilLineIcon" size="18" hint-size="18px,18px"></x-import>Añadir a mano</button></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;results&quot;,&quot;limited&quot;,&quot;isbn&quot;,&quot;ask&quot;],&quot;default&quot;:&quot;results&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  _rv() {
    const st = this.props.state ?? 'results';
    const T = [['book', 'Libro', 'BookIcon'], ['comic', 'Cómic', 'BookImageIcon'], ['game', 'Juego de mesa', 'Dice5Icon'], ['film', 'Película', 'ClapperboardIcon'], ['series', 'Serie', 'TvMinimalIcon'], ['videogame', 'Videojuego', 'Gamepad2Icon'], ['music', 'Música', 'Disc3Icon'], ['other', 'Otro', 'ShapesIcon']];
    const sel = st === 'limited' ? 'film' : st === 'ask' ? '' : 'book';
    const order = sel === 'film' ? [3, 0, 1, 2, 4] : [0, 1, 2, 3, 4];
    const types = order.map(i => T[i]).map(([k, label]) => { const on = k === sel; return { label, bd: on ? 'var(--primary)' : 'var(--border)', bg: on ? 'var(--primary)' : 'transparent', fg: on ? 'var(--primary-foreground)' : 'var(--foreground)' }; });
    const R = { results: [['book', 'Dune', 'Frank Herbert · 1965 · Debolsillo', 'Open Library', true], ['book', 'Dune', 'Frank Herbert · 2021 · Nova', 'Google Books'], ['book', 'El mesías de Dune', 'Frank Herbert · 1969', 'Inventaire'], ['book', 'Dune: la casa Atreides', 'Brian Herbert · 1999', 'Wikidata']], limited: [['film', 'Dune', 'Denis Villeneuve · 2021', 'Wikidata'], ['film', 'Dune', 'David Lynch · 1984', 'Wikidata']], isbn: [['book', 'Dune', 'Frank Herbert · 2021 · Nova', 'Google Books']], ask: [] }[st] || [];
    const Q = { results: ['SearchIcon', 'dune'], limited: ['SearchIcon', 'dune'], isbn: ['ScanBarcodeIcon', 'ISBN 978-84-18037-12-3'], ask: ['ScanBarcodeIcon', '8436564810015'] }[st];
    return { theme: this.props.theme ?? 'light', types, qIcon: Q[0], query: Q[1], limited: st === 'limited', ask: st === 'ask', tiles: T.map(([, label, icon]) => ({ label, icon })), results: R.map(([kind, title, meta, src, dup]) => ({ kind, title, meta, src, dup: !!dup })) };
  }
  renderVals() {
    const o = this._rv();
    for (const [lk, k, a] of [["types","bd","var(--primary)"]]) {
      if (!lk) { o['_c_' + k] = o[k] === a; o['_nc_' + k] = !o['_c_' + k]; continue; }
      (o[lk] || []).forEach(it => { it['_c_' + k] = it[k] === a; it['_nc_' + k] = !it['_c_' + k]; });
    }
    return o;
  }
}
</script>
</body>
</html>
