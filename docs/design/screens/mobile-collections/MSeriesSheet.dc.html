<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;position:relative;overflow:hidden;font-family:var(--font-sans);color:var(--foreground)"><dc-import name="MWork" theme="{{ theme }}" variant="missing" hint-size="100%,100%"></dc-import><div style="position:absolute;inset:0;background:oklch(0 0 0 / 45%);display:flex;flex-direction:column;justify-content:flex-end"><div role="dialog" aria-label="Añadir a una serie" style="border-radius:24px 24px 0 0;background:var(--background);padding:8px 16px 30px;display:flex;flex-direction:column;gap:14px"><span style="align-self:center;width:32px;height:4px;border-radius:2px;background:var(--border)"></span><div style="display:flex;flex-direction:column;gap:2px"><h2 style="margin:0;font-size:18px;font-weight:600">Añadir a una serie</h2><span style="font-size:14px;color:var(--muted-foreground)">Dune: El emperador-dios</span></div><div style="height:52px;display:flex;align-items:center;padding:0 14px;border-radius:10px;border:1px solid var(--ring);font-size:16px">{{ q }}</div><div role="listbox" style="display:flex;flex-direction:column"><sc-for list="{{ opts }}" as="o" hint-placeholder-count="3"><div role="option" style="min-height:52px;display:flex;align-items:center;gap:12px;padding:0 6px;border-bottom:1px solid var(--border);font-size:15.5px"><x-import component-from-global-scope="Library.{{ o.icon }}" size="18" hint-size="18px,18px"></x-import><span style="flex:1">{{ o.label }}</span><span style="font-size:13px;color:var(--muted-foreground)">{{ o.meta }}</span></div></sc-for></div><sc-if value="{{ picked }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:12px"><label style="font-size:14px;font-weight:500">Número</label><div style="width:80px;height:48px;display:flex;align-items:center;justify-content:center;border-radius:10px;border:1px solid var(--input);font:600 16px var(--font-mono)">4</div><span style="flex:1;font-size:13px;color:var(--muted-foreground);text-wrap:pretty">Después de «Hijos de Dune» (3)</span></div></sc-if><sc-if value="{{ newOne }}" hint-placeholder-val="{{ false }}"><div role="radiogroup" aria-label="Tipo de serie" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><div role="radio" aria-checked="true" style="padding:12px;border-radius:12px;border:1.5px solid var(--primary);display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">Con orden</span><span style="font-size:13px;color:var(--muted-foreground)">Una saga: 1, 2, 3…</span></div><div role="radio" aria-checked="false" style="padding:12px;border-radius:12px;border:1px solid var(--border);display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:600">Sin orden</span><span style="font-size:13px;color:var(--muted-foreground)">Una línea, como Catán</span></div></div></sc-if><button style="height:48px;border-radius:24px;border:0;background:var(--primary);color:var(--primary-foreground);font:600 15px var(--font-sans)">{{ ok }}</button></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;state&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;pick&quot;,&quot;new&quot;],&quot;default&quot;:&quot;pick&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const nw = (this.props.state ?? 'pick') === 'new';
    const opts = nw ? [['PlusIcon', 'Crear «Herbert, relatos»', ''], ['ListOrderedIcon', 'Dune', '6 obras']] : [['ListOrderedIcon', 'Dune', 'con orden · 6'], ['ListOrderedIcon', 'Dune (todo)', 'con orden · 14'], ['LayersIcon', 'Dune: Imperium', 'sin orden · 3']];
    return { theme: this.props.theme ?? 'light', q: nw ? 'Herbert, relatos' : 'Dune', newOne: nw, picked: !nw, ok: nw ? 'Crear y añadir' : 'Añadir a Dune', opts: opts.map(([icon, label, meta]) => ({ icon, label, meta })) };
  }
}
</script>
</body>
</html>
