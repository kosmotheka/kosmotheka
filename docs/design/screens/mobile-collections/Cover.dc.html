<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%;container-type:size;display:flex;align-items:center;justify-content:center"><sc-if value="{{ tall }}" hint-placeholder-val="{{ true }}"><div role="img" aria-label="{{ label }}" style="width:min(100cqw,calc(100cqh * 2 / 3));aspect-ratio:2/3;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--muted-foreground);background:repeating-linear-gradient(135deg,var(--muted) 0 6px,color-mix(in oklch,var(--muted),var(--foreground) 6%) 6px 12px);box-shadow:inset 0 0 0 1px var(--border)"><x-import component-from-global-scope="Library.{{ icon }}" size="{{ iconSize }}" stroke-width="1.5" hint-size="18px,18px"></x-import></div></sc-if><sc-if value="{{ square }}" hint-placeholder-val="{{ false }}"><div role="img" aria-label="{{ label }}" style="width:min(100cqw,100cqh);aspect-ratio:1/1;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--muted-foreground);background:repeating-linear-gradient(135deg,var(--muted) 0 6px,color-mix(in oklch,var(--muted),var(--foreground) 6%) 6px 12px);box-shadow:inset 0 0 0 1px var(--border)"><x-import component-from-global-scope="Library.{{ icon }}" size="{{ iconSize }}" stroke-width="1.5" hint-size="18px,18px"></x-import></div></sc-if><sc-if value="{{ dvd }}" hint-placeholder-val="{{ false }}"><div role="img" aria-label="{{ label }}" style="width:min(100cqw,calc(100cqh * 5 / 7));aspect-ratio:5/7;border-radius:5px;display:flex;overflow:hidden;color:var(--muted-foreground);background:repeating-linear-gradient(135deg,var(--muted) 0 6px,color-mix(in oklch,var(--muted),var(--foreground) 6%) 6px 12px);box-shadow:inset 0 0 0 1px var(--border)"><span style="width:9%;flex-shrink:0;background:color-mix(in oklch,var(--muted),var(--foreground) 14%);box-shadow:inset -1px 0 0 var(--border)"></span><span style="flex:1;display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.{{ icon }}" size="{{ iconSize }}" stroke-width="1.5" hint-size="18px,18px"></x-import></span></div></sc-if><sc-if value="{{ vg }}" hint-placeholder-val="{{ false }}"><div role="img" aria-label="{{ label }}" style="width:min(100cqw,calc(100cqh * 3 / 4));aspect-ratio:3/4;border-radius:5px;display:flex;flex-direction:column;overflow:hidden;color:var(--muted-foreground);background:repeating-linear-gradient(135deg,var(--muted) 0 6px,color-mix(in oklch,var(--muted),var(--foreground) 6%) 6px 12px);box-shadow:inset 0 0 0 1px var(--border)"><span style="height:12%;flex-shrink:0;background:color-mix(in oklch,var(--muted),var(--foreground) 14%);box-shadow:inset 0 -1px 0 var(--border)"></span><span style="flex:1;display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.{{ icon }}" size="{{ iconSize }}" stroke-width="1.5" hint-size="18px,18px"></x-import></span></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:120,&quot;height&quot;:160},&quot;kind&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;book&quot;,&quot;comic&quot;,&quot;game&quot;,&quot;film&quot;,&quot;series&quot;,&quot;videogame&quot;,&quot;music&quot;,&quot;other&quot;],&quot;default&quot;:&quot;book&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;size&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:64,&quot;tsType&quot;:&quot;number&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const shapes = { book: ['tall', 'BookIcon', 'Libro'], comic: ['tall', 'BookImageIcon', 'Cómic'], game: ['square', 'Dice5Icon', 'Juego de mesa'], film: ['dvd', 'ClapperboardIcon', 'Película'], series: ['dvd', 'TvMinimalIcon', 'Serie'], videogame: ['vg', 'Gamepad2Icon', 'Videojuego'], music: ['square', 'Disc3Icon', 'Música'], other: ['square', 'ShapesIcon', 'Otro'] };
    const [s, icon, t] = shapes[this.props.kind] || shapes.other;
    const box = this.props.size ?? 64;
    return { tall: s === 'tall', square: s === 'square', dvd: s === 'dvd', vg: s === 'vg', icon, label: 'Sin portada · ' + t, iconSize: Math.max(14, Math.round(box / 3.2)), radius: box < 80 ? '4px' : '6px' };
  }
}
</script>
</body>
</html>
