<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;position:relative;display:flex;flex-direction:column;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><dc-import name="AppBar" role="admin" hint-size="100%,64px"></dc-import><div style="padding:0 16px 8px;display:flex;flex-direction:column;gap:10px"><div style="display:flex;align-items:baseline;gap:8px"><h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em">{{ heading }}</h1><span style="font-size:13px;color:var(--muted-foreground)">{{ count }}</span></div><div style="display:flex;gap:6px;overflow:hidden;mask-image:linear-gradient(90deg,#000 85%,transparent)"><sc-for list="{{ filters }}" as="f" hint-placeholder-count="5"><sc-if value="{{ f._c_bd }}" hint-placeholder-val="{{ false }}"><span style="height:36px;padding:0 12px;border-radius:8px;display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:14px;font-weight:500;border:1px solid var(--primary);background:color-mix(in oklch,var(--primary) 12%,transparent);color:var(--primary)"><x-import component-from-global-scope="Library.{{ f.icon }}" size="15" hint-size="15px,15px"></x-import>{{ f.label }}</span></sc-if><sc-if value="{{ f._nc_bd }}" hint-placeholder-val="{{ true }}"><span style="height:36px;padding:0 12px;border-radius:8px;display:flex;align-items:center;gap:6px;flex-shrink:0;font-size:14px;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--foreground)"><x-import component-from-global-scope="Library.{{ f.icon }}" size="15" hint-size="15px,15px"></x-import>{{ f.label }}</span></sc-if></sc-for></div></div><div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="6"><div style="min-height:80px;display:flex;align-items:center;gap:14px;padding:8px 16px"><sc-if value="{{ r._c_cw }}" hint-placeholder-val="{{ false }}"><dc-import name="Cover" kind="{{ r.kind }}" size="{{ 60 }}" style="width:60px;height:60px;flex-shrink:0" hint-size="42px,60px"></dc-import></sc-if><sc-if value="{{ r._nc_cw }}" hint-placeholder-val="{{ true }}"><dc-import name="Cover" kind="{{ r.kind }}" size="{{ 60 }}" style="width:42px;height:60px;flex-shrink:0" hint-size="42px,60px"></dc-import></sc-if><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.title }}</span><span style="font-size:13.5px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.meta }}</span><sc-if value="{{ r.hasWish }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:5px;font-size:13px;color:var(--wish)"><x-import component-from-global-scope="Library.GiftIcon" size="13" hint-size="13px,13px"></x-import>{{ r.wish }}</span></sc-if></div></div></sc-for></div><sc-if value="{{ canFab }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;right:16px;bottom:118px;height:56px;padding:0 20px;border-radius:16px;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;box-shadow:0 6px 16px -4px oklch(0 0 0 / 30%)"><x-import component-from-global-scope="Library.PlusIcon" size="20" hint-size="20px,20px"></x-import>Apuntar</div></sc-if><dc-import name="BottomNav" active="{{ nav }}" hint-size="100%,94px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;missing&quot;,&quot;wishOthers&quot;,&quot;genre&quot;],&quot;default&quot;:&quot;missing&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  _rv() {
    const v = this.props.view ?? 'missing';
    const A = [['book', 'Dune: El emperador-dios', 'Libro · Dune 4', 'Lo desea Hugo', 'm', 'sf'], ['game', 'Catán: Navegantes', 'Juego de mesa · necesita Catán', 'Lo deseas tú y Laura', 'm'], ['book', 'Hijos de Dune', 'Libro · Dune 3', '', 'm', 'sf'], ['videogame', 'Zelda: Tears of the Kingdom', 'Videojuego · Nintendo EPD', 'Lo deseas tú y Hugo', 'm'], ['film', 'Blade Runner', 'Película · Ridley Scott · 1982', 'Lo desea Laura', 'm', 'sf'], ['book', 'Dune', 'Libro · Frank Herbert · 1965', '', 'o', 'sf'], ['comic', 'Watchmen', 'Cómic · Alan Moore', 'Lo desea Laura', 'o']];
    let r = A.filter(x => x[4] === 'm');
    if (v === 'wishOthers') r = A.filter(x => x[4] === 'm' && x[3] && !/tú/.test(x[3]));
    if (v === 'genre') r = A.filter(x => x[5]);
    const F = (label, icon, on) => ({ label, icon, bd: on ? 'var(--primary)' : 'var(--border)', bg: on ? 'color-mix(in oklch,var(--primary) 12%,transparent)' : 'transparent', fg: on ? 'var(--primary)' : 'var(--foreground)' });
    const filters = v === 'genre' ? [F('Ciencia ficción', 'DramaIcon', true), F('#clásicos', 'TagIcon', true), F('Tipo', 'ShapesIcon'), F('Mi estado', 'CircleDotIcon'), F('Deseos', 'GiftIcon')] : [F(v === 'wishOthers' ? 'Lo que desean otros' : 'Deseos', 'GiftIcon', v === 'wishOthers'), F('Tipo', 'ShapesIcon'), F('Género', 'DramaIcon'), F('Etiqueta', 'TagIcon'), F('Serie', 'ListOrderedIcon')];
    return {
      theme: this.props.theme ?? 'light', nav: v === 'genre' ? 'catalog' : 'missing', heading: v === 'genre' ? 'Catálogo' : 'Me falta', filters, canFab: v !== 'genre',
      count: { missing: '23 obras', wishOthers: r.length + ' de 23 · para regalar', genre: r.length + ' de 248' }[v],
      rows: r.map(([kind, title, meta, wish]) => ({ kind, title, meta, wish, hasWish: !!wish, cw: kind === 'game' ? '60px' : '42px' }))
    };
  }
  renderVals() {
    const o = this._rv();
    for (const [lk, k, a] of [["filters","bd","var(--primary)"],["rows","cw","60px"]]) {
      if (!lk) { o['_c_' + k] = o[k] === a; o['_nc_' + k] = !o['_c_' + k]; continue; }
      (o[lk] || []).forEach(it => { it['_c_' + k] = it[k] === a; it['_nc_' + k] = !it['_c_' + k]; });
    }
    return o;
  }
}
</script>
</body>
</html>
