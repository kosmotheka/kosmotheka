<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:100%;height:100%;position:relative;font-family:var(--font-sans)"><div style="position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding-top:120px;box-sizing:border-box"><div role="alertdialog" aria-label="¿Borrar Familia?" style="width:520px;background:var(--background);color:var(--foreground);border-radius:16px;box-shadow:0 0 0 1px var(--border),0 24px 64px -16px oklch(0 0 0 / 40%);display:flex;flex-direction:column;overflow:hidden"><div style="display:flex;align-items:center;gap:12px;padding:20px 16px 0 24px"><span style="width:36px;height:36px;border-radius:18px;background:color-mix(in oklch,var(--destructive) 14%,transparent);color:var(--destructive);display:flex;align-items:center;justify-content:center;flex-shrink:0"><x-import component-from-global-scope="Library.Trash2Icon" size="18" hint-size="18px,18px"></x-import></span><h2 style="margin:0;flex:1;font-size:18px;font-weight:600;letter-spacing:-0.01em">¿Borrar Familia?</h2><button aria-label="Cerrar" style="width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.XIcon" size="18" hint-size="18px,18px"></x-import></button></div><div style="padding:14px 24px 22px;display:flex;flex-direction:column;gap:14px;font-size:14px;line-height:1.5"><p style="margin:0;text-wrap:pretty"><strong style="font-weight:600">No se puede deshacer.</strong> Se borran sus 248 obras, con sus ejemplares, series e historial, en este equipo y también en:</p><div style="display:flex;flex-wrap:wrap;gap:6px"><sc-for list="{{ devices }}" as="d" hint-placeholder-count="3"><span style="height:28px;padding:0 10px;border-radius:6px;background:var(--secondary);color:var(--secondary-foreground);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500"><x-import component-from-global-scope="Library.{{ d.icon }}" size="14" hint-size="14px,14px"></x-import>{{ d.name }}</span></sc-for></div><sc-if value="{{ notSaved }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:12px;background:var(--muted)"><span style="flex:1;text-wrap:pretty">Antes, guarda una copia: con ella podrás recuperar Familia si cambias de idea.</span><button style="height:36px;display:flex;align-items:center;gap:7px;padding:0 14px;border-radius:8px;border:0;background:var(--primary);color:var(--primary-foreground);font:500 14px var(--font-sans);flex-shrink:0"><x-import component-from-global-scope="Library.ArchiveIcon" size="16" hint-size="16px,16px"></x-import>Guardar una copia</button></div></sc-if><sc-if value="{{ saved }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;background:var(--success-soft);color:var(--success)"><x-import component-from-global-scope="Library.CircleCheckIcon" size="18" hint-size="18px,18px"></x-import><span style="flex:1;font-weight:600">Copia guardada</span><span style="font-size:13px;color:var(--foreground);font-family:var(--font-mono)">Documentos/familia-26-09-2026.zip</span></div></sc-if></div><div style="display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--border);background:var(--muted)"><button style="height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 14px var(--font-sans)">Cancelar</button><sc-if value="{{ notSaved }}" hint-placeholder-val="{{ true }}"><button style="height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--destructive);background:var(--background);color:var(--destructive);font:500 14px var(--font-sans)">Borrar sin copia</button></sc-if><sc-if value="{{ saved }}" hint-placeholder-val="{{ false }}"><button style="height:36px;padding:0 16px;border-radius:8px;border:0;background:var(--destructive);color:var(--destructive-foreground);font:500 14px var(--font-sans)">Borrar Familia</button></sc-if></div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;saved&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const saved = !!this.props.saved;
    return { saved, notSaved: !saved, devices: [
      { icon: 'SmartphoneIcon', name: 'Pixel 8' }, { icon: 'SmartphoneIcon', name: 'Pixel 7' }, { icon: 'TabletIcon', name: 'Tablet Lenovo' }
    ] };
  }
}
</script>
</body>
</html>
