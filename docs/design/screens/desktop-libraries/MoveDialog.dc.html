<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:100%;height:100%;position:relative;font-family:var(--font-sans)"><sc-if value="{{ menu }}" hint-placeholder-val="{{ false }}"><div role="menu" aria-label="Más opciones" style="position:absolute;top:104px;right:16px;width:250px;padding:5px;border-radius:10px;background:var(--popover);color:var(--popover-foreground);box-shadow:0 0 0 1px var(--border),0 16px 40px -12px oklch(0 0 0 / 35%);box-sizing:border-box"><sc-for list="{{ items }}" as="i" hint-placeholder-count="4"><div role="menuitem" style="position:relative;isolation:isolate;display:flex;align-items:center;gap:10px;height:34px;padding:0 10px;border-radius:6px;font-size:14px"><sc-if value="{{ i.hl }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;z-index:-1;border-radius:6px;background:var(--accent)"></span></sc-if><x-import component-from-global-scope="Library.{{ i.icon }}" size="16" hint-size="16px,16px"></x-import><span style="flex:1">{{ i.label }}</span></div></sc-for></div></sc-if><sc-if value="{{ dialog }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding-top:140px;box-sizing:border-box"><div role="dialog" aria-label="Mover Dune a otra biblioteca" style="width:480px;background:var(--background);color:var(--foreground);border-radius:16px;box-shadow:0 0 0 1px var(--border),0 24px 64px -16px oklch(0 0 0 / 40%);display:flex;flex-direction:column;overflow:hidden"><div style="display:flex;align-items:center;padding:18px 16px 0 24px"><div style="flex:1;display:flex;flex-direction:column;gap:2px"><h2 style="margin:0;font-size:18px;font-weight:600;letter-spacing:-0.01em">Mover «Dune» a…</h2><span style="font-size:13px;color:var(--muted-foreground)">Ahora está en Familia</span></div><button aria-label="Cerrar" style="width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.XIcon" size="18" hint-size="18px,18px"></x-import></button></div><div role="radiogroup" style="padding:14px 16px 0;display:flex;flex-direction:column;gap:2px"><sc-for list="{{ libs }}" as="l" hint-placeholder-count="3"><div role="radio" aria-checked="{{ l.on }}" style="position:relative;isolation:isolate;display:flex;align-items:center;gap:12px;min-height:48px;padding:0 10px;border-radius:8px"><sc-if value="{{ l.on }}" hint-placeholder-val="{{ false }}"><span style="position:absolute;inset:0;z-index:-1;border-radius:8px;background:var(--accent)"></span></sc-if><sc-if value="{{ l.on }}" hint-placeholder-val="{{ false }}"><span style="width:18px;height:18px;border-radius:9px;border:1.5px solid var(--primary);box-sizing:border-box;display:flex;align-items:center;justify-content:center;flex-shrink:0"><span style="width:8px;height:8px;border-radius:4px;background:var(--primary)"></span></span></sc-if><sc-if value="{{ l.off }}" hint-placeholder-val="{{ true }}"><span style="width:18px;height:18px;border-radius:9px;border:1.5px solid var(--muted-foreground);box-sizing:border-box;flex-shrink:0"></span></sc-if><span style="flex:1;font-size:14px;font-weight:500">{{ l.name }}</span><span style="font-size:12px;color:var(--muted-foreground)">{{ l.meta }}</span></div></sc-for></div><div style="margin:14px 24px 22px;display:flex;gap:10px;padding:12px 14px;border-radius:10px;background:var(--muted);font-size:13px;line-height:1.5"><x-import component-from-global-scope="Library.InfoIcon" size="16" style="flex-shrink:0;margin-top:2px;color:var(--muted-foreground)" hint-size="16px,16px"></x-import><span style="text-wrap:pretty">La edición y sus 2 ejemplares pasan a Rol. El historial se queda en Familia.</span></div><div style="display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--border);background:var(--muted)"><button style="height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 14px var(--font-sans)">Cancelar</button><button style="height:36px;padding:0 16px;border-radius:8px;border:0;background:var(--primary);color:var(--primary-foreground);font:500 14px var(--font-sans)">Mover a Rol</button></div></div></div></sc-if></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;step&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;menú&quot;,&quot;diálogo&quot;],&quot;default&quot;:&quot;diálogo&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const menu = this.props.step === 'menú';
    const mk = (name, meta, on) => ({ name, meta, on, off: !on});
    return {
      menu, dialog: !menu,
      items: [['PencilIcon', 'Editar'], ['FolderInputIcon', 'Mover a otra biblioteca…', true], ['ListOrderedIcon', 'Añadir a una serie'], ['Trash2Icon', 'Borrar']]
        .map(([icon, label, hl]) => ({ icon, label, hl: !!hl })),
      libs: [mk('Rol', '412 obras', true), mk('Videojuegos de Hugo', '37 obras', false), mk('Juegos de mesa', '64 obras', false)]
    };
  }
}
</script>
</body>
</html>
