<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:1280px;height:800px;position:relative;overflow:hidden;display:flex;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><dc-import name="Sidebar" active="none" hint-size="256px,100%"></dc-import><div style="flex:1;min-width:0;display:flex;flex-direction:column"><dc-import name="TopBar" query="dune" scope="todas" hint-size="100%,56px"></dc-import><main style="flex:1;min-height:0;overflow:hidden;padding:20px 24px 0"><div style="display:flex;align-items:baseline;gap:10px"><h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em">«dune» en todas</h1><span style="font-size:13px;color:var(--muted-foreground)">5 resultados en 4 bibliotecas</span></div><div role="table" style="margin-top:14px;display:flex;flex-direction:column"><sc-for list="{{ groups }}" as="g" hint-placeholder-count="4"><div role="rowgroup"><div style="display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;border-bottom:1px solid var(--border);margin-top:8px"><x-import component-from-global-scope="Library.LibraryBigIcon" size="15" style="color:var(--muted-foreground)" hint-size="15px,15px"></x-import><span style="font-size:13px;font-weight:600">{{ g.name }}</span><span style="font-size:12px;color:var(--muted-foreground)">{{ g.count }}</span><span style="flex:1"></span><span style="font-size:12px;color:var(--muted-foreground)">{{ g.hint }}</span></div><sc-for list="{{ g.items }}" as="it" hint-placeholder-count="2"><div role="row" style="display:flex;gap:16px;align-items:center;height:56px;padding:0 12px;border-bottom:1px solid var(--border);font-size:13px"><div style="width:40px;height:44px;flex-shrink:0;display:flex;justify-content:center"><dc-import name="Cover" kind="{{ it.kind }}" size="{{ 44 }}" style="width:40px;height:44px" hint-size="40px,44px"></dc-import></div><div style="flex:2.4 1 0;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:500">{{ it.title }}</span><span style="font-size:12px;color:var(--muted-foreground)">{{ it.by }}</span></div><span style="width:120px;flex-shrink:0;color:var(--muted-foreground)">{{ it.type }}</span><span style="width:44px;flex-shrink:0;color:var(--muted-foreground);font-variant-numeric:tabular-nums">{{ it.year }}</span><span style="width:140px;flex-shrink:0">{{ it.format }}</span><span style="flex:1 1 0;min-width:0;color:var(--muted-foreground)">{{ it.where }}</span></div></sc-for></div></sc-for></div></main></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { groups: [
      { name: 'Familia', count: '2', hint: 'La que usas ahora', items: [
        { kind: 'book', title: 'Dune', by: 'Frank Herbert', type: 'Libro', year: '1965', format: 'Tapa blanda +1', where: 'Salón; Kindle' },
        { kind: 'book', title: 'El mesías de Dune', by: 'Frank Herbert', type: 'Libro', year: '1969', format: 'Tapa blanda', where: 'Salón' }
      ] },
      { name: 'Rol', count: '1', hint: 'Al abrirlo, pasas a Rol', items: [{ kind: 'book', title: 'Dune: Aventuras en el Imperio', by: 'Modiphius', type: 'Libro', year: '2021', format: 'Tapa dura', where: 'Estudio' }] },
      { name: 'Juegos de mesa', count: '1', hint: '', items: [{ kind: 'game', title: 'Dune: Imperium', by: 'Paul Dennen · 1–4 jugadores', type: 'Juego de mesa', year: '2020', format: 'Caja', where: 'Estudio' }] },
      { name: 'Videojuegos de Hugo', count: '1', hint: '', items: [{ kind: 'videogame', title: 'Dune: Spice Wars', by: 'Shiro Games · PC', type: 'Videojuego', year: '2023', format: 'Steam', where: 'Digital' }] }
    ] };
  }
}
</script>
</body>
</html>
