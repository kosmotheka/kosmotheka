<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:100%;height:100%;position:relative;font-family:var(--font-sans)"><div style="position:absolute;inset:0;background:var(--scrim);display:flex;align-items:flex-start;justify-content:center;padding-top:160px;box-sizing:border-box"><div role="dialog" aria-label="Nueva biblioteca" style="width:460px;background:var(--background);color:var(--foreground);border-radius:16px;box-shadow:0 0 0 1px var(--border),0 24px 64px -16px oklch(0 0 0 / 40%);display:flex;flex-direction:column;overflow:hidden"><div style="display:flex;align-items:center;padding:18px 16px 0 24px"><h2 style="margin:0;flex:1;font-size:18px;font-weight:600;letter-spacing:-0.01em">Nueva biblioteca</h2><button aria-label="Cerrar" style="width:36px;height:36px;border:0;border-radius:8px;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.XIcon" size="18" hint-size="18px,18px"></x-import></button></div><div style="padding:6px 24px 22px;display:flex;flex-direction:column;gap:16px"><p style="margin:0;font-size:14px;line-height:1.5;color:var(--muted-foreground);text-wrap:pretty">Una caja aparte, con su propio catálogo. Luego podrás compartirla con otros dispositivos.</p><sc-if value="{{ ok }}" hint-placeholder-val="{{ true }}"><label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:500">Nombre</span><span style="height:40px;display:flex;align-items:center;padding:0 12px;border-radius:8px;border:1px solid var(--ring);box-shadow:0 0 0 3px color-mix(in oklch,var(--ring) 30%,transparent);font-size:14px;box-sizing:border-box">Música<span style="width:1.5px;height:18px;background:var(--foreground);margin-left:1px"></span></span><span style="font-size:12px;color:var(--muted-foreground)">Por ejemplo, «Rol» o «Cómics de Marcos». Se puede cambiar cuando quieras.</span></label></sc-if><sc-if value="{{ dup }}" hint-placeholder-val="{{ false }}"><label style="display:flex;flex-direction:column;gap:6px"><span style="font-size:13px;font-weight:500">Nombre</span><span aria-invalid="true" style="height:40px;display:flex;align-items:center;padding:0 12px;border-radius:8px;border:1px solid var(--destructive);box-shadow:0 0 0 3px color-mix(in oklch,var(--destructive) 20%,transparent);font-size:14px;box-sizing:border-box">Rol<span style="width:1.5px;height:18px;background:var(--foreground);margin-left:1px"></span></span><span role="alert" style="display:flex;gap:8px;font-size:13px;line-height:1.45;color:var(--destructive)"><x-import component-from-global-scope="Library.CircleAlertIcon" size="15" style="flex-shrink:0;margin-top:2px" hint-size="15px,15px"></x-import><span style="display:flex;flex-direction:column;gap:2px"><span style="font-weight:600">Ya tienes una biblioteca llamada «Rol».</span><span style="color:var(--muted-foreground)">Usa otro nombre, por ejemplo «Rol de los jueves». Si querías abrir esa, está en el selector.</span></span></span></label></sc-if></div><div style="display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--border);background:var(--muted)"><button style="height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 14px var(--font-sans)">Cancelar</button><sc-if value="{{ ok }}" hint-placeholder-val="{{ true }}"><button style="height:36px;padding:0 16px;border-radius:8px;border:0;background:var(--primary);color:var(--primary-foreground);font:500 14px var(--font-sans)">Crear y abrir</button></sc-if><sc-if value="{{ dup }}" hint-placeholder-val="{{ false }}"><button style="height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 14px var(--font-sans)">Abrir Rol</button><button disabled aria-disabled="true" style="height:36px;padding:0 16px;border-radius:8px;border:0;background:var(--primary);color:var(--primary-foreground);opacity:.45;font:500 14px var(--font-sans)">Crear y abrir</button></sc-if></div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;error&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ninguno&quot;,&quot;nombre repetido&quot;],&quot;default&quot;:&quot;ninguno&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const dup = this.props.error === 'nombre repetido';
    return { dup, ok: !dup };
  }
}
</script>
</body>
</html>
