<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><div style="height:100%;display:flex;flex-direction:column"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><header style="height:64px;display:flex;align-items:center;gap:4px;padding:0 4px;flex-shrink:0"><button aria-label="Atrás" style="width:48px;height:48px;border:0;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.ArrowLeftIcon" size="22" hint-size="22px,22px"></x-import></button><div style="flex:1;height:48px;border-radius:24px;background:var(--muted);display:flex;align-items:center;gap:10px;padding:0 16px;font-size:15px;margin-right:12px"><span style="flex:1">dune herbert</span><x-import component-from-global-scope="Library.XIcon" size="18" style="color:var(--muted-foreground)" hint-size="18px,18px"></x-import></div></header><div style="display:flex;align-items:center;gap:8px;padding:0 16px 10px;flex-shrink:0"><span style="height:32px;padding:0 12px;border-radius:8px;background:var(--secondary);display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500"><x-import component-from-global-scope="Library.BookIcon" size="15" hint-size="15px,15px"></x-import>Libro<x-import component-from-global-scope="Library.ChevronDownIcon" size="14" hint-size="14px,14px"></x-import></span><span style="font-size:12px;color:var(--muted-foreground)">4 resultados · Open Library, Google Books</span></div><div style="flex:1;overflow:hidden"><sc-for list="{{ results }}" as="r" hint-placeholder-count="4"><div style="display:flex;gap:14px;padding:12px 16px;border-bottom:1px solid var(--border)"><dc-import name="Cover" kind="book" size="{{ 78 }}" style="width:52px;height:78px" hint-size="52px,78px"></dc-import><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:500">{{ r.title }}</span><span style="font-size:13px;color:var(--muted-foreground)">{{ r.meta }}</span><span style="font-size:12px;color:var(--muted-foreground);font-family:var(--font-mono)">{{ r.isbn }}</span><sc-if value="{{ r.owned }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:8px;margin-top:6px"><span style="padding:2px 8px;border-radius:6px;background:var(--success-soft);color:var(--success);font-size:12px;font-weight:500">Ya está en Familia</span><span style="font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:2px">Añadir otro ejemplar</span></div></sc-if></div></div></sc-for></div><div style="padding:14px 16px 34px;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-shrink:0"><span style="font-size:13px;color:var(--muted-foreground)">¿No es ninguno?</span><button style="height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--border);background:transparent;color:var(--foreground);display:flex;align-items:center;gap:8px;font:500 14px var(--font-sans)"><x-import component-from-global-scope="Library.PencilIcon" size="16" hint-size="16px,16px"></x-import>Añadir a mano</button></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { results: [
      { title: 'Dune', meta: 'Frank Herbert · Debolsillo · 2019', isbn: 'ISBN 978-84-9759-682-4', owned: true },
      { title: 'Dune (edición ilustrada)', meta: 'Frank Herbert · Nova · 2021', isbn: 'ISBN 978-84-18037-06-1', owned: false },
      { title: 'El mesías de Dune', meta: 'Frank Herbert · Debolsillo · 2019', isbn: 'ISBN 978-84-9759-683-1', owned: false },
      { title: 'Hijos de Dune', meta: 'Frank Herbert · Debolsillo · 2019', isbn: 'ISBN 978-84-9759-684-8', owned: false }
    ] };
  }
}
</script>
</body>
</html>
