<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><div style="position:absolute;inset:0;background:var(--scrim);display:flex;flex-direction:column;justify-content:flex-end"><div role="dialog" aria-label="Tus bibliotecas" style="background:var(--popover);color:var(--popover-foreground);border-radius:28px 28px 0 0;padding:10px 0 28px"><div style="width:32px;height:4px;border-radius:2px;background:var(--muted-foreground);opacity:.4;margin:0 auto 14px"></div><div style="padding:0 24px 8px;font-size:17px;font-weight:600">Tus bibliotecas</div><sc-for list="{{ libs }}" as="l" hint-placeholder-count="3"><div style="display:flex;align-items:center;gap:14px;padding:10px 24px;min-height:56px"><div style="width:40px;height:40px;border-radius:12px;background:var(--secondary);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.LibraryBigIcon" size="20" hint-size="20px,20px"></x-import></div><div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:500">{{ l.name }}</span><span style="font-size:13px;color:var(--muted-foreground)">{{ l.meta }}</span></div><sc-if value="{{ l.active }}" hint-placeholder-val="{{ false }}"><x-import component-from-global-scope="Library.CheckIcon" size="20" hint-size="20px,20px"></x-import></sc-if></div></sc-for><div style="height:1px;background:var(--border);margin:8px 24px"></div><div style="display:flex;align-items:center;gap:14px;padding:10px 24px;min-height:56px"><div style="width:40px;height:40px;border-radius:12px;border:1px dashed var(--muted-foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.PlusIcon" size="20" hint-size="20px,20px"></x-import></div><div style="flex:1;display:flex;flex-direction:column;gap:2px"><span style="font-size:15px;font-weight:500">Nueva biblioteca</span><span style="font-size:13px;color:var(--muted-foreground)">O únete a una con su QR</span></div></div></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { libs: [
      { name: 'Familia', meta: '248 obras · Administras', active: true },
      { name: 'Rol', meta: '412 obras · Administras', active: false },
      { name: 'Videojuegos de Hugo', meta: '37 obras · Lector · de Hugo', active: false }
    ] };
  }
}
</script>
</body>
</html>
