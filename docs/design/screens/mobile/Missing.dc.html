<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><div style="height:100%;display:flex;flex-direction:column;position:relative"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><dc-import name="AppBar" role="{{ role }}" hint-size="100%,64px"></dc-import><div style="padding:4px 16px 12px;flex-shrink:0"><div style="display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:12px;background:var(--muted)"><span style="height:38px;border-radius:9px;background:var(--background);box-shadow:0 1px 2px oklch(0 0 0 / 12%);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600">Todo · 23</span><span style="height:38px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:14px;color:var(--muted-foreground)"><x-import component-from-global-scope="Library.HeartIcon" size="15" hint-size="15px,15px"></x-import>Solo deseos · 7</span></div></div><div style="flex:1;overflow:hidden"><div style="display:flex;align-items:center;gap:10px;padding:10px 16px 6px"><span style="font-size:13px;font-weight:600">Saga Dune</span><span style="font-size:12px;color:var(--muted-foreground)">tienes 4 de 6</span><span style="flex:1"></span><span style="font-size:13px;font-weight:500;text-decoration:underline;text-underline-offset:2px">Ver serie</span></div><sc-for list="{{ saga }}" as="it" hint-placeholder-count="2"><div style="display:flex;gap:14px;align-items:center;padding:8px 16px;min-height:64px"><div style="width:32px;height:48px;border-radius:5px;border:1.5px dashed var(--muted-foreground);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted-foreground);flex-shrink:0;margin:0 8px">{{ it.n }}</div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:500">{{ it.title }}</span><span style="font-size:13px;color:var(--muted-foreground)">{{ it.meta }}</span></div><sc-if value="{{ it.wish }}" hint-placeholder-val="{{ false }}"><div aria-label="Quitar de deseos" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--wish)"><x-import component-from-global-scope="Library.HeartIcon" size="21" fill="currentColor" hint-size="21px,21px"></x-import></div></sc-if><sc-if value="{{ it.noWish }}" hint-placeholder-val="{{ true }}"><div aria-label="Marcar como deseo" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted-foreground)"><x-import component-from-global-scope="Library.HeartIcon" size="21" hint-size="21px,21px"></x-import></div></sc-if></div></sc-for><div style="height:1px;background:var(--border);margin:8px 16px"></div><div style="padding:10px 16px 6px;font-size:13px;font-weight:600">Sueltos</div><sc-for list="{{ loose }}" as="it" hint-placeholder-count="4"><div style="display:flex;gap:14px;align-items:center;padding:8px 16px;min-height:64px"><div style="width:48px;display:flex;justify-content:center;opacity:.75"><dc-import name="Cover" kind="{{ it.kind }}" size="{{ 56 }}" style="width:48px;height:56px" hint-size="48px,56px"></dc-import></div><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:3px"><span style="font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ it.title }}</span><span style="font-size:13px;color:var(--muted-foreground)">{{ it.meta }}</span></div><sc-if value="{{ it.wish }}" hint-placeholder-val="{{ false }}"><div aria-label="Quitar de deseos" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--wish)"><x-import component-from-global-scope="Library.HeartIcon" size="21" fill="currentColor" hint-size="21px,21px"></x-import></div></sc-if><sc-if value="{{ it.noWish }}" hint-placeholder-val="{{ true }}"><div aria-label="Marcar como deseo" style="width:44px;height:44px;display:flex;align-items:center;justify-content:center;color:var(--muted-foreground)"><x-import component-from-global-scope="Library.HeartIcon" size="21" hint-size="21px,21px"></x-import></div></sc-if></div></sc-for></div><button style="position:absolute;right:16px;bottom:112px;height:56px;padding:0 20px 0 16px;border:0;border-radius:16px;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;gap:10px;font:600 15px var(--font-sans);box-shadow:0 8px 20px -6px oklch(0 0 0 / 35%)"><x-import component-from-global-scope="Library.PlusIcon" size="22" hint-size="22px,22px"></x-import>Apuntar</button><dc-import name="BottomNav" active="missing" hint-size="100%,95px"></dc-import></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;lector&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const w = (o) => ({ ...o, noWish: !o.wish });
    return {
      role: this.props.role ?? 'admin',
      saga: [
        w({ n: '3', title: 'Hijos de Dune', meta: 'Libro · 1976', wish: true }),
        w({ n: '4', title: 'Dios emperador de Dune', meta: 'Libro · 1981', wish: false })
      ],
      loose: [
        w({ kind: 'game', title: 'Wingspan', meta: 'Juego de mesa · la pide Laura', wish: true }),
        w({ kind: 'film', title: 'Dune: Parte dos', meta: 'Película · 2024 · en 4K', wish: false }),
        w({ kind: 'videogame', title: 'Hollow Knight: Silksong', meta: 'Videojuego · Switch · Hugo', wish: true })
      ]
    };
  }
}
</script>
</body>
</html>
