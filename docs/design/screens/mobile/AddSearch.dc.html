<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><div style="height:100%;display:flex;flex-direction:column"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><header style="height:64px;display:flex;align-items:center;gap:4px;padding:0 4px;flex-shrink:0"><button aria-label="Cerrar" style="width:48px;height:48px;border:0;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.XIcon" size="22" hint-size="22px,22px"></x-import></button><span style="font-size:18px;font-weight:600">Añadir a Familia</span></header><div style="padding:8px 16px 0;display:flex;flex-direction:column;gap:24px;flex:1"><div style="display:flex;gap:8px"><div style="flex:1;height:52px;border-radius:14px;border:2px solid var(--ring);display:flex;align-items:center;gap:10px;padding:0 14px;color:var(--muted-foreground);font-size:15px"><x-import component-from-global-scope="Library.SearchIcon" size="20" hint-size="20px,20px"></x-import><span>Título, autor o código</span><span style="width:2px;height:22px;background:var(--foreground);margin-left:-8px"></span></div><button aria-label="Escanear código" style="width:52px;height:52px;border-radius:14px;border:0;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.ScanBarcodeIcon" size="22" hint-size="22px,22px"></x-import></button></div><div style="display:flex;flex-direction:column;gap:10px"><span style="font-size:13px;font-weight:500;color:var(--muted-foreground)">¿Qué es? Si escaneas un libro, lo sabemos solos</span><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><sc-for list="{{ types }}" as="t" hint-placeholder-count="6"><div style="height:76px;border-radius:14px;border:1px solid var(--border);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:13px;text-align:center;line-height:1.2;padding:0 4px"><x-import component-from-global-scope="Library.{{ t.icon }}" size="22" stroke-width="1.75" hint-size="22px,22px"></x-import>{{ t.label }}</div></sc-for></div></div><div style="display:flex;gap:10px;padding:12px 14px;border-radius:12px;background:var(--muted);font-size:13px;line-height:1.45;color:var(--foreground)"><x-import component-from-global-scope="Library.InfoIcon" size="18" style="flex-shrink:0;margin-top:1px;color:var(--muted-foreground)" hint-size="18px,18px"></x-import><span>Sin cuenta se buscan libros y juegos de mesa. Películas, cómics y videojuegos se añaden a mano, o con la nube. <span style="text-decoration:underline;text-underline-offset:2px">Por qué</span></span></div></div><div style="padding:16px 16px 34px;flex-shrink:0"><button style="width:100%;height:52px;border-radius:14px;border:1px solid var(--border);background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center;gap:8px;font:500 15px var(--font-sans)"><x-import component-from-global-scope="Library.PencilIcon" size="18" hint-size="18px,18px"></x-import>Añadir a mano</button></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return { types: [
      { icon: 'BookIcon', label: 'Libro' }, { icon: 'BookImageIcon', label: 'Cómic' }, { icon: 'Dice5Icon', label: 'Juego de mesa' },
      { icon: 'ClapperboardIcon', label: 'Película o serie' }, { icon: 'Gamepad2Icon', label: 'Videojuego' }, { icon: 'ShapesIcon', label: 'Otro' }
    ] };
  }
}
</script>
</body>
</html>
