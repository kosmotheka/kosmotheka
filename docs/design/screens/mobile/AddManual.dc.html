<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:390px;height:844px;position:relative;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><div style="height:100%;display:flex;flex-direction:column"><dc-import name="StatusBar" hint-size="100%,32px"></dc-import><header style="height:64px;display:flex;align-items:center;gap:4px;padding:0 12px 0 4px;flex-shrink:0"><button aria-label="Cerrar" style="width:48px;height:48px;border:0;background:transparent;color:var(--foreground);display:flex;align-items:center;justify-content:center"><x-import component-from-global-scope="Library.XIcon" size="22" hint-size="22px,22px"></x-import></button><span style="flex:1;font-size:18px;font-weight:600">Nuevo libro</span><button style="height:40px;padding:0 18px;border-radius:12px;border:0;background:var(--primary);color:var(--primary-foreground);font:600 14px var(--font-sans)">Guardar</button></header><div style="flex:1;overflow:hidden;padding:4px 16px 0;display:flex;flex-direction:column;gap:14px"><div style="display:flex;gap:14px"><div style="width:84px;height:126px;border-radius:8px;border:1px dashed var(--muted-foreground);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:12px;color:var(--muted-foreground);flex-shrink:0"><x-import component-from-global-scope="Library.ImagePlusIcon" size="22" hint-size="22px,22px"></x-import>Portada</div><div style="flex:1;display:flex;flex-direction:column;gap:12px"><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">Título<span style="height:44px;border-radius:10px;border:2px solid var(--ring);display:flex;align-items:center;padding:0 12px;font-size:15px;font-weight:400">Crónicas de la Dragonlance</span></label><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">Tipo<span style="height:44px;border-radius:10px;border:1px solid var(--input);display:flex;align-items:center;gap:8px;padding:0 12px;font-size:15px;font-weight:400"><x-import component-from-global-scope="Library.BookIcon" size="16" hint-size="16px,16px"></x-import><span style="flex:1">Libro</span><x-import component-from-global-scope="Library.ChevronDownIcon" size="16" hint-size="16px,16px"></x-import></span></label></div></div><div style="display:grid;grid-template-columns:1fr 96px;gap:10px"><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">Autores<span style="height:44px;border-radius:10px;border:1px solid var(--input);display:flex;align-items:center;padding:0 12px;font-size:15px;font-weight:400">Weis, Hickman</span></label><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">Año<span style="height:44px;border-radius:10px;border:1px solid var(--input);display:flex;align-items:center;padding:0 12px;font-size:15px;font-weight:400">1987</span></label></div><label style="display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:500">ISBN <span style="font-weight:400;color:var(--muted-foreground);margin-top:-4px">Opcional. Los libros antiguos no lo tienen</span><span style="height:44px;border-radius:10px;border:1px solid var(--input);display:flex;align-items:center;padding:0 12px;font-size:15px;font-weight:400;color:var(--muted-foreground)">978…</span></label><div style="height:1px;background:var(--border);margin:4px 0"></div><div style="display:flex;flex-direction:column;gap:10px"><span style="font-size:15px;font-weight:600">¿Lo tienes?</span><div style="display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:12px;background:var(--muted)"><span style="height:40px;border-radius:9px;background:var(--background);box-shadow:0 1px 2px oklch(0 0 0 / 12%);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600">Sí, lo tengo</span><span style="height:40px;display:flex;align-items:center;justify-content:center;font-size:14px;color:var(--muted-foreground)">No, me falta</span></div><div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><label style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted-foreground)">Formato<span style="height:44px;border-radius:10px;border:1px solid var(--input);display:flex;align-items:center;padding:0 10px;font-size:14px;color:var(--foreground)">Tapa blanda</span></label><label style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted-foreground)">De quién<span style="height:44px;border-radius:10px;border:1px solid var(--input);display:flex;align-items:center;padding:0 10px;font-size:14px;color:var(--foreground)">Tú</span></label><label style="display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted-foreground)">Dónde<span style="height:44px;border-radius:10px;border:1px solid var(--input);display:flex;align-items:center;padding:0 10px;font-size:14px;color:var(--foreground)">Salón</span></label></div><span style="font-size:12px;color:var(--muted-foreground)">Recordamos lo que usaste la última vez.</span></div><button style="height:44px;border-radius:10px;border:0;background:transparent;color:var(--foreground);display:flex;align-items:center;gap:8px;padding:0;font:500 14px var(--font-sans)"><x-import component-from-global-scope="Library.ChevronRightIcon" size="18" hint-size="18px,18px"></x-import>Más datos: editorial, páginas, series, notas</button></div></div></div>
