<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:1280px;height:800px;display:flex;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><dc-import name="Sidebar" active="{{ nav }}" role="{{ role }}" hint-size="256px,100%"></dc-import><div style="flex:1;min-width:0;display:flex;flex-direction:column"><dc-import name="TopBar" role="{{ role }}" hint-size="100%,56px"></dc-import><div style="flex:1;min-height:0;display:flex"><main style="flex:1;min-width:0;display:flex;flex-direction:column;padding:20px 24px 0;gap:12px"><div style="display:flex;align-items:center;gap:12px"><h1 style="margin:0;font-size:22px;font-weight:600;letter-spacing:-0.02em">{{ heading }}</h1><span style="flex:1;font-size:13px;color:var(--muted-foreground)">{{ countLabel }}</span><div role="radiogroup" aria-label="Qué ver" style="display:flex;padding:3px;border-radius:9px;background:var(--muted)"><sc-for list="{{ views }}" as="v" hint-placeholder-count="3"><sc-if value="{{ v._c_bg }}" hint-placeholder-val="{{ false }}"><span role="radio" aria-checked="{{ v.on }}" style="height:28px;padding:0 12px;border-radius:6px;display:flex;align-items:center;font-size:13px;font-weight:600;background:var(--background);color:var(--foreground);box-shadow:0 1px 2px oklch(0 0 0 / 12%)">{{ v.label }}</span></sc-if><sc-if value="{{ v._nc_bg }}" hint-placeholder-val="{{ true }}"><span role="radio" aria-checked="{{ v.on }}" style="height:28px;padding:0 12px;border-radius:6px;display:flex;align-items:center;font-size:13px;font-weight:500;background:transparent;color:var(--muted-foreground);box-shadow:none">{{ v.label }}</span></sc-if></sc-for></div></div><div style="display:flex;flex-wrap:wrap;align-items:center;gap:6px"><sc-for list="{{ filters }}" as="f" hint-placeholder-count="7"><sc-if value="{{ f._c_bd }}" hint-placeholder-val="{{ false }}"><span style="height:32px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;border:1px solid var(--primary);background:color-mix(in oklch,var(--primary) 12%,transparent);color:var(--primary)"><x-import component-from-global-scope="Library.{{ f.icon }}" size="14" hint-size="14px,14px"></x-import>{{ f.label }}<x-import component-from-global-scope="Library.{{ f.tail }}" size="14" hint-size="14px,14px"></x-import></span></sc-if><sc-if value="{{ f._nc_bd }}" hint-placeholder-val="{{ true }}"><span style="height:32px;padding:0 10px;border-radius:8px;display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;border:1px solid var(--border);background:transparent;color:var(--foreground)"><x-import component-from-global-scope="Library.{{ f.icon }}" size="14" hint-size="14px,14px"></x-import>{{ f.label }}<x-import component-from-global-scope="Library.{{ f.tail }}" size="14" hint-size="14px,14px"></x-import></span></sc-if></sc-for><sc-if value="{{ anyOn }}" hint-placeholder-val="{{ false }}"><a style="font-size:13px;color:var(--primary);padding:0 6px;text-decoration:none">Quitar filtros</a></sc-if></div><div style="flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;border-top:1px solid var(--border)"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="8"><sc-if value="{{ r._c_bg }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:14px;padding:9px 10px;border-bottom:1px solid var(--border);background:var(--muted)"><dc-import name="Cover" kind="{{ r.kind }}" size="{{ 48 }}" style="width:36px;height:48px;flex-shrink:0" hint-size="36px,48px"></dc-import><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.title }}</span><span style="font-size:13px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.meta }}</span></div><span style="width:190px;font-size:13px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.series }}</span><sc-if value="{{ r._c_wTone }}" hint-placeholder-val="{{ false }}"><span style="width:170px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--wish)"><x-import component-from-global-scope="Library.{{ r.wIcon }}" size="14" hint-size="14px,14px"></x-import>{{ r.wish }}</span></sc-if><sc-if value="{{ r._nc_wTone }}" hint-placeholder-val="{{ true }}"><span style="width:170px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--foreground)"><x-import component-from-global-scope="Library.{{ r.wIcon }}" size="14" hint-size="14px,14px"></x-import>{{ r.wish }}</span></sc-if><sc-if value="{{ r._c_stTone }}" hint-placeholder-val="{{ false }}"><span style="width:84px;font-size:12.5px;font-weight:500;color:var(--muted-foreground)">{{ r.st }}</span></sc-if><sc-if value="{{ r._nc_stTone }}" hint-placeholder-val="{{ true }}"><span style="width:84px;font-size:12.5px;font-weight:500;color:var(--foreground)">{{ r.st }}</span></sc-if></div></sc-if><sc-if value="{{ r._nc_bg }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:14px;padding:9px 10px;border-bottom:1px solid var(--border);background:transparent"><dc-import name="Cover" kind="{{ r.kind }}" size="{{ 48 }}" style="width:36px;height:48px;flex-shrink:0" hint-size="36px,48px"></dc-import><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.title }}</span><span style="font-size:13px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.meta }}</span></div><span style="width:190px;font-size:13px;color:var(--muted-foreground);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.series }}</span><sc-if value="{{ r._c_wTone }}" hint-placeholder-val="{{ false }}"><span style="width:170px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--wish)"><x-import component-from-global-scope="Library.{{ r.wIcon }}" size="14" hint-size="14px,14px"></x-import>{{ r.wish }}</span></sc-if><sc-if value="{{ r._nc_wTone }}" hint-placeholder-val="{{ true }}"><span style="width:170px;display:flex;align-items:center;gap:6px;font-size:13px;color:var(--foreground)"><x-import component-from-global-scope="Library.{{ r.wIcon }}" size="14" hint-size="14px,14px"></x-import>{{ r.wish }}</span></sc-if><sc-if value="{{ r._c_stTone }}" hint-placeholder-val="{{ false }}"><span style="width:84px;font-size:12.5px;font-weight:500;color:var(--muted-foreground)">{{ r.st }}</span></sc-if><sc-if value="{{ r._nc_stTone }}" hint-placeholder-val="{{ true }}"><span style="width:84px;font-size:12.5px;font-weight:500;color:var(--foreground)">{{ r.st }}</span></sc-if></div></sc-if></sc-for></div></main><sc-if value="{{ panel }}" hint-placeholder-val="{{ false }}"><dc-import name="WorkPanel" variant="{{ panelVariant }}" role="{{ role }}" hint-size="400px,100%"></dc-import></sc-if></div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;missing&quot;,&quot;wishMine&quot;,&quot;wishOthers&quot;,&quot;genre&quot;],&quot;default&quot;:&quot;missing&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;role&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;admin&quot;,&quot;editor&quot;,&quot;lector&quot;],&quot;default&quot;:&quot;admin&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;panel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;panelVariant&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;missing&quot;,&quot;reader&quot;,&quot;expansion&quot;,&quot;series&quot;],&quot;default&quot;:&quot;missing&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  _rv() {
    const v = this.props.view ?? 'missing';
    const role = this.props.role ?? 'admin';
    const A = [
      ['book', 'Dune: El emperador-dios', 'Libro · Frank Herbert · 1981', 'Dune · 4', 'Hugo', 'miss', ['Ciencia ficción'], ['clásicos']],
      ['game', 'Catán: Navegantes', 'Juego de mesa · expansión · necesita Catán', 'Catán', 'Tú, Laura', 'miss', ['Estrategia', 'Familiar'], []],
      ['book', 'Hijos de Dune', 'Libro · Frank Herbert · 1976', 'Dune · 3', '', 'miss', ['Ciencia ficción'], []],
      ['videogame', 'Zelda: Tears of the Kingdom', 'Videojuego · Nintendo EPD · 2023', 'The Legend of Zelda', 'Tú, Hugo', 'miss', ['Aventura'], ['para Hugo']],
      ['film', 'Blade Runner', 'Película · Ridley Scott · 1982', 'Blade Runner · 1', 'Laura', 'miss', ['Ciencia ficción'], ['clásicos']],
      ['music', 'Revolver', 'Música · The Beatles · 1966', '', 'Tú', 'miss', ['Rock'], []],
      ['book', 'Dune', 'Libro · Frank Herbert · 1965', 'Dune · 1', '', 'own', ['Ciencia ficción'], ['clásicos']],
      ['game', 'Catán', 'Juego de mesa · Klaus Teuber · 1995', 'Catán', '', 'own', ['Estrategia', 'Familiar'], []],
      ['comic', 'Watchmen', 'Cómic · Alan Moore, Dave Gibbons · 1987', '', 'Laura', 'own', ['Superhéroes'], ['clásicos']],
      ['series', 'Twin Peaks', 'Serie · 3 temporadas', '', '', 'own', ['Misterio'], []]
    ];
    let rows = A;
    if (v === 'missing') rows = A.filter(r => r[5] === 'miss');
    if (v === 'wishMine') rows = A.filter(r => /Tú/.test(r[4]));
    if (v === 'wishOthers') rows = A.filter(r => r[4] && r[4] !== 'Tú');
    if (v === 'genre') rows = A.filter(r => r[6].includes('Ciencia ficción') && r[7].includes('clásicos'));
    const hl = this.props.panel ? 0 : -1;
    const rowsO = rows.map((r, i) => {
      const w = r[4]; const mine = /Tú/.test(w);
      return { kind: r[0], title: r[1], meta: r[2], series: r[3] || '—', wish: w ? (w === 'Tú' ? 'Lo deseas' : 'Lo desea' + (w.includes(',') ? 'n ' : ' ') + w.replace('Tú', 'tú')) : '', wIcon: w ? 'GiftIcon' : 'MinusIcon', wTone: w ? (mine ? 'var(--wish)' : 'var(--foreground)') : 'var(--foreground)', st: r[5] === 'miss' ? 'Me falta' : 'Lo tengo', stTone: r[5] === 'miss' ? 'var(--muted-foreground)' : 'var(--foreground)', bg: i === hl ? 'var(--muted)' : 'transparent' };
    });
    const tab = v === 'missing' || v === 'wishOthers' ? 'Me falta' : 'Todo';
    const views = ['Lo tengo', 'Me falta', 'Todo'].map(l => { const on = l === tab; return { label: l, on: String(on), fw: on ? 600 : 500, bg: on ? 'var(--background)' : 'transparent', fg: on ? 'var(--foreground)' : 'var(--muted-foreground)', sh: on ? '0 1px 2px oklch(0 0 0 / 12%)' : 'none' }; });
    const F = (label, icon, on) => ({ label, icon, tail: on ? 'XIcon' : 'ChevronDownIcon', bd: on ? 'var(--primary)' : 'var(--border)', bg: on ? 'color-mix(in oklch,var(--primary) 12%,transparent)' : 'transparent', fg: on ? 'var(--primary)' : 'var(--foreground)' });
    const filters = [F('Tipo', 'ShapesIcon', false), F('Mi estado', 'CircleDotIcon', false), F(v === 'wishMine' ? 'Lo que deseo' : v === 'wishOthers' ? 'Lo que desean otros' : 'Deseos', 'GiftIcon', v === 'wishMine' || v === 'wishOthers'), F(v === 'genre' ? 'Ciencia ficción' : 'Género', 'DramaIcon', v === 'genre'), F(v === 'genre' ? '#clásicos' : 'Etiqueta', 'TagIcon', v === 'genre'), F('Serie', 'ListOrderedIcon', false), F('Persona', 'UserIcon', false)];
    const n = rowsO.length;
    return {
      theme: this.props.theme ?? 'light', role, nav: v === 'missing' || v === 'wishOthers' ? 'missing' : 'catalog', heading: tab === 'Me falta' ? 'Me falta' : 'Catálogo', views, filters, anyOn: v !== 'missing', rows: rowsO,
      countLabel: { missing: '23 obras sin ejemplares', wishMine: n + ' de 271 · Lo que deseo', wishOthers: n + ' de 23 · Lo que desean otros', genre: n + ' de 248 · Ciencia ficción · #clásicos' }[v],
      panel: !!this.props.panel, panelVariant: this.props.panelVariant ?? 'missing'
    };
  }
  renderVals() {
    const o = this._rv();
    for (const [lk, k, a] of [["views","bg","var(--background)"],["filters","bd","var(--primary)"],["rows","bg","var(--muted)"],["rows","wTone","var(--wish)"],["rows","stTone","var(--muted-foreground)"]]) {
      if (!lk) { o['_c_' + k] = o[k] === a; o['_nc_' + k] = !o['_c_' + k]; continue; }
      (o[lk] || []).forEach(it => { it['_c_' + k] = it[k] === a; it['_nc_' + k] = !it['_c_' + k]; });
    }
    return o;
  }
}
</script>
</body>
</html>
