<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./ds-base.js"></script></helmet><div class="{{ theme }}" style="width:1280px;height:800px;display:flex;overflow:hidden;background:var(--background);color:var(--foreground);font-family:var(--font-sans)"><dc-import name="Sidebar" active="series" hint-size="256px,100%"></dc-import><div style="flex:1;min-width:0;display:flex;flex-direction:column"><dc-import name="TopBar" hint-size="100%,56px"></dc-import><main style="flex:1;min-height:0;display:flex;flex-direction:column;padding:20px 32px;gap:16px"><div style="display:flex;align-items:flex-end;gap:12px"><div style="flex:1;display:flex;flex-direction:column;gap:4px"><span style="font-size:13px;color:var(--muted-foreground)">Series ›</span><h1 style="margin:0;font-size:24px;font-weight:600;letter-spacing:-0.02em">{{ name }}</h1><span style="font-size:13.5px;color:var(--muted-foreground)">{{ sub }}</span></div><sc-if value="{{ idle }}" hint-placeholder-val="{{ true }}"><div style="display:flex;gap:8px"><button style="height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);display:flex;align-items:center;gap:6px;font:500 13px var(--font-sans)"><x-import component-from-global-scope="Library.PencilIcon" size="14" hint-size="14px,14px"></x-import>Renombrar</button><sc-if value="{{ ordered }}" hint-placeholder-val="{{ true }}"><button style="height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--border);background:var(--background);color:var(--foreground);display:flex;align-items:center;gap:6px;font:500 13px var(--font-sans)"><x-import component-from-global-scope="Library.ArrowUpDownIcon" size="14" hint-size="14px,14px"></x-import>Reordenar</button></sc-if><button style="height:36px;padding:0 12px;border-radius:8px;border:0;background:var(--primary);color:var(--primary-foreground);display:flex;align-items:center;gap:6px;font:600 13px var(--font-sans)"><x-import component-from-global-scope="Library.PlusIcon" size="14" hint-size="14px,14px"></x-import>Añadir obra</button></div></sc-if><sc-if value="{{ reorder }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:10px"><span style="font-size:13px;color:var(--muted-foreground)">Arrastra o escribe el número</span><button style="height:36px;padding:0 14px;border-radius:8px;border:0;background:var(--primary);color:var(--primary-foreground);font:600 13px var(--font-sans)">Hecho</button></div></sc-if></div><div style="flex:1;min-height:0;display:flex;flex-direction:column;gap:6px;overflow:hidden"><sc-for list="{{ items }}" as="i" hint-placeholder-count="6"><sc-if value="{{ i._c_line }}" hint-placeholder-val="{{ false }}"><div style="display:flex;align-items:center;gap:14px;padding:8px 12px;border-radius:10px;border:1px solid var(--border);background:var(--background);opacity:1"><sc-if value="{{ i.drag }}" hint-placeholder-val="{{ false }}"><span style="color:var(--muted-foreground);display:flex"><x-import component-from-global-scope="Library.GripVerticalIcon" size="16" hint-size="16px,16px"></x-import></span></sc-if><sc-if value="{{ i.num }}" hint-placeholder-val="{{ true }}"><sc-if value="{{ i._c_numBd }}" hint-placeholder-val="{{ false }}"><span style="width:34px;height:30px;border-radius:7px;border:1px solid var(--ring);display:flex;align-items:center;justify-content:center;font:600 14px var(--font-mono)">{{ i.n }}</span></sc-if><sc-if value="{{ i._nc_numBd }}" hint-placeholder-val="{{ true }}"><span style="width:34px;height:30px;border-radius:7px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font:600 14px var(--font-mono)">{{ i.n }}</span></sc-if></sc-if><sc-if value="{{ i._c_cw }}" hint-placeholder-val="{{ false }}"><dc-import name="Cover" kind="{{ i.kind }}" size="{{ 52 }}" style="width:52px;height:52px;flex-shrink:0" hint-size="40px,52px"></dc-import></sc-if><sc-if value="{{ i._nc_cw }}" hint-placeholder-val="{{ true }}"><dc-import name="Cover" kind="{{ i.kind }}" size="{{ 52 }}" style="width:36px;height:52px;flex-shrink:0" hint-size="40px,52px"></dc-import></sc-if><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600">{{ i.title }}</span><span style="font-size:13px;color:var(--muted-foreground)">{{ i.meta }}</span></div><sc-if value="{{ i.warn }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--warning)"><x-import component-from-global-scope="Library.TriangleAlertIcon" size="14" hint-size="14px,14px"></x-import>Necesita Catán</span></sc-if><sc-if value="{{ i.wish }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--wish)"><x-import component-from-global-scope="Library.GiftIcon" size="14" hint-size="14px,14px"></x-import>{{ i.wishTxt }}</span></sc-if><sc-if value="{{ i._c_stTone }}" hint-placeholder-val="{{ false }}"><span style="width:96px;text-align:right;font-size:12.5px;font-weight:500;color:var(--foreground)">{{ i.st }}</span></sc-if><sc-if value="{{ i._nc_stTone }}" hint-placeholder-val="{{ true }}"><span style="width:96px;text-align:right;font-size:12.5px;font-weight:500;color:var(--muted-foreground)">{{ i.st }}</span></sc-if><sc-if value="{{ i.gapAct }}" hint-placeholder-val="{{ false }}"><button style="height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 12.5px var(--font-sans)">{{ i.act }}</button></sc-if></div></sc-if><sc-if value="{{ i._nc_line }}" hint-placeholder-val="{{ true }}"><div style="display:flex;align-items:center;gap:14px;padding:8px 12px;border-radius:10px;border:1px dashed color-mix(in oklch,var(--foreground) 30%,transparent);background:var(--muted);opacity:1"><sc-if value="{{ i.drag }}" hint-placeholder-val="{{ false }}"><span style="color:var(--muted-foreground);display:flex"><x-import component-from-global-scope="Library.GripVerticalIcon" size="16" hint-size="16px,16px"></x-import></span></sc-if><sc-if value="{{ i.num }}" hint-placeholder-val="{{ true }}"><sc-if value="{{ i._c_numBd }}" hint-placeholder-val="{{ false }}"><span style="width:34px;height:30px;border-radius:7px;border:1px solid var(--ring);display:flex;align-items:center;justify-content:center;font:600 14px var(--font-mono)">{{ i.n }}</span></sc-if><sc-if value="{{ i._nc_numBd }}" hint-placeholder-val="{{ true }}"><span style="width:34px;height:30px;border-radius:7px;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font:600 14px var(--font-mono)">{{ i.n }}</span></sc-if></sc-if><sc-if value="{{ i._c_cw }}" hint-placeholder-val="{{ false }}"><dc-import name="Cover" kind="{{ i.kind }}" size="{{ 52 }}" style="width:52px;height:52px;flex-shrink:0" hint-size="40px,52px"></dc-import></sc-if><sc-if value="{{ i._nc_cw }}" hint-placeholder-val="{{ true }}"><dc-import name="Cover" kind="{{ i.kind }}" size="{{ 52 }}" style="width:36px;height:52px;flex-shrink:0" hint-size="40px,52px"></dc-import></sc-if><div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600">{{ i.title }}</span><span style="font-size:13px;color:var(--muted-foreground)">{{ i.meta }}</span></div><sc-if value="{{ i.warn }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--warning)"><x-import component-from-global-scope="Library.TriangleAlertIcon" size="14" hint-size="14px,14px"></x-import>Necesita Catán</span></sc-if><sc-if value="{{ i.wish }}" hint-placeholder-val="{{ false }}"><span style="display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--wish)"><x-import component-from-global-scope="Library.GiftIcon" size="14" hint-size="14px,14px"></x-import>{{ i.wishTxt }}</span></sc-if><sc-if value="{{ i._c_stTone }}" hint-placeholder-val="{{ false }}"><span style="width:96px;text-align:right;font-size:12.5px;font-weight:500;color:var(--foreground)">{{ i.st }}</span></sc-if><sc-if value="{{ i._nc_stTone }}" hint-placeholder-val="{{ true }}"><span style="width:96px;text-align:right;font-size:12.5px;font-weight:500;color:var(--muted-foreground)">{{ i.st }}</span></sc-if><sc-if value="{{ i.gapAct }}" hint-placeholder-val="{{ false }}"><button style="height:30px;padding:0 10px;border-radius:7px;border:1px solid var(--border);background:var(--background);color:var(--foreground);font:500 12.5px var(--font-sans)">{{ i.act }}</button></sc-if></div></sc-if></sc-for></div></main></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:800},&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;],&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;ordered&quot;,&quot;unordered&quot;,&quot;reorder&quot;],&quot;default&quot;:&quot;ordered&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  _rv() {
    const m = this.props.mode ?? 'ordered';
    const ordered = m !== 'unordered', reorder = m === 'reorder';
    const O = [['1', 'Dune', '1965 · Tapa blanda, Ebook', 'own'], ['2', 'El mesías de Dune', '1969 · Tapa blanda', 'own'], ['3', 'Hijos de Dune', '1976', 'miss'], ['4', 'Dune: El emperador-dios', '1981', 'miss', 'Lo desea Hugo'], ['5', '', '', 'empty'], ['6', 'Casa Capitular: Dune', '1985 · Tapa dura', 'own']];
    const U = [['Catán', 'Juego base · 1995 · Caja', 'own'], ['Catán: Navegantes', 'Expansión · necesita Catán', 'miss', 'Lo deseas tú, Laura'], ['Catán: Ciudades y caballeros', 'Expansión · necesita Catán', 'own'], ['Catán Junior', '2007 · Caja', 'own'], ['Catán: El duelo', 'Para 2 · 2010', 'miss']];
    const row = (o) => {
      const own = o.st === 'own', empty = o.st === 'empty';
      return { ...o, drag: reorder, num: ordered, numBd: reorder ? 'var(--ring)' : 'var(--border)', line: own ? 'solid' : 'dashed', bd: own ? 'var(--border)' : 'color-mix(in oklch,var(--foreground) 30%,transparent)', bg: own ? 'var(--background)' : 'var(--muted)', op: reorder && empty ? 0.6 : 1, cw: o.kind === 'game' ? '52px' : '36px', st: own ? 'Lo tengo' : empty ? 'Hueco' : 'Me falta', stTone: own ? 'var(--foreground)' : 'var(--muted-foreground)', wish: !!o.w, wishTxt: o.w || '', warn: !!o.warn, gapAct: !own && !reorder, act: empty ? 'Apuntar aquí' : 'Lo tengo' };
    };
    const items = ordered
      ? O.map(([n, title, meta, st, w]) => row({ n, kind: 'book', title: st === 'empty' ? 'Sin apuntar' : title, meta: st === 'empty' ? 'Aquí falta el número 5' : meta, st, w }))
      : U.map(([title, meta, st, w], i) => row({ n: '', kind: 'game', title, meta, st, w, warn: false }));
    return {
      theme: this.props.theme ?? 'light', ordered, reorder, idle: !reorder, items,
      name: ordered ? 'Dune' : 'Catán', sub: ordered ? 'Saga con orden · tienes 3 de 6 · 2 te faltan y hay un hueco sin apuntar' : 'Línea sin orden · tienes 3 de 5 · también en «Juegos de Klaus Teuber»'
    };
  }
  renderVals() {
    const o = this._rv();
    for (const [lk, k, a] of [["items","line","solid"],["items","numBd","var(--ring)"],["items","cw","52px"],["items","stTone","var(--foreground)"]]) {
      if (!lk) { o['_c_' + k] = o[k] === a; o['_nc_' + k] = !o['_c_' + k]; continue; }
      (o[lk] || []).forEach(it => { it['_c_' + k] = it[k] === a; it['_nc_' + k] = !it['_c_' + k]; });
    }
    return o;
  }
}
</script>
</body>
</html>
