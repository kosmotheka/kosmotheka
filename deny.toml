# cargo-deny: what the Rust dependencies may be. CI runs `cargo deny check`.
# The audit (docs/audits/) also scans them with osv-scanner; this is the gate.

[graph]
all-features = true

[advisories]
# Unmaintained crates deep in Tauri's tree are reported, not fatal: there is
# nothing to switch to until Tauri does (audit SEG-008).
unmaintained = "workspace"
ignore = []

[licenses]
# Compatible with distributing the app under the AGPL-3.0-or-later.
allow = [
  "AGPL-3.0-or-later",
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "ISC",
  "0BSD",
  "Zlib",
  "Unicode-3.0",
  "CC0-1.0",
  "BSL-1.0",
  "Unlicense",
  "MPL-2.0",
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
# Several versions of one crate are common under Tauri; report them, do not fail.
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
