[workspace]
resolver = "3"
members = ["app/src-tauri", "crates/domain"]

[workspace.package]
version = "0.4.0"
edition = "2024"
license = "AGPL-3.0-or-later"
authors = ["Kosmotheka contributors"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Clippy's defaults, plus the pedantic lints that can hide a real bug: numbers
# cut or sign-flipped by `as`, extensions compared case-sensitively, time going
# below zero. CI runs clippy with -D warnings, so these fail the build.
[workspace.lints.clippy]
cast_possible_truncation = "warn"
cast_possible_wrap = "warn"
cast_sign_loss = "warn"
case_sensitive_file_extension_comparisons = "warn"
unchecked_time_subtraction = "warn"

# scrypt with 128 MiB of memory is unusably slow unoptimized (`tauri dev`, tests).
[profile.dev.package.scrypt]
opt-level = 3
[profile.dev.package.salsa20]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3

# Reducing a cover unoptimized takes seconds (D82): decoding, resizing and encoding always run optimized.
[profile.dev.package.image]
opt-level = 3
[profile.dev.package.zune-jpeg]
opt-level = 3
[profile.dev.package.png]
opt-level = 3
[profile.dev.package.fdeflate]
opt-level = 3
[profile.dev.package.image-webp]
opt-level = 3
[profile.dev.package.libwebp-sys]
opt-level = 3
