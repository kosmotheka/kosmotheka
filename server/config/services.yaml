# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Where the fixtures write the cast for the app (docs/development/fixtures.md).
    app.fixtures_cast_file: '%kernel.project_dir%/var/fixtures/cast.json'
    # Who signs the Mercure tokens; the hub trusts it (MERCURE_TRUSTED_ISSUERS in docker-compose.yaml).
    app.mercure_issuer: 'urn:kosmotheka:server'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $mailerFrom: '%env(MAILER_FROM)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Fixtures extend a dev-only bundle: they exist only in dev and test (below).
        exclude: '../src/DataFixtures/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Security\EmailCodeIssuer:
        bind:
            $secret: '%kernel.secret%'

    # The subscriber tokens given to devices: its own key, never the publisher's.
    App\Sync\HubSettings:
        arguments:
            $url: '%env(MERCURE_URL)%'
            $subscriberKey: '%env(MERCURE_SUBSCRIBER_JWT_KEY)%'
            $issuer: '%app.mercure_issuer%'

    # Encrypts the private key of each cloud library (D95); empty means no cloud identity (D18).
    App\Security\CloudKeyVault:
        arguments:
            $secret: '%env(CLOUD_KEY_SECRET)%'

when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        App\DataFixtures\:
            resource: '../src/DataFixtures/'

when@test:
    parameters:
        app.fixtures_cast_file: '%kernel.project_dir%/var/fixtures/cast.test.json'
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        App\DataFixtures\:
            resource: '../src/DataFixtures/'
        # Records what would be published, instead of calling a hub.
        App\Tests\Support\RecordingHub:
            public: true
        Symfony\Component\Mercure\HubInterface: '@App\Tests\Support\RecordingHub'
        # Google, in memory: the tests never touch the network.
        App\Tests\Support\FakeGoogle:
            public: true
        App\Security\Google\GoogleSignIn: '@App\Tests\Support\FakeGoogle'
