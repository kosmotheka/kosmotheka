# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # Where the fixtures write the cast for the app (docs/development/fixtures.md).
    app.fixtures_cast_file: '%kernel.project_dir%/var/fixtures/cast.json'
    # Who signs the Mercure tokens; the hub trusts it (MERCURE_TRUSTED_ISSUERS in docker-compose.yaml).
    app.mercure_issuer: 'urn:kosmotheka:server'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.
        bind:
            $mailerFrom: '%env(MAILER_FROM)%'

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'
        # Fixtures extend a dev-only bundle: they exist only in dev and test (below).
        exclude: '../src/DataFixtures/'

    # RAWG and Comic Vine only take their key in the address of the call, so they are asked with a client of their
    # own (7.8): see App\Metadata\UnloggedClientFactory. The tests replace these with the providers in memory.
    app.http_client.rawg:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['App\Metadata\UnloggedClientFactory', 'create']
    App\Metadata\RawgHttpSource:
        arguments:
            $httpClient: '@app.http_client.rawg'
    app.http_client.comic_vine:
        class: Symfony\Contracts\HttpClient\HttpClientInterface
        factory: ['App\Metadata\UnloggedClientFactory', 'create']
    App\Metadata\ComicVineHttpSource:
        arguments:
            $httpClient: '@app.http_client.comic_vine'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
    App\Security\EmailCodeIssuer:
        bind:
            $secret: '%kernel.secret%'

    # The subscriber tokens given to devices: its own key, never the publisher's.
    App\Sync\HubSettings:
        arguments:
            $url: '%env(MERCURE_URL)%'
            $subscriberKey: '%env(MERCURE_SUBSCRIBER_JWT_KEY)%'
            $issuer: '%app.mercure_issuer%'

    # Encrypts the private key of each cloud library (D95); empty means no cloud identity (D18).
    App\Security\CloudKeyVault:
        arguments:
            $secret: '%env(CLOUD_KEY_SECRET)%'

when@dev:
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        App\DataFixtures\:
            resource: '../src/DataFixtures/'

when@test:
    parameters:
        app.fixtures_cast_file: '%kernel.project_dir%/var/fixtures/cast.test.json'
    services:
        _defaults:
            autowire: true
            autoconfigure: true
        App\DataFixtures\:
            resource: '../src/DataFixtures/'
        # Records what would be published, instead of calling a hub.
        App\Tests\Support\RecordingHub:
            public: true
        Symfony\Component\Mercure\HubInterface: '@App\Tests\Support\RecordingHub'
        # Google, in memory: the tests never touch the network.
        App\Tests\Support\FakeGoogle:
            public: true
        App\Security\Google\GoogleSignIn: '@App\Tests\Support\FakeGoogle'
        # Google Books, in memory: the real provider runs, over a scripted http client; the tests never touch the network.
        app.http_client.google_books_test:
            class: Symfony\Component\HttpClient\MockHttpClient
            factory: ['App\Tests\Support\FakeGoogleBooksApi', 'client']
        App\Metadata\GoogleBooksHttpProvider:
            arguments:
                $httpClient: '@app.http_client.google_books_test'
        # TMDB, in memory: the same.
        app.http_client.tmdb_test:
            class: Symfony\Component\HttpClient\MockHttpClient
            factory: ['App\Tests\Support\FakeTmdbApi', 'client']
        App\Metadata\TmdbHttpSource:
            arguments:
                $httpClient: '@app.http_client.tmdb_test'
        # BoardGameGeek and RPGGeek, in memory: the same.
        app.http_client.bgg_test:
            class: Symfony\Component\HttpClient\MockHttpClient
            factory: ['App\Tests\Support\FakeBggApi', 'client']
        App\Metadata\BggHttpSource:
            arguments:
                $httpClient: '@app.http_client.bgg_test'
        # RAWG, in memory: the same.
        app.http_client.rawg:
            class: Symfony\Component\HttpClient\MockHttpClient
            factory: ['App\Tests\Support\FakeRawgApi', 'client']
        # Comic Vine, in memory: the same.
        app.http_client.comic_vine:
            class: Symfony\Component\HttpClient\MockHttpClient
            factory: ['App\Tests\Support\FakeComicVineApi', 'client']
        # The log, in memory: a test can say that something never reached it.
        logger:
            class: App\Tests\Support\RecordingLogger
            public: true
