security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # https://symfony.com/doc/current/security.html#loading-the-user-the-user-provider
    providers:
        users:
            entity:
                class: App\Entity\User
                property: email

    # D51: ROLE_SUPER_ADMIN is assigned only from the console.
    role_hierarchy:
        ROLE_ADMIN: ROLE_USER
        ROLE_SUPER_ADMIN: [ROLE_ADMIN, ROLE_ALLOWED_TO_SWITCH]

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler|_wdt|assets|build)/
            security: false
        # Matched before "main" (first match wins): the account API, stateless,
        # authenticated per request with a device token (milestone 7.1, part 2,
        # docs/architecture/accounts.md), never a session.
        api:
            pattern: ^/v1
            stateless: true
            provider: users
            custom_authenticators:
                - App\Security\DeviceTokenAuthenticator
            entry_point: App\Security\DeviceTokenAuthenticator
            user_checker: App\Security\UserChecker
        main:
            lazy: true
            provider: users

            # Activate different ways to authenticate:
            # https://symfony.com/doc/current/security.html#the-firewall

            # https://symfony.com/doc/current/security/impersonating_user.html
            # switch_user: true

    # Note: Only the *first* matching rule is applied.
    access_control:
        - { path: ^/v1/account/password/(forgot|reset)$, roles: PUBLIC_ACCESS }
        - { path: ^/v1/account/(register|confirm|code)$, roles: PUBLIC_ACCESS }
        - { path: ^/v1/auth/(challenge|login)$, roles: PUBLIC_ACCESS }
        - { path: ^/v1/server$, roles: PUBLIC_ACCESS }
        # Looking at an invitation by its token needs no session (D43); accepting one does.
        - { path: '^/v1/cloud/invitations/[^/]+$', methods: [GET], roles: PUBLIC_ACCESS }
        - { path: ^/v1, roles: ROLE_USER }
        # - { path: ^/admin, roles: ROLE_ADMIN }
        # - { path: ^/profile, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
