# Limits proposed in docs/architecture/accounts.md. App\Security\RequestLimiter
# is the only consumer; controllers never touch the factories directly.
framework:
    rate_limiter:
        registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        # Per address; a family behind one router shares it (SEG-051), so it is wide. The challenge and the login spend it.
        login:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        # Per account, and only for failures: whoever guesses a password gets five tries, from any number of addresses.
        # The key is a fingerprint of the address typed, so an address with no account is counted the same way.
        login_failed_account:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # «Continuar con Google» (D77): starting, going to Google, coming back and finishing, per address.
        google:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        # Books looked up through the server (7.8, D83): per account, cache hits included; and the server's own share of
        # Google Books' free quota (1,000 a day), counted on real calls only. The key of the second is the same for all.
        metadata_account:
            policy: sliding_window
            limit: 600
            interval: '1 hour'
        google_books_calls:
            policy: sliding_window
            limit: 900
            interval: '1 day'
        # TMDB (7.8, D62): the server's own cap on real calls, a search and each detail being one. The key is the same for all.
        tmdb_calls:
            policy: sliding_window
            limit: 5000
            interval: '1 day'
        # RAWG (7.8, D62): free up to 20,000 requests a month, so the server's share is 600 real calls a day (a search and
        # the details of its first three being up to four). The key is the same for all.
        rawg_calls:
            policy: sliding_window
            limit: 600
            interval: '1 day'
        # Comic Vine (7.8, D62): it supports 200 requests an hour per resource, so the server keeps to 150 of each of the
        # three it calls (the search, the detail of a series, the detail of an issue). The key is the same for all.
        comic_vine_search:
            policy: sliding_window
            limit: 150
            interval: '1 hour'
        comic_vine_volume:
            policy: sliding_window
            limit: 150
            interval: '1 hour'
        comic_vine_issue:
            policy: sliding_window
            limit: 150
            interval: '1 hour'
        email_code:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        email_per_address:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
        # Per account, so trying TOTP codes from many IPs does not help (D78).
        two_factor:
            policy: sliding_window
            limit: 5
            interval: '15 minutes'
        # Invitations (milestone 7.6.1, D43). Making them, per account.
        invitation_create:
            policy: sliding_window
            limit: 20
            interval: '1 hour'
        # Invitations by email: per account and day, and per recipient and day (a keyed fingerprint).
        invitation_email:
            policy: sliding_window
            limit: 10
            interval: '1 day'
        # Per recipient, two ways (SEG-044): per pair (library, address), so another library cannot use up what this
        # one may send, and in all per address, so no address is flooded from many libraries.
        invitation_recipient_library:
            policy: sliding_window
            limit: 3
            interval: '1 day'
        invitation_recipient:
            policy: sliding_window
            limit: 10
            interval: '1 day'
        # Looking at or accepting one, per IP; accepting also per account.
        invitation_lookup:
            policy: sliding_window
            limit: 30
            interval: '15 minutes'
        invitation_accept:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
