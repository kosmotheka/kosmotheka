# Limits proposed in docs/architecture/accounts.md. App\Security\RequestLimiter
# is the only consumer; controllers never touch the factories directly.
framework:
    rate_limiter:
        registration:
            policy: sliding_window
            limit: 5
            interval: '1 hour'
        login:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        email_code:
            policy: sliding_window
            limit: 10
            interval: '15 minutes'
        email_per_address:
            policy: sliding_window
            limit: 3
            interval: '15 minutes'
