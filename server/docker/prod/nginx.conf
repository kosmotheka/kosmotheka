# HTTP only, on a local port: the TLS proxy in front (nginx with Certbot, or whatever the
# machine already has) terminates HTTPS and forwards here (D48).

# Addresses that are never written to the access log: Google's return trip carries a secret,
# and /v1/metadata/ carries what an account looks up.
map $request_uri $loggable {
    ~^/v1/auth/google/(connect|callback)(\?|$) 0;
    ~^/v1/metadata/ 0;
    default 1;
}

server {
    listen 8080 default_server;
    server_name _;
    root /app/server/public;
    server_tokens off;
    client_max_body_size 16m;

    # Live notices (optional: only if the `mercure` profile is on). The upstream sits in a
    # variable so nginx starts when the hub is not there.
    location /.well-known/mercure {
        resolver 127.0.0.11 valid=10s;
        set $mercure_upstream http://mercure;
        proxy_pass $mercure_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # The server is an API: every path goes to Symfony.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php:9000;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /app/server/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /app/server/public;
        fastcgi_read_timeout 300;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    access_log /dev/stdout combined if=$loggable;
    error_log /dev/stderr warn;
}
