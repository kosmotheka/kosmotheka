# Development environment for the sync server. Modelled on Riddle's, with these
# changes:
#
#  1. PostgreSQL instead of MySQL (docs/DECISIONS.md, D07), and its data in a
#     named volume rather than a bind mount: a bind mount would fill the repo
#     tree with files owned by the postgres user.
#  2. PHP 8.5.
#  3. Its own ports and subnet, so it runs alongside every other project.
#     Taken on this machine when this was written: subnets 172.152, .162, .169,
#     .171, .172, .188, .189, .190, .192; ports 3001, 3307, 8080-8082, 8089,
#     8095, 8097, 8099 (8097 is Mailpit's web UI, milestone 7.1). Check again
#     before changing them:
#
#         grep -rhoE 'subnet:\s*172\.[0-9]+\.' ~/Proyectos/personales/*/docker*/*.y*ml
#         grep -oE '^17[0-9]\.[0-9]+\.' /etc/hosts
#
# The Tauri app (../../app) does not use Docker at all.

services:
    db_kosmotheka:
        container_name: db_kosmotheka
        image: postgres:18
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            # UTC for the same reason as in Riddle: a zone that depends on the
            # host skews every timestamp silently.
            TZ: UTC
            PGTZ: UTC
        volumes:
            - db_kosmotheka:/var/lib/postgresql
            # Creates the test database on the first start (see the script).
            - ./postgres/init:/docker-entrypoint-initdb.d:ro
        ports:
            - "5433:5432"
        networks:
            default:
                ipv4_address: 172.194.0.10

    php_kosmotheka:
        container_name: php_kosmotheka
        build:
            context: php
            args:
                TIMEZONE: ${TIMEZONE}
                APP_NAME: ${SYMFONY_APP_NAME}
        volumes:
            - ${SYMFONY_APP_PATH}:/var/www/${SYMFONY_APP_NAME}
            # The operation spec is shared with the Rust app: the server runs the
            # same conformance cases (docs/DECISIONS.md, D06). Read-only.
            - ${SPEC_PATH}:/var/www/spec:ro
            - ./logs/${SYMFONY_APP_NAME}:/var/www/${SYMFONY_APP_NAME}/var/log
        depends_on:
            - db_kosmotheka
        networks:
            default:
                ipv4_address: 172.194.0.11

    nginx_kosmotheka:
        container_name: nginx_kosmotheka
        build:
            context: nginx
            args:
                APP_NAME: ${SYMFONY_APP_NAME}
        ports:
            - "8095:80"
        volumes:
            - ${SYMFONY_APP_PATH}:/var/www/${SYMFONY_APP_NAME}
            - ./logs/nginx/:/var/log/nginx
            # Mounted, not only copied, so a reload is enough after an edit
            # (the trap Riddle's compose documents).
            - ./nginx/kosmotheka.local.conf:/etc/nginx/sites-available/kosmotheka.local.conf:ro
        depends_on:
            - php_kosmotheka
            - mercure_kosmotheka
        networks:
            default:
                ipv4_address: 172.194.0.12

    mailpit_kosmotheka:
        container_name: mailpit_kosmotheka
        # Pinned to a concrete release, not :latest, so an upgrade is deliberate.
        image: axllent/mailpit:v1.27.5
        ports:
            # Web UI only; SMTP (1025) stays on the internal network, reached
            # by MAILER_DSN in .env.local (docs/development/server.md).
            - "8097:8025"
        networks:
            default:
                ipv4_address: 172.194.0.13

    mercure_kosmotheka:
        container_name: mercure_kosmotheka
        # The live-notices hub (milestone 7.3, D75): a separate container because
        # PHP-FPM cannot hold open connections. Pinned, so an upgrade is deliberate.
        image: dunglas/mercure:v1.0.3
        # No published port: the app reaches it through nginx
        # (/.well-known/mercure), and Symfony publishes over the internal network.
        environment:
            # Plain HTTP inside the network; TLS is nginx's job. A catch-all site
            # accepts any Host, so the audience is pinned below.
            SERVER_NAME: ':80'
            # Who may sign tokens (RFC 9068 `iss`), and the audience they carry
            # (`aud`). Must match App\Sync\EventsToken::ISSUER and MERCURE_URL.
            MERCURE_TRUSTED_ISSUERS: 'urn:kosmotheka:server'
            MERCURE_EXTRA_DIRECTIVES: 'resource_identifier http://mercure_kosmotheka/.well-known/mercure'
            # Two different keys: the one that publishes never goes to a client,
            # and the one given out as subscriber tokens cannot publish.
            MERCURE_PUBLISHER_JWT_KEY: ${MERCURE_PUBLISHER_JWT_KEY:?set it in docker/.env (docs/development/server.md)}
            MERCURE_PUBLISHER_JWT_ALG: HS256
            MERCURE_SUBSCRIBER_JWT_KEY: ${MERCURE_SUBSCRIBER_JWT_KEY:?set it in docker/.env (docs/development/server.md)}
            MERCURE_SUBSCRIBER_JWT_ALG: HS256
            # Not set, on purpose, because the defaults are the safe ones: anonymous
            # subscribers off, subscriptions API off, no CORS (the client is native
            # Rust, not a browser), heartbeat 40s.
        networks:
            default:
                ipv4_address: 172.194.0.14

volumes:
    db_kosmotheka:

networks:
    default:
        driver: bridge
        ipam:
            driver: default
            config:
                - subnet: 172.194.0.0/24
                  gateway: 172.194.0.1
