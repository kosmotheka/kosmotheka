user www-data;
worker_processes 2;
pid /run/nginx.pid;

events {
  worker_connections 1024;
  multi_accept on;
  use epoll;
}

http {
  server_tokens off;
  sendfile on;
  tcp_nopush on;
  tcp_nodelay on;
  keepalive_timeout 15;
  types_hash_max_size 2048;
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  # Error log kept while the project is being built:
  # a mute 502 costs half an hour.
  access_log off;
  error_log /var/log/nginx/error.log warn;

  # The two addresses a browser visits on its way through Google carry a secret in the query (the attempt, Google's
  # code): they are never written to the access log (D77, docs/architecture/accounts.md).
  map $request_uri $loggable {
    ~^/v1/auth/google/(connect|callback)(\?|$) 0;
    # What an account looks up (an ISBN) is nobody's business but the account's (7.8, D83).
    ~^/v1/metadata/ 0;
    default 1;
  }

  gzip on;
  gzip_disable "msie6";
  include /etc/nginx/conf.d/*.conf;
  include /etc/nginx/sites-enabled/*;
  open_file_cache max=100;
  client_header_timeout 300;
  client_body_timeout 300;
  fastcgi_read_timeout 300;
  client_max_body_size 16m;
  fastcgi_buffers 8 128k;
  fastcgi_buffer_size 128k;
}

daemon off;
