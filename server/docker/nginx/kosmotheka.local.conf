server {
    listen 80 default_server;
    server_name kosmotheka.local localhost;
    root /var/www/kosmotheka.local/public;

    # Live notices (milestone 7.3): Server-Sent Events, so no buffering, a long
    # read timeout and HTTP/1.1 towards the hub. The upstream sits in a variable
    # so nginx still starts when the hub is down (it resolves at request time).
    location /.well-known/mercure {
        resolver 127.0.0.11 valid=10s;
        set $mercure_upstream http://mercure_kosmotheka;
        proxy_pass $mercure_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        proxy_send_timeout 24h;
    }

    # The server is an API: every path goes to Symfony.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ ^/index\.php(/|$) {
        fastcgi_pass php-upstream;
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $document_root;
        fastcgi_param HTTPS off;
        fastcgi_read_timeout 300;
        internal;
    }

    location ~ \.php$ {
        return 404;
    }

    error_log /var/log/nginx/kosmotheka_error.log;
    access_log /var/log/nginx/kosmotheka_access.log combined if=$loggable;
}
