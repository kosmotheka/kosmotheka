confirm_email:
    subject: 'Confirma tu cuenta de Kosmotheka'
    body: 'Tu código de confirmación es %code%. Caduca en %minutes% minutos. Si no has sido tú, puedes ignorar este correo.'
reset_password:
    subject: 'Recupera tu contraseña de Kosmotheka'
    body: 'Tu código para restablecer la contraseña es %code%. Caduca en %minutes% minutos. Si no has sido tú, puedes ignorar este correo.'
existing_account:
    subject: 'Alguien ha intentado usar tu correo en Kosmotheka'
    body: 'Alguien ha intentado crear una cuenta de Kosmotheka con esta dirección, que ya tiene una. Si has sido tú, puedes iniciar sesión o recuperar tu contraseña. Si no has sido tú, puedes ignorar este correo.'
password_changed:
    subject: 'Se ha cambiado tu contraseña de Kosmotheka'
    body: 'Se acaba de cambiar la contraseña de tu cuenta de Kosmotheka. Si has sido tú, puedes ignorar este correo. Si no has sido tú, tus otros dispositivos se han desconectado; contacta con nosotros si crees que tu cuenta se ha visto comprometida.'
two_factor_enabled:
    subject: 'Segundo factor activado en tu cuenta de Kosmotheka'
    body: 'Se acaba de activar un segundo factor (una app de autenticación y códigos de reserva) en tu cuenta de Kosmotheka. Si no has sido tú, contacta con nosotros: puede significar que alguien más tiene acceso a tu cuenta.'
two_factor_disabled:
    subject: 'Segundo factor retirado de tu cuenta de Kosmotheka'
    body: 'Se acaba de retirar el segundo factor de tu cuenta de Kosmotheka; iniciar sesión solo necesita de nuevo tu contraseña. Si no has sido tú, contacta con nosotros: puede significar que alguien más tiene acceso a tu cuenta.'
invitation:
    subject: 'Te han invitado a una biblioteca en Kosmotheka'
    body: "Te han invitado a una biblioteca en Kosmotheka.\n\nAbre este enlace en el dispositivo donde usas Kosmotheka, en las próximas 24 horas:\n%link%\n\nTendrás que iniciar sesión, o crear una cuenta, con esta misma dirección de correo. Si no esperabas esto, puedes ignorar este correo."
