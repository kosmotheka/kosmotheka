confirm_email:
    subject: 'Confirma tu cuenta de Kosmotheka'
    body: 'Tu código de confirmación es %code%. Caduca en %minutes% minutos. Si no has sido tú, puedes ignorar este correo.'
reset_password:
    subject: 'Recupera tu contraseña de Kosmotheka'
    body: 'Tu código para restablecer la contraseña es %code%. Caduca en %minutes% minutos. Si no has sido tú, puedes ignorar este correo.'
existing_account:
    subject: 'Alguien ha intentado usar tu correo en Kosmotheka'
    body: 'Alguien ha intentado crear una cuenta de Kosmotheka con esta dirección, que ya tiene una. Si has sido tú, puedes iniciar sesión o recuperar tu contraseña. Si no has sido tú, puedes ignorar este correo.'
password_changed:
    subject: 'Se ha cambiado tu contraseña de Kosmotheka'
    body: 'Se acaba de cambiar la contraseña de tu cuenta de Kosmotheka. Si has sido tú, puedes ignorar este correo. Si no has sido tú, tus otros dispositivos se han desconectado; contacta con nosotros si crees que tu cuenta se ha visto comprometida.'
