confirm_email:
    subject: 'Confirm your Kosmotheka account'
    body: 'Your confirmation code is %code%. It expires in %minutes% minutes. If you did not ask for this, you can ignore this email.'
reset_password:
    subject: 'Reset your Kosmotheka password'
    body: 'Your password reset code is %code%. It expires in %minutes% minutes. If you did not ask for this, you can ignore this email.'
existing_account:
    subject: 'Someone tried to use your email on Kosmotheka'
    body: 'Someone tried to create a Kosmotheka account with this email address, which already has one. If it was you, you can sign in or recover your password. If it was not you, you can ignore this email.'
password_changed:
    subject: 'Your Kosmotheka password was changed'
    body: 'The password of your Kosmotheka account was just changed. If it was you, you can ignore this email. If it was not you, your other devices have been signed out; contact us if you think your account was compromised.'
two_factor_enabled:
    subject: 'Second factor enabled on your Kosmotheka account'
    body: 'A second factor (an authenticator app and backup codes) was just enabled on your Kosmotheka account. If it was not you, contact us: it means someone else may have access to your account.'
two_factor_disabled:
    subject: 'Second factor removed from your Kosmotheka account'
    body: "Your Kosmotheka account's second factor was just removed; signing in now only needs your password again. If it was not you, contact us: it means someone else may have access to your account."
invitation:
    subject: 'You have been invited to a library on Kosmotheka'
    body: "You have been invited to the library «%library%» on Kosmotheka.\n\nOpen this link on the device where you use Kosmotheka, within 24 hours:\n%link%\n\nYou will need to sign in, or create an account, with this same email address. If you were not expecting this, you can ignore this email."
