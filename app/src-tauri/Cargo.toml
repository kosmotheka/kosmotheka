[package]
name = "library-app"
description = "Household library catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# Distinct from the binary name to avoid a Windows linker clash (rust-lang/cargo#8519).
name = "library_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite_migration = "2.6.0"
thiserror = "2.0.21"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v7"] }
library-domain = { version = "0.1.0", path = "../../crates/domain" }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread"] }
sha2 = "0.11.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
url = "2.5.8"
