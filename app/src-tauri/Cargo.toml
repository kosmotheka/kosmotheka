[package]
name = "kosmotheka"
description = "Kosmotheka: catalog what your household owns"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[lib]
# Distinct from the binary name to avoid a Windows linker clash (rust-lang/cargo#8519).
name = "kosmotheka_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite_migration = "2.6.0"
thiserror = "2.0.21"
rusqlite = { version = "0.40.2", features = ["bundled"] }
uuid = { version = "1.26.1", features = ["v7"] }
kosmotheka-domain = { version = "0.7.0", path = "../../crates/domain" }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
sha2 = "0.11.0"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
roxmltree = "0.21"
url = "2.5.8"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
csv = "1.4.0"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
axum = { version = "0.8.9", default-features = false, features = ["json", "tokio", "http1"] }
hyper-util = { version = "0.1.21", features = ["server-auto", "tokio", "service"] }
tokio-rustls = { version = "0.26.5", default-features = false, features = ["ring", "tls12"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rcgen = { version = "0.14.10", default-features = false, features = ["ring", "pem"] }
if-addrs = "0.15.0"
base64 = "0.23.1"
rand = "0.10.3"
gethostname = "1.1.0"
scrypt = { version = "0.12.0", default-features = false }
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
tauri-plugin-deep-link = "2"
# Covers are read in pure Rust and written as WebP by libwebp, the reference encoder, built from source (D82).
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
libwebp-sys = "0.14.4"

# Camera barcode scanning, biometric unlock and reading printed text exist only on phones (D35, D78).
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-barcode-scanner = "2"
tauri-plugin-biometric = "2"
tauri-plugin-text-recognition = "0.1.1"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[lints]
workspace = true
