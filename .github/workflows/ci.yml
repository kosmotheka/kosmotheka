name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only token: the workflow only builds and tests, and a compromised action
# must not be able to push or publish (audit SEG-003).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Lint and test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          # The newest 22, not the one cached on the runner: a dependency may need a release from days ago.
          check-latest: true
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      # Tauri embeds the built UI at compile time, so it must exist before clippy and tests.
      - run: npm run build
        working-directory: app
      - run: npm run typecheck
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm run knip
        working-directory: app
      - run: npm run format:check
        working-directory: app
      - run: npm run check:spec
        working-directory: app
      - run: npm run check:codes
        working-directory: app
      - run: npm run check:i18n
        working-directory: app
      - run: npm run check:whats-new
        working-directory: app
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # After the build: `cargo tree` needs the crates, and the screen's list must still cover what ships.
      - run: npm run check:licenses
        working-directory: app

  rust-deps:
    name: Rust dependencies
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Licences, advisories, bans and sources, as deny.toml says.
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
      # Dependencies declared but never used. A release binary, checked against its sum.
      - name: cargo-machete
        run: |
          v=v0.9.2
          f=cargo-machete-$v-x86_64-unknown-linux-musl
          curl -sSLO "https://github.com/bnjbvr/cargo-machete/releases/download/$v/$f.tar.gz"
          curl -sSLO "https://github.com/bnjbvr/cargo-machete/releases/download/$v/$f.tar.gz.sha256"
          echo "$(cut -d' ' -f1 "$f.tar.gz.sha256")  $f.tar.gz" | sha256sum -c
          tar xzf "$f.tar.gz"
          "./$f/cargo-machete" .

  server:
    name: Server (PHP)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: server
    # The account tests need PostgreSQL, as `make db-test` gives them locally.
    # Doctrine appends "_test" to the database name, hence kosmotheka_test.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: kosmotheka_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://test:test@127.0.0.1:5432/kosmotheka?serverVersion=18&charset=utf8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: intl, pdo_pgsql, zip
          coverage: none
          tools: composer
      - run: composer install --no-interaction --no-progress
      # The same steps as `make check`, without Docker.
      - run: vendor/bin/php-cs-fixer fix --dry-run --diff
      - run: vendor/bin/rector process --dry-run
      # PHPStan reads the test container to know what each service is.
      - run: php bin/console cache:warmup --env=test
      - run: vendor/bin/phpstan analyse --memory-limit=1G
      - run: php bin/console doctrine:migrations:migrate --env=test --no-interaction --allow-no-migration
      - run: php bin/phpunit

  docs-site:
    name: Docs site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      # Only builds: where the site is published is decided apart (D90).
      - run: npm run build
        working-directory: site
      - run: npm run check:links
        working-directory: site

  build:
    name: Build desktop (${{ matrix.os }})
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Tauri system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          check-latest: true
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run tauri build -- --no-bundle
        if: runner.os == 'Linux'
        working-directory: app
      # NSIS installer for manual testing; it installs WebView2 if missing.
      - run: npm run tauri build -- --bundles nsis
        if: runner.os == 'Windows'
        working-directory: app
      - name: Upload Windows installer
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kosmotheka-windows-x64-setup
          path: target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 14
