name: Snap

# Builds the Snap Store package from snap/snapcraft.yaml and keeps it as a workflow artifact, to install and try by
# hand (`sudo snap install --dangerous kosmotheka_*.snap`). It publishes nothing: the Snap Store builds and publishes
# the package itself once the repository is connected to it (D74).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snap:
    name: Snap (amd64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: snapcore/action-build@3bdaa03e1ba6bf59a65f84a751d943d549a54e79 # v1.3.0
        id: build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: snap
          path: ${{ steps.build.outputs.snap }}
          if-no-files-found: error
          retention-days: 14
